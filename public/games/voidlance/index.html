<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060B1E">
<title>VOIDLANCE</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#060B1E;overflow:hidden;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #cv{position:fixed;inset:0;touch-action:none;display:block}
  #arc{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));
    font:600 12px -apple-system,'Helvetica Neue',system-ui,sans-serif;color:#5E729C;text-decoration:none;
    opacity:.8;letter-spacing:.08em;padding:6px 8px;z-index:5;display:none}
  #probe{position:fixed;left:env(safe-area-inset-left);top:env(safe-area-inset-top);
    right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);pointer-events:none;visibility:hidden}
</style></head>
<body>
<canvas id="cv"></canvas>
<a id="arc" href="/arcade">&#8962; arcade</a>
<div id="probe"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   VOIDLANCE — a rail shooter for the void-hearted
   DRAG steer · SWIPE barrel roll (deflects bolts) · 2-FINGER TAP nova
   Three sectors, three bosses, eight hulls to earn. Fly pretty.
   ═══════════════════════════════════════════════════════════════════════ */
"use strict";
(() => {
const TAU = Math.PI * 2;
const FONT = "-apple-system,'Helvetica Neue','Segoe UI',system-ui,sans-serif";

/* ── tunables ─────────────────────────────────────────────────────────── */
const CFG = {
  SHIP_Z: 120,          // ship distance from camera
  CAMF: .55,            // camera follow fraction (parallax)
  SPD0: 820,            // corridor scroll speed
  SPD_HI: 1260,         // set-piece throttle
  HZ: 520,              // enemy formation hold depth
  SPAWN_Z: 2300, OB_Z: 2500,
  BOLT_SPD: [470, 545, 625],   // enemy bolt speed per sector
  LASER_SPD: 2900, FIRE_T: .12,
  SHIP_R: 10, HULL: 5, LIVES: 3, NOVA_MAX: 2,
  ROLL_T: .52, ROLL_CD: .74, DEFL_R: 46, DEFL_Z: 270,
  INV_T: 1.4, CHAIN_T: 1.5, CHAIN_MAX: 8,
  DRAG: 1.4, KB_SPD: 300,
  BOSS_T: [78, 82, 86], // boss arrival second per sector
  BOLT_CAP: 60,
};
const SCORES = { dart: 100, ray: 250, mine: 150, turret: 200, ace: 1200, pod: 500,
  boss: [4000, 5000, 6000], thread: 50, deflect: 25, spare: 250 };
const EBOLT = '#FF5E7A', EBOLT2 = '#FF9A5A';

/* ── sector palettes ──────────────────────────────────────────────────── */
const PALS = [
  { name:'DEBRIS REACH', bg0:'#050A1C', bg1:'#0D2038', neb:['#0E3A55','#20276B'],
    star:'#9FD8FF', line:'#39D9E8', ob:'#0F1B2E', obE:'#4A6E96', deco:'#182B44',
    foe:'#9FB9DC', foeA:'#3BE8D2', boss:'#2A4258' },
  { name:'AURIC NEBULA', bg0:'#150522', bg1:'#321143', neb:['#691E86','#B02472'],
    star:'#F2C6FF', line:'#E86BFF', ob:'#221031', obE:'#8A4FB0', deco:'#2C1543',
    foe:'#D8AEE6', foeA:'#FF6BD8', boss:'#4A2158' },
  { name:'THE BASTION', bg0:'#180607', bg1:'#361309', neb:['#5A1E22','#6B330F'],
    star:'#FFD2AE', line:'#FF7A3C', ob:'#241014', obE:'#9A5A46', deco:'#301318',
    foe:'#CBA9A0', foeA:'#FF8A4A', boss:'#582420' },
];

/* ── hull skins + challenges ──────────────────────────────────────────── */
const SKINS = [
  { name:'STANDARD',  hull:'#E9F1FF', trim:'#3BE8D2', trail:'#57F0FF', laser:'#6BF3FF', need:null },
  { name:'EMBERWING', hull:'#31262B', trim:'#FF8A3C', trail:'#FFB03A', laser:'#FFC24A',
    need:{ k:'kills', n:50, label:'50 total kills' } },
  { name:'TIDEGLASS', hull:'#BFF2E8', trim:'#0FB89E', trail:'#4AF0C8', laser:'#7FFFD4',
    need:{ k:'kills', n:250, label:'250 total kills' } },
  { name:'AURORA',    hull:'#DDE6FF', trim:'#8CFF9E', trail:'#B78CFF', laser:'#9EFFB2',
    need:{ k:'gold', n:1, label:'gold medal, any sector' } },
  { name:'DEFLECTOR CHROME', hull:'#F5F8FF', trim:'#AFC0DA', trail:'#FFFFFF', laser:'#EAF4FF',
    need:{ k:'deflects', n:20, label:'deflect 20 bolts' } },
  { name:'ACE HUNTER', hull:'#3D2F17', trim:'#FFD24A', trail:'#FFD24A', laser:'#FFE27A',
    need:{ k:'aces', n:3, label:'down 3 Aces' } },
  { name:'OBSIDIAN',  hull:'#15171E', trim:'#FF4A55', trail:'#FF6A5A', laser:'#FF7A86',
    need:{ k:'won', n:1, label:'beat the run' } },
  { name:'PRISMATIC', hull:'#FFFFFF', trim:'#FFFFFF', trail:'#FFFFFF', laser:'#FFFFFF', prism:true,
    need:{ k:'deathless', n:1, label:'beat the run deathless' } },
];

/* ── utils ────────────────────────────────────────────────────────────── */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;
const rnd = (a=1,b) => b === undefined ? Math.random()*a : a + Math.random()*(b-a);
const irnd = n => (Math.random()*n)|0;
const pick = a => a[(Math.random()*a.length)|0];
const easeOut = t => 1 - (1-t)*(1-t);
const easeIO = t => t < .5 ? 2*t*t : 1 - 2*(1-t)*(1-t);
const d2 = (ax,ay,bx,by) => { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };

/* ── native bridge (Rock Hopper pattern) ──────────────────────────────── */
const NATIVE = () => (window.webkit && webkit.messageHandlers && webkit.messageHandlers.native) || null;
function native(msg){ try { const n = NATIVE(); if (n) n.postMessage(msg); } catch(e){} }
function haptic(kind){ native({type:'haptic', kind}); } // light|medium|heavy|soft|rigid|success|warning|error

/* ── save ─────────────────────────────────────────────────────────────── */
const KEY = 'jlud.voidlance.v1';
function defaults(){ return { v:1, best:0, medals:[0,0,0], kills:0, deflects:0, aces:0,
  skin:0, seenMask:1, runsWon:0, deathless:0, mute:false }; }
let D = defaults();
function loadSave(){
  let raw = null;
  try { raw = (window.__saved !== undefined && window.__saved !== null) ? window.__saved
    : localStorage.getItem(KEY); } catch(e){}
  if (raw) {
    try {
      const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (o && o.v === 1) {
        D = Object.assign(defaults(), o);
        if (!Array.isArray(D.medals) || D.medals.length !== 3) D.medals = [0,0,0];
        D.skin = clamp(D.skin|0, 0, SKINS.length-1);
      }
    } catch(e){}
  }
}
function saveNow(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){}
  native({ type:'save', data: D });
}
loadSave();
if (!skinOk(D.skin)) D.skin = 0;

function skinOk(i){
  const nd = SKINS[i].need; if (!nd) return true;
  switch (nd.k) {
    case 'kills': return D.kills >= nd.n;
    case 'deflects': return D.deflects >= nd.n;
    case 'aces': return D.aces >= nd.n;
    case 'gold': return D.medals.some(m => m >= 3);
    case 'won': return D.runsWon >= 1;
    case 'deathless': return D.deathless >= 1;
  }
  return false;
}
function skinProgress(i){
  const nd = SKINS[i].need; if (!nd) return { p:1, txt:'' };
  let v = 0;
  switch (nd.k) {
    case 'kills': v = D.kills; break;
    case 'deflects': v = D.deflects; break;
    case 'aces': v = D.aces; break;
    case 'gold': v = D.medals.some(m => m >= 3) ? 1 : 0; break;
    case 'won': v = D.runsWon; break;
    case 'deathless': v = D.deathless; break;
  }
  return { p: clamp(v / nd.n, 0, 1), txt: (nd.n > 1 ? (Math.min(v,nd.n) + '/' + nd.n + ' · ') : '') + nd.label };
}
function skinC(i, part){
  const s = SKINS[i];
  if (s.prism) {
    const h = (G.rt * 80 + (part === 'trim' ? 60 : part === 'trail' ? 120 : 0)) % 360;
    return 'hsl(' + (h|0) + ' 95% ' + (part === 'hull' ? 78 : 62) + '%)';
  }
  return s[part];
}
function checkUnlocks(){
  for (let i = 1; i < SKINS.length; i++) {
    if (skinOk(i) && !((D.seenMask >> i) & 1)) {
      D.seenMask |= (1 << i);
      toast('NEW HULL — ' + SKINS[i].name);
      A.sting(); haptic('success'); saveNow();
    }
  }
}

/* ── canvas, projection, static art ───────────────────────────────────── */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const probe = document.getElementById('probe');
const arcA = document.getElementById('arc');
let cw = 390, ch = 844, FOV = 360, K = 3, vpx = 195, vpy = 370;
let SB = { x:120, y0:-180, y1:240 }, EBB = { x:126, y0:-190, y1:250 };
const sa = { l:0, t:0, r:0, b:0 };
const cam = { x:0, y:0, tilt:0, ox:0, oy:0 };
const PRJ = { x:0, y:0, s:1 };
const Q = { dpr: Math.min(window.devicePixelRatio || 1, 2), low: 0 };
let WM = null, VIG = null;
const GLOWS = {};

function glow(col){
  let g = GLOWS[col];
  if (!g) {
    g = document.createElement('canvas'); g.width = g.height = 64;
    const c = g.getContext('2d');
    const rg = c.createRadialGradient(32,32,2, 32,32,31);
    rg.addColorStop(0, '#FFFFFF'); rg.addColorStop(.25, col);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = rg; c.beginPath(); c.arc(32,32,31,0,TAU); c.fill();
    GLOWS[col] = g;
  }
  return g;
}
let GRD = null;
function bgGrad(){
  GRD = ctx.createLinearGradient(0, -80, 0, ch + 80);
  GRD.addColorStop(0, PAL.bg0); GRD.addColorStop(1, PAL.bg1);
}
function buildStatic(){
  // vignette
  VIG = document.createElement('canvas');
  VIG.width = Math.max(2, cw >> 1); VIG.height = Math.max(2, ch >> 1);
  const vc = VIG.getContext('2d');
  const r = Math.hypot(VIG.width, VIG.height) * .62;
  const vg = vc.createRadialGradient(VIG.width/2, VIG.height/2, r*.45, VIG.width/2, VIG.height/2, r);
  vg.addColorStop(0, 'rgba(0,0,10,0)'); vg.addColorStop(1, 'rgba(0,0,12,.55)');
  vc.fillStyle = vg; vc.fillRect(0,0,VIG.width,VIG.height);
  // wordmark
  const w = Math.min(cw * .92, 560), px = w / 6.6, s = 2;
  WM = document.createElement('canvas');
  WM.width = (w + 80) * s; WM.height = (px * 2.1) * s;
  const c = WM.getContext('2d'); c.scale(s, s);
  const word = 'VOIDLANCE', sp = px * .13;
  c.font = 'italic 900 ' + px + 'px ' + FONT;
  let tw = 0; for (const chr of word) tw += c.measureText(chr).width + sp;
  let x0 = ((w + 80) - tw) / 2, y0 = px * 1.28;
  // speed slash behind
  const lg = c.createLinearGradient(x0 - 30, 0, x0 + tw + 30, 0);
  lg.addColorStop(0, 'rgba(59,232,210,0)'); lg.addColorStop(.5, 'rgba(59,232,210,.7)');
  lg.addColorStop(1, 'rgba(183,140,255,0)');
  c.fillStyle = lg; c.fillRect(x0 - 30, y0 + px * .18, tw + 60, 2.5);
  c.textBaseline = 'alphabetic';
  for (let pass = 0; pass < 2; pass++) {
    let x = x0;
    for (let i = 0; i < word.length; i++) {
      const chr = word[i];
      if (pass === 0) { c.shadowColor = '#2FD4FF'; c.shadowBlur = 22; c.fillStyle = '#0A2A44'; }
      else {
        c.shadowBlur = 0;
        const g = c.createLinearGradient(0, y0 - px, 0, y0);
        g.addColorStop(0, '#FFFFFF'); g.addColorStop(.55, '#CFF4FF'); g.addColorStop(1, '#5FD8F0');
        c.fillStyle = g;
      }
      c.fillText(chr, x, y0);
      x += c.measureText(chr).width + sp;
    }
  }
  c.shadowBlur = 0;
}
function resize(){
  cw = window.innerWidth; ch = window.innerHeight;
  const d = Q.dpr;
  cv.width = Math.round(cw * d); cv.height = Math.round(ch * d);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  try {
    const r = probe.getBoundingClientRect();
    sa.l = Math.max(0, r.left); sa.t = Math.max(0, r.top);
    sa.r = Math.max(0, cw - r.right); sa.b = Math.max(0, ch - r.bottom);
  } catch(e){ sa.l = sa.t = sa.r = sa.b = 0; }
  FOV = Math.min(cw, ch) * .98;
  K = FOV / CFG.SHIP_Z;
  vpx = cw * .5; vpy = ch * .44;
  const f = (1 - CFG.CAMF) * K;
  const topM = sa.t + Math.min(118, ch * .2), botM = sa.b + Math.min(140, ch * .25);
  SB = { x: (cw * .5 - 48) / f, y0: (topM - vpy) / f, y1: (ch - botM - vpy) / f };
  EBB = { x: SB.x * 1.04, y0: SB.y0 * 1.08, y1: SB.y1 * 1.02 };
  buildStatic(); if (PAL) bgGrad();
  ship.x = clamp(ship.x, -SB.x, SB.x); ship.tx = clamp(ship.tx, -SB.x, SB.x);
  ship.y = clamp(ship.y, SB.y0, SB.y1); ship.ty = clamp(ship.ty, SB.y0, SB.y1);
}
function P(x, y, z){
  const s = FOV / Math.max(z, 26);
  PRJ.x = vpx + cam.ox + (x - cam.x) * s;
  PRJ.y = vpy + cam.oy + (y - cam.y) * s;
  PRJ.s = s; return PRJ;
}
const mapU = u => u * EBB.x;
const mapV = v => lerp(EBB.y0, EBB.y1, (v + 1) / 2);

/* ── audio: all synth, unlocked on first gesture ──────────────────────── */
const A = {
  ac: null, master: null, mgain: null, delay: null, dsend: null,
  step: 0, next: 0, mode: 'title', chI: -1,
  unlock(){
    if (!this.ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ac = new AC();
        const m = this.ac.createGain(); m.gain.value = D.mute ? 0 : .42;
        const comp = this.ac.createDynamicsCompressor();
        comp.threshold.value = -18; comp.ratio.value = 6;
        m.connect(comp); comp.connect(this.ac.destination);
        this.master = m;
        this.mgain = this.ac.createGain(); this.mgain.gain.value = .8; this.mgain.connect(m);
        const dl = this.ac.createDelay(.6); dl.delayTime.value = .29;
        const fb = this.ac.createGain(); fb.gain.value = .32;
        const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
        dl.connect(fb); fb.connect(lp); lp.connect(dl);
        const dout = this.ac.createGain(); dout.gain.value = .5;
        dl.connect(dout); dout.connect(this.mgain);
        this.delay = dl;
        this.next = this.ac.currentTime + .1;
      } catch(e){ this.ac = null; }
    }
    if (this.ac && this.ac.state === 'suspended') { try { this.ac.resume(); } catch(e){} }
  },
  on(){ return this.ac && !D.mute; },
  setMute(m){ D.mute = m; if (this.master) this.master.gain.value = m ? 0 : .42; saveNow(); },
  t(){ return this.ac.currentTime; },
  env(type, f0, f1, dur, vol, t0, dest, pan){
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g);
    let out = dest || this.master;
    if (pan !== undefined && ac.createStereoPanner) {
      const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(out);
    } else g.connect(out);
    o.start(t0); o.stop(t0 + dur + .02);
  },
  noise(dur, vol, t0, f0, f1, type){
    const ac = this.ac, n = Math.max(1, (dur * ac.sampleRate) | 0);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = type || 'lowpass';
    f.frequency.setValueAtTime(f0, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(10, f1), t0 + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t0); s.stop(t0 + dur + .02);
  },
  laser(alt){ if (!this.on()) return; const t = this.t();
    this.env('square', alt ? 940 : 880, 300, .08, .035, t, this.master, alt ? .18 : -.18); },
  hitS(){ if (!this.on()) return; const t = this.t();
    this.noise(.06, .12, t, 3200, 800, 'bandpass'); this.env('triangle', 520, 180, .06, .1, t); },
  boomS(){ if (!this.on()) return; const t = this.t();
    this.noise(.3, .3, t, 1600, 160); this.env('sine', 200, 55, .28, .25, t); },
  boomB(){ if (!this.on()) return; const t = this.t();
    this.noise(.8, .5, t, 2200, 90); this.env('sine', 150, 34, .7, .4, t);
    this.env('sawtooth', 90, 30, .6, .12, t); },
  ting(n){ if (!this.on()) return; const t = this.t();
    const f = 1900 * Math.pow(1.12, Math.min(n, 8)) * rnd(.98, 1.04);
    this.env('sine', f, f * .96, .14, .12, t); this.env('sine', f * 1.51, f * 1.45, .09, .05, t); },
  whoosh(){ if (!this.on()) return; const t = this.t();
    this.noise(.42, .2, t, 420, 2600, 'bandpass'); },
  pickS(){ if (!this.on()) return; const t = this.t();
    [523, 784, 1175].forEach((f, i) => this.env('triangle', f, f, .12, .09, t + i * .06)); },
  novaS(){ if (!this.on()) return; const t = this.t();
    this.noise(1, .5, t, 5000, 100); this.env('sawtooth', 400, 40, .8, .22, t);
    this.env('sine', 100, 30, .9, .3, t); },
  sting(){ if (!this.on()) return; const t = this.t();
    [523, 659, 784, 1046].forEach((f, i) => { this.env('sine', f, f, .34, .12, t + i * .07);
      this.env('sine', f * 2, f * 2, .2, .04, t + i * .07); }); },
  medal(m){ if (!this.on()) return; const t = this.t();
    const base = m === 3 ? [659, 830, 988, 1318] : m === 2 ? [587, 740, 880] : [523, 659];
    base.forEach((f, i) => this.env('triangle', f, f, .4, .12, t + i * .09)); },
  chainS(n){ if (!this.on()) return; const t = this.t();
    const f = 440 * Math.pow(1.1225, Math.min(n, 10));
    this.env('square', f, f, .07, .05, t); },
  uiS(){ if (!this.on()) return; this.env('sine', 660, 660, .06, .08, this.t()); },
  deny(){ if (!this.on()) return; this.env('square', 180, 140, .12, .07, this.t()); },
  hurtS(){ if (!this.on()) return; const t = this.t();
    this.noise(.25, .3, t, 900, 120); this.env('square', 160, 60, .22, .2, t); },
  alarm(){ if (!this.on()) return; const t = this.t();
    for (let i = 0; i < 3; i++) { this.env('sawtooth', 620, 620, .16, .08, t + i * .3);
      this.env('sawtooth', 466, 466, .16, .08, t + i * .3 + .15); } },
  typeS(){ if (!this.on()) return; this.env('square', 1500, 1500, .015, .012, this.t()); },
  threadS(){ if (!this.on()) return; const t = this.t();
    this.env('sine', 880, 1320, .1, .07, t); },
  rollUp(){ if (!this.on()) return; const t = this.t();
    this.env('sine', 300, 900, .3, .06, t); },
  // generative music: 8th-note scheduler
  CH: [ [[48,55,63,67],[44,51,60,63],[41,48,56,60],[43,50,58,62]],
        [[50,57,65,69],[46,53,62,65],[43,50,58,62],[45,52,60,64]],
        [[45,52,60,64],[41,48,56,60],[38,45,53,57],[40,47,55,59]] ],
  midi(n){ return 440 * Math.pow(2, (n - 69) / 12); },
  tick(){
    if (!this.ac || D.mute) return;
    const SPB = 60 / 116, step8 = SPB / 2;
    while (this.next < this.ac.currentTime + .18) {
      const t = this.next, s = this.step, st = s % 16;
      const boss = this.mode === 'boss', game = this.mode !== 'title';
      const prog = this.CH[clamp(G.sec, 0, 2)];
      if (st === 0) { this.chI = (this.chI + 1) % prog.length; this.pad(prog[this.chI], t, boss); }
      const ch = prog[(this.chI < 0 ? 0 : this.chI)];
      const root = ch[0];
      if (game) {
        const bassSteps = boss ? [0,2,4,6,8,10,12,14] : [0,3,6,8,11,14];
        if (bassSteps.indexOf(st) >= 0)
          this.env('sawtooth', this.midi(root - 12), this.midi(root - 12), .16, boss ? .09 : .07, t, this.mgain);
        if (st === 0 || st === 8) this.env('sine', 95, 38, .12, .14, t);
      }
      if (st % 2 === 1 && Math.random() < .75) this.noise(.03, .012, t, 8000, 8000, 'highpass');
      if (Math.random() < (game ? .3 : .22)) {
        const scale = [0, 3, 5, 7, 10];
        const n = root + 24 + pick(scale) + (Math.random() < .3 ? 12 : 0);
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'triangle'; o.frequency.value = this.midi(n);
        g.gain.setValueAtTime(.035, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
        o.connect(g); g.connect(this.mgain); g.connect(this.delay);
        o.start(t); o.stop(t + .32);
      }
      this.next += step8; this.step++;
    }
  },
  pad(ch, t, boss){
    const notes = boss ? [ch[0], ch[0] + 6, ch[0] + 12] : ch;
    for (const n of notes) {
      const o = this.ac.createOscillator(), o2 = this.ac.createOscillator(), g = this.ac.createGain();
      const f = this.midi(n);
      o.type = 'sawtooth'; o.frequency.value = f; o2.type = 'sawtooth'; o2.frequency.value = f * 1.006;
      const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = boss ? 900 : 620;
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.022, t + .8);
      g.gain.setValueAtTime(.022, t + 3.2); g.gain.linearRampToValueAtTime(.0001, t + 4.1);
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.mgain);
      o.start(t); o2.start(t); o.stop(t + 4.2); o2.stop(t + 4.2);
    }
  },
};

function mkPool(n, make){

  return a;
}
const bolts = mkPool(CFG.BOLT_CAP, () => ({ k:'b', x:0,y:0,z:0, px:0, pz:0, vx:0,vy:0,vz:0, r:5, col:EBOLT, defl:false, t:0 }));

function spawnBolt(x, y, z, tx, ty, spd, col, r){
  const b = bolts.get(); if (!b) return null;
  let dx = tx - x, dy = ty - y, dz = CFG.SHIP_Z - z;
  const m = Math.hypot(dx, dy, dz) || 1;
  b.x = x; b.y = y; b.z = z; b.pz = z;
  b.vx = dx / m * spd; b.vy = dy / m * spd; b.vz = dz / m * spd;
  b.col = col || EBOLT; b.r = r || 5; b.defl = false; b.t = 0;

}
function spark(x, y, z, col, n, spd){

    const a = rnd(TAU), v = rnd(.3, 1) * (spd || 160);
    p.x = x; p.y = y; p.z = z;
    p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v; p.vz = rnd(-140, 140);

/* ── ship ─────────────────────────────────────────────────────────────── */
const ship = { k:'S', z: CFG.SHIP_Z, x: 0, y: 0, tx: 0, ty: 0, px: 0, bank: 0,
  roll: 0, rollDir: 1, rollCd: 0, rollN: 0, inv: 0, fireT: 0, alive: true, alt: false };
const TRAIL = [];
function resetShip(){
  ship.x = ship.tx = 0; ship.y = ship.ty = SB.y1 * .5;
  ship.bank = 0; ship.roll = 0; ship.rollCd = 0; ship.inv = 2.2; ship.alive = true;
  ship.fireT = .1; TRAIL.length = 0;
}
function doRoll(dir){
  if (ship.rollCd > 0 || !ship.alive || G.state !== 'game' || G.paused) return;
  ship.roll = CFG.ROLL_T; ship.rollDir = dir; ship.rollCd = CFG.ROLL_CD; ship.rollN = 0;
  A.whoosh(); haptic('light');
}
function doNova(){
  if (G.state !== 'game' || G.paused || !ship.alive) return;
  if (G.novas <= 0 || G.novaCd > 0) { if (G.novaCd <= 0) { A.deny(); } return; }
  G.novas--; G.novaCd = .8;
  G.flashW = .55; G.shake = Math.min(1, G.shake + .7); G.novaRing = .01;
  A.novaS(); haptic('heavy');
  for (let i = 0; i < bolts.length; i++) {
    const b = bolts[i];
    if (b.on && !b.defl) { spark(b.x, b.y, b.z, '#FFE9A8', 4, 120); b.on = false; }
  }
  for (let i = foes.length - 1; i >= 0; i--) dmgFoe(foes[i], 6, false);
  if (G.boss) bossNova();
  addFloat(vpx, vpy - 40, 'NOVA', '#FFE9A8', true);
}
function hurt(){
  if (!ship.alive || ship.inv > 0 || ship.roll > 0 || G.state !== 'game') return;
  G.hull--; G.st.dmg++; ship.inv = CFG.INV_T;
  G.shake = Math.min(1, G.shake + .6); G.flashR = .4; G.hstop = .045;
  A.hurtS(); haptic('heavy');
  spark(ship.x, ship.y, ship.z, '#FF8A6A', 14, 220);
  breakChain();
  if (G.hull === 1) commOnce('lowhull' + G.sec, "Hull's crying. Find a shield.");
  if (G.hull <= 0) die();
}
function die(){
  ship.alive = false; G.deathT = 0; G.runDeaths++;
  boom(ship.x, ship.y, ship.z, skinC(D.skin, 'trail'), true);
  shardBurst(ship.x, ship.y, ship.z, skinC(D.skin, 'hull'), 12);
  G.slowT = .8; G.slow = .35; G.flashW = .5;
  haptic('error');
  comm(pick(['Lance down… recovering the frame.', 'Eject confirmed. We rebuild.', 'The void bit back.']));
  saveNow();
}
function updShip(dt, rdt){
  if (!ship.alive) {
    G.deathT += rdt;
    if (G.deathT > 2) { G.lives--; if (G.lives > 0) respawn(); else gameOver(); }
    return;
  }
  // keyboard steer
  let kx = 0, ky = 0;
  if (keys.has('a') || keys.has('ArrowLeft')) kx -= 1;
  if (keys.has('d') || keys.has('ArrowRight')) kx += 1;
  if (keys.has('w') || keys.has('ArrowUp')) ky -= 1;
  if (keys.has('s') || keys.has('ArrowDown')) ky += 1;
  if (kx || ky) { ship.tx = clamp(ship.tx + kx * CFG.KB_SPD * dt, -SB.x, SB.x);
    ship.ty = clamp(ship.ty + ky * CFG.KB_SPD * dt, SB.y0, SB.y1); }
  const f = 1 - Math.exp(-dt * 14);
  const pxx = ship.x;
  ship.x += (ship.tx - ship.x) * f; ship.y += (ship.ty - ship.y) * f;
  const vx = (ship.x - pxx) / Math.max(dt, .001);
  ship.bank = lerp(ship.bank, clamp(vx * .0022, -.85, .85), 1 - Math.exp(-dt * 10));
  if (ship.inv > 0) ship.inv -= dt;
  if (ship.rollCd > 0) ship.rollCd -= dt;
  if (G.novaCd > 0) G.novaCd -= dt;
  if (ship.roll > 0) {
    ship.roll -= dt;
    // deflect scan
    for (let i = 0; i < bolts.length; i++) {
      const b = bolts[i];
      if (!b.on || b.defl) continue;
      if (b.z < CFG.SHIP_Z + CFG.DEFL_Z && b.z > CFG.SHIP_Z - 80 &&
          d2(b.x, b.y, ship.x, ship.y) < CFG.DEFL_R * CFG.DEFL_R) deflect(b);
    }
  }
  // auto-fire
  if (G.intro <= 0) {
    ship.fireT -= dt;
    while (ship.fireT <= 0) { ship.fireT += CFG.FIRE_T; fireLasers(); }
  }
  // trail (screen-space ribbon)
  P(ship.x, ship.y + 7, ship.z + 6);
  TRAIL.unshift(PRJ.x, PRJ.y);
  if (TRAIL.length > 26) TRAIL.length = 26;
}
function deflect(b){
  b.defl = true;
  let dx = b.x - ship.x, dy = b.y - ship.y;
  const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
  b.vx = dx * 380 + rnd(-90, 90); b.vy = dy * 380 + rnd(-90, 90); b.vz = 1500;
  b.col = skinC(D.skin, 'laser');
  ship.rollN++; D.deflects++;
  spark(b.x, b.y, b.z, '#FFFFFF', 5, 200);
  A.ting(ship.rollN); if (ship.rollN < 4) haptic('soft');
  addScore(SCORES.deflect, b.x, b.y, b.z, false);
  if (ship.rollN === 3) { G.slowT = .3; G.slow = .45; }
  if (ship.rollN === 5) commOnce('showoff', 'Show-off.');
  checkUnlocks();
}
function fireLasers(){
  const col = skinC(D.skin, 'laser');
  for (let i = -1; i <= 1; i += 2) {
    const l = lasers.get(); if (!l) return;
    l.x = ship.x + i * 9; l.y = ship.y + 2; l.z = ship.z + 8; l.pz = l.z;
    l.vz = CFG.LASER_SPD; l.col = col;
    G.st.shots++;
  }
  A.laser(ship.alt = !ship.alt);
}

/* ── pickups ──────────────────────────────────────────────────────────── */

/* ── bolts & lasers ───────────────────────────────────────────────────── */
function updBolts(dt){

    if (b.defl) {

        bossDeflHit(); spark(b.x, b.y, b.z, '#FFFFFF', 4, 120); b.on = false;

function updLasers(dt){

/* ── scoring & chain ──────────────────────────────────────────────────── */

    G.chainT = CFG.CHAIN_T; G.chainP = .35;
    mult = G.chainN;
    if (mult > 1) A.chainS(mult);
    if (mult === 4 || mult === CFG.CHAIN_MAX) haptic('medium');
  }
  const pts = base * mult;
  G.score += pts;
  if (x !== undefined) {

    addFloat(PRJ.x, PRJ.y, '+' + pts, chained && mult > 1 ? '#FFD24A' : '#EAF6FF', mult >= 4);
  }
}

function bossHp(){

function bossDeflHit(){ if (G.boss) bossDamage(1, false); }

function bossHitLaser(l){

      }

    if (dd > 130 - 17 && dd < 130 + 17) {

}
function updBoss(dt){
  const b = G.boss; if (!b) return;

  if (b.z > b.tz) { b.z = Math.max(b.tz, b.z - 900 * dt); return; }

      }

        const an = a / 10 * TAU + b.rot;
        spawnBolt(b.x, b.y, b.z, ship.x + Math.cos(an) * 170, ship.y + Math.sin(an) * 170, sp * .8, EBOLT2);
      }
    }
    b.aimT -= dt;
    if (b.aimT <= 0) {
      b.aimT = b.phase ? 1.9 : 2.4;
      if (b.phase) { for (let i = -2; i <= 2; i++) spawnBolt(b.x, b.y, b.z, ship.x + i * 46, ship.y, sp, EBOLT); }
      else { spawnBolt(b.x, b.y, b.z, ship.x - 22, ship.y, sp, EBOLT); spawnBolt(b.x, b.y, b.z, ship.x + 22, ship.y, sp, EBOLT); }

const HG = { wob: {} };
function drawHangarUI(){

function draw(){
  BTN.length = 0;
  if (G.state === 'title') { drawWorld(true); drawTitleUI(); }
  else if (G.state === 'hangar') { drawWorld(false); drawHangarUI(); }
  else if (G.state === 'game') {
    drawWorld(true); drawHUD(); drawBannerUI();
    if (!ship.alive) {
      ctx.fillStyle = 'rgba(30,4,10,' + clamp(G.deathT * .3, 0, .45) + ')';
      ctx.fillRect(0, 0, cw, ch);
      if (G.deathT > .5) {
        spaced('LANCE DOWN', vpx, ch * .34, 24, '#FF6A6A', 5, 900);
        if (G.lives > 1) tx2('recovering the frame…', vpx, ch * .34 + 28, 12, '#B78A96', 'center', 600);
      }
    }
    if (G.paused) drawPauseUI();
  }
  else if (G.state === 'card') { drawWorld(true); drawHUD(); drawBannerUI(); drawCardUI(); }
  else if (G.state === 'over') { drawWorld(true); drawOverUI(); }
  else if (G.state === 'win') { drawWorld(false); drawWinUI(); }
  drawToasts();

/* ── input ────────────────────────────────────────────────────────────── */
const keys = new Set();
const TP = new Map();
let PRIM = null, lastTap = 0, lastSide = 0;
function onDown(x, y){
  A.unlock();
  switch (G.state) {
    case 'title': if (!hitBtns(x, y) && G.grace <= 0) { A.uiS(); haptic('light'); startRun(); } return 'ui';
    case 'hangar': hitBtns(x, y); return 'ui';
    case 'card': if (!G.card || G.card.t > .9) continueCard(); return 'ui';
    case 'over': case 'win': hitBtns(x, y); return 'ui';
    case 'game': {
      if (G.paused) { hitBtns(x, y); return 'ui'; }
      const pb = G.pr;
      if (pb && x >= pb.x - 8 && x <= pb.x + pb.w + 8 && y >= pb.y - 8 && y <= pb.y + pb.h + 8) { openPause(); return 'ui'; }
      const nb = G.nr;
      if (nb && d2(x, y, nb.x, nb.y) < (nb.r + 12) * (nb.r + 12)) { doNova(); return 'ui'; }
      return 'play';
    }
  }
  return 'ui';
}
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    const kind = onDown(x, y);
    const o = { x, y, x0: x, y0: y, t0: performance.now(), hist: [[performance.now(), x, y]], kind, ax: ship.tx, ay: ship.ty };
    TP.set(t.identifier, o);
    if (kind === 'play') {
      if (PRIM === null) PRIM = t.identifier;
      else doNova();
    }
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const now = performance.now();
  for (const t of e.changedTouches) {
    const o = TP.get(t.identifier); if (!o) continue;
    o.x = t.clientX; o.y = t.clientY;
    o.hist.push([now, o.x, o.y]);
    while (o.hist.length > 2 && now - o.hist[0][0] > 160) o.hist.shift();
    if (t.identifier === PRIM && G.state === 'game' && !G.paused && ship.alive) {
      const f = CFG.DRAG / ((1 - CFG.CAMF) * K);
      ship.tx = clamp(o.ax + (o.x - o.x0) * f, -SB.x, SB.x);
      ship.ty = clamp(o.ay + (o.y - o.y0) * f, SB.y0, SB.y1);
      const h0 = o.hist[0];
      const dx = o.x - h0[1], dy = o.y - h0[2];
      if (Math.abs(dx) >= 76 && Math.abs(dx) > 2.1 * Math.abs(dy) && ship.rollCd <= 0) {
        doRoll(dx > 0 ? 1 : -1);
        o.hist = [[now, o.x, o.y]];
        o.x0 = o.x; o.y0 = o.y; o.ax = ship.tx; o.ay = ship.ty;
      }
    }
  }
}, { passive: false });
function endTouch(e){
  e.preventDefault();
  for (const t of e.changedTouches) {
    const o = TP.get(t.identifier); TP.delete(t.identifier);
    if (t.identifier === PRIM) {
      PRIM = null;
      if (o && G.state === 'game' && !G.paused) {
        const dur = performance.now() - o.t0, dist = Math.hypot(o.x - o.x0, o.y - o.y0);
        if (dur < 230 && dist < 14) {
          const side = o.x < cw / 2 ? -1 : 1, now = performance.now();
          if (now - lastTap < 340 && side === lastSide) { doRoll(side); lastTap = 0; }
          else { lastTap = now; lastSide = side; }
        }
      }
    }
  }
}
cv.addEventListener('touchend', endTouch, { passive: false });
cv.addEventListener('touchcancel', endTouch, { passive: false });
// mouse fallback
let MD = null;
cv.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const kind = onDown(e.clientX, e.clientY);
  if (kind === 'play') MD = { x0: e.clientX, y0: e.clientY, ax: ship.tx, ay: ship.ty, hist: [[performance.now(), e.clientX, e.clientY]] };
});
cv.addEventListener('mousemove', e => {
  if (!MD || G.state !== 'game' || G.paused) return;
  const now = performance.now();
  MD.hist.push([now, e.clientX, e.clientY]);
  while (MD.hist.length > 2 && now - MD.hist[0][0] > 160) MD.hist.shift();
  const f = CFG.DRAG / ((1 - CFG.CAMF) * K);
  ship.tx = clamp(MD.ax + (e.clientX - MD.x0) * f, -SB.x, SB.x);
  ship.ty = clamp(MD.ay + (e.clientY - MD.y0) * f, SB.y0, SB.y1);
  const h0 = MD.hist[0], dx = e.clientX - h0[1], dy = e.clientY - h0[2];
  if (Math.abs(dx) >= 76 && Math.abs(dx) > 2.1 * Math.abs(dy) && ship.rollCd <= 0) {
    doRoll(dx > 0 ? 1 : -1);
    MD.hist = [[now, e.clientX, e.clientY]];
    MD.x0 = e.clientX; MD.y0 = e.clientY; MD.ax = ship.tx; MD.ay = ship.ty;
  }
});
window.addEventListener('mouseup', () => { MD = null; });
window.addEventListener('keydown', e => {
  A.unlock();
  const k = e.key;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (G.state === 'game') { G.paused ? closePause() : openPause(); }
    return;
  }
  if ((k === ' ' || k === 'Enter')) {
    if (G.state === 'title') { startRun(); return; }
    if (G.state === 'card') { continueCard(); return; }
    if (G.state === 'over') { retryOver(); return; }
    if (G.state === 'win') { startRun(); return; }
    if (G.state === 'game' && k === ' ') { doNova(); return; }
  }
  if (G.state === 'game') {
    if (k === 'q' || k === 'Q') doRoll(-1);
    if (k === 'e' || k === 'E') doRoll(1);
  }
  keys.add(k.length === 1 ? k.toLowerCase() : k);
});
window.addEventListener('keyup', e => {
  keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key);
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'game' && !G.paused) openPause(true); saveNow(); }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 80));

/* ── loop & boot ──────────────────────────────────────────────────────── */
let lastT = performance.now(), fpsN = 0, fpsT = 0, warm = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const rdt = clamp((ts - lastT) / 1000, 0, .05); lastT = ts;
  G.rt += rdt;
  let dt = rdt;
  if (G.hstop > 0) { G.hstop -= rdt; dt *= .12; }
  if (G.slowT > 0) { G.slowT -= rdt; dt *= G.slow; }
  update(dt, rdt);
  draw();
  fpsN++; fpsT += rdt; warm += rdt;
  if (fpsT >= 1) {
    const f = fpsN / fpsT; fpsN = 0; fpsT = 0;
    if (warm > 3 && f < 48 && Q.dpr > 1.3) { Q.dpr = Math.max(1.3, Q.dpr - .4); resize(); }
  }
}
resize();
initStars(); initNebs();
toTitle();
update(0, 0); draw(); // paint the title synchronously — never a blank first frame
requestAnimationFrame(loop);

/* ── debug hooks (QA harness only) ────────────────────────────────────── */
window.__vl = {
  testSave(){
    try {
      saveNow();
      const raw = localStorage.getItem(KEY);
      return !!(raw && JSON.parse(raw).v === 1);
    } catch (e) { return 'ERR:' + e; }
  },
  go(w, i){
    try {
      if (w === 'hangar') toHangar();
      else if (w === 'sector') { startRun(); initSector(i | 0); }
      else if (w === 'boss') { startRun(); initSector(i | 0); G.secT = CFG.BOSS_T[i | 0] - 4.1; G.si = G.script.length - 2; G.intro = 0; }
      else if (w === 'card') { startRun(); G.st = { spawned: 40, kills: 31, shots: 300, hits: 84, dmg: 2 }; sectorClear(); }
      else if (w === 'over') { startRun(); gameOver(); }
      else if (w === 'win') { startRun(); winRun(); }
      else if (w === 'title') toTitle();
      else if (w === 'weaken' && G.boss) { G.boss.core = 1; bossDamage(1, false); }
      G.grace = 0; return G.state;
    } catch (e) { return 'ERR:' + e; }
  },
};
})();
