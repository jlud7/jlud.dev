const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)};
const popS=t=>{ if(t<0)return 0; if(t<0.35) return easeOut(t/0.35)*1.45; return lerp(1.45,1,ease((t-0.35)/0.3)); };
function fmt(n){n=fl(n);if(n>=1e6)return (n/1e6).toFixed(n<1e7?1:0)+"m";if(n>=1e4)return (n/1e3).toFixed(1)+"k";return (""+n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}

/* ---------- native bridge (Rock Hopper pattern) ---------- */

/* ---------- canvas ---------- */
const cv=document.getElementById("c"), ctx=cv.getContext("2d");

function loadSave(){

let REG=[];
function reg(id,x,y,w,h){ REG.push({id,x,y,w,h}); }
function regC(id,cx,cy,r){ REG.push({id,x:cx-r,y:cy-r,w:r*2,h:r*2,c:1,cx,cy,r}); }
function hitReg(x,y){
  for(let i=REG.length-1;i>=0;i--){ const r=REG[i];
    if(r.c){ const dx=x-r.cx,dy=y-r.cy; if(dx*dx+dy*dy<=r.r*r.r*1.3) return r.id; }
    else if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return r.id; }

}

/* ---------- audio ---------- */
const AU={ctx:null,master:null,mus:null,sfxG:null,noise:null,next:0,step:0,mi:2};
function initAudio(){
  if(AU.ctx){ try{ if(AU.ctx.state==="suspended") AU.ctx.resume(); }catch(e){} return; }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AU.ctx=new C();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=S.mute?0:0.42; AU.master.connect(AU.ctx.destination);
    AU.mus=AU.ctx.createGain(); AU.mus.gain.value=0.55; AU.mus.connect(AU.master);
    AU.sfxG=AU.ctx.createGain(); AU.sfxG.gain.value=1.0; AU.sfxG.connect(AU.master);
    const n=AU.ctx.sampleRate|0, buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=R()*2-1;
    AU.noise=buf; AU.next=AU.ctx.currentTime+0.15;
  }catch(e){}
}
function setMute(m){ S.mute=m; try{ if(AU.master) AU.master.gain.value=m?0:0.42; }catch(e){} saveNow(); }
function tone(f0,f1,dur,type,vol,when,dest){
  if(!AU.ctx||S.mute)return;
  try{
    const t=AU.ctx.currentTime+(when||0);
    const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(mx(28,f0),t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(mx(28,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||AU.sfxG); o.start(t); o.stop(t+dur+0.06);
  }catch(e){}
}
function nz(dur,vol,freq,when,q){
  if(!AU.ctx||S.mute)return;
  try{
    const t=AU.ctx.currentTime+(when||0);
    const s=AU.ctx.createBufferSource(); s.buffer=AU.noise; s.loop=true;
    const f=AU.ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q||0.8;
    const g=AU.ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(AU.sfxG); s.start(t); s.stop(t+dur+0.06);
  }catch(e){}
}
const SFX={
  ui(){ tone(620,760,0.06,"sine",0.10); },
  coin(i){ const p=1+mn(i,10)*0.05; tone(920*p,1180*p,0.055,"sine",0.09); tone(1380*p,1560*p,0.05,"sine",0.05,0.03); },
  hit(){ nz(0.05,0.16,1900,0,1); tone(170,95,0.07,"square",0.10); },
  crit(){ nz(0.08,0.2,2500,0,1); tone(240,80,0.12,"sawtooth",0.13); tone(880,1320,0.08,"sine",0.08,0.02); },
  pop(){ tone(500,900,0.09,"triangle",0.13); nz(0.06,0.09,900); },
  jump(){ tone(300,570,0.11,"sine",0.07); },
  djump(){ tone(420,760,0.11,"sine",0.08); nz(0.05,0.04,1500); },
  hurt(){ tone(230,110,0.16,"square",0.14); nz(0.08,0.1,700); },
  die(){ tone(320,240,0.16,"triangle",0.14); tone(240,140,0.2,"triangle",0.12,0.14); tone(140,60,0.3,"triangle",0.11,0.3); },
  heal(){ tone(520,780,0.12,"sine",0.1); tone(660,990,0.14,"sine",0.08,0.08); },
  level(){ const n=[523,659,784,1046,1318]; n.forEach((f,i)=>tone(f,f,0.16,"triangle",0.12,i*0.07)); tone(2093,2093,0.3,"sine",0.05,0.36); },

  buy(){ tone(880,660,0.07,"sine",0.09); tone(1100,880,0.08,"sine",0.07,0.06); },

  err(){ tone(220,180,0.12,"square",0.09); },
  ftick(i){ tone(600+i*90,600+i*90,0.05,"sine",0.05+i*0.006); },
  fwin(st){ const n=[659,830,988,1318]; n.forEach((f,i)=>tone(f*(1+st*0.01),0,0.14,"triangle",0.12,i*0.06));
    if(st>=10){ tone(1568,1568,0.4,"sine",0.09,0.28); tone(1976,1976,0.5,"sine",0.07,0.34); nz(0.5,0.05,4000,0.28); } },
  ffail(){ tone(440,220,0.2,"triangle",0.11); tone(160,90,0.2,"square",0.07,0.1); },
  boom(){ tone(120,30,0.7,"sawtooth",0.2); nz(0.5,0.22,300,0,0.5); nz(0.7,0.1,120,0.05,0.5); },
  gone(){ tone(392,392,0.5,"sine",0.05,0.1); },
  portal(){ nz(0.4,0.08,900,0,0.4); tone(300,900,0.4,"sine",0.07); },
  horn(){ tone(110,110,0.7,"sawtooth",0.12); tone(165,165,0.7,"sawtooth",0.08,0.02); nz(0.3,0.1,250,0,0.6); tone(220,110,0.5,"square",0.06,0.3); },
  stomp(){ nz(0.2,0.2,180,0,0.6); tone(90,40,0.3,"sine",0.2); },
  woosh(){ nz(0.16,0.09,600,0,0.5); },
  claim(){ const n=[523,659,784,988,1318,1568]; n.forEach((f,i)=>tone(f,0,0.15,"triangle",0.11,i*0.06)); },
};
const ZKEYS=[0,-2,3,-4,5,7];
function musicTick(){
  if(!AU.ctx||S.mute)return;
  const ct=AU.ctx.currentTime, stepD=0.326, PENT=[0,2,4,7,9,12,14,16];
  if(AU.next<ct-1) AU.next=ct+0.05;
  while(AU.next<ct+0.35){
    const st=AU.step, t=AU.next-ct, base=196*pow(2,ZKEYS[G.zone]/12);
    if(st%2===0 && R()<0.52){
      AU.mi=clamp(AU.mi+ri(-2,2),0,7);
      const f=base*2*pow(2,PENT[AU.mi]/12);
      tone(f,f,0.42,"triangle",0.040,t,AU.mus);
      if(R()<0.3) tone(f*2,f*2,0.3,"sine",0.014,t+0.02,AU.mus);
    }
    if(st%16===0) tone(base/2,base/2,1.5,"sine",0.05,t,AU.mus);
    if(st%16===8) tone(base/2*1.335,base/2*1.335,1.2,"sine",0.035,t,AU.mus);
    if(st%32===0){ tone(base,base,3.4,"sine",0.022,t,AU.mus); tone(base*1.5,base*1.5,3.4,"sine",0.016,t,AU.mus); tone(base*1.19,base*1.19,3.2,"sine",0.012,t,AU.mus); }
    if(R()<0.035) tone(base*8,base*8,0.5,"sine",0.02,t,AU.mus);
    AU.step++; AU.next+=stepD;
  }
}

/* ---------- zones ---------- */
const ZONES=[
 {name:"Verdant Grove", band:[1,5],  w:2300, mons:["puff"],            pop:6,
  pal:{skyT:"#8ED8F8",skyB:"#DFF6D0",far:"#A9DFA3",mid:"#7CC97F",near:"#57B268",lip:"#7ED37B",dirt:"#7A573F",dirt2:"#57402F",acc:"#FFE066",fog:"rgba(226,255,214,0.22)",amb:"#FFF3B8"}},
 {name:"Mushmarsh",     band:[5,12], w:2500, mons:["mushkin","puff"],  pop:7, boss:"matron", bossEvery:90,
  pal:{skyT:"#6FBFC9",skyB:"#D2EEDD",far:"#83C2B0",mid:"#569E90",near:"#3C8677",lip:"#63BFA0",dirt:"#54494A",dirt2:"#3B3336",acc:"#FF8FB2",fog:"rgba(190,235,220,0.24)",amb:"#B8F0DA"}},

 {name:"Crystal Hollow",band:[30,42],w:2600, mons:["shardling"],       pop:8, boss:"golem", bossEvery:100,
  pal:{skyT:"#28406B",skyB:"#79C4DE",far:"#4E6F9D",mid:"#3A5A8E",near:"#274672",lip:"#8FD2E4",dirt:"#2C3F55",dirt2:"#1D2C3E",acc:"#7BE8FF",fog:"rgba(120,210,240,0.18)",amb:"#A9F1FF"}},
 {name:"Sky Terrace",   band:[42,50],w:2800, mons:["cloudling"],       pop:8, boss:"king",  bossEvery:180,
  pal:{skyT:"#FFAF5E",skyB:"#FFE9B8",far:"#FFD9A0",mid:"#F5BE6E",near:"#E3A24E",lip:"#FFE29A",dirt:"#B98443",dirt2:"#8E6230",acc:"#FFF7D6",fog:"rgba(255,235,190,0.22)",amb:"#FFFDF0"}},
];
function zonePlats(z){
  const q=mul32(z*991+17), zw=ZONES[z].w, out=[];
  const defs=[[0.15,230,132],[0.34,205,242],[0.55,255,130],[0.74,205,232]];
  for(const d of defs){
    out.push({x:zw*d[0]+q()*70-35, w:d[1]+q()*40, y:FLOORY-d[2]-q()*14});
  }
  if(z>=2) out.push({x:zw*0.45+q()*40, w:170, y:FLOORY-352});
  return out;
}
let PLATS=zonePlats(0);
const zMul=z=>pow(ZMUL,z), aMul=z=>pow(AMUL,z);

/* pre-rendered parallax layers */
function buildLayers(z){
  const pal=ZONES[z].pal, TW=1000, LH=560, px=mx(0.5,G.cam.s*DPR);
  function mk(draw){
    const c=document.createElement("canvas"); c.width=fl(TW*px); c.height=fl(LH*px);
    const x=c.getContext("2d"); x.scale(px,px); draw(x); return c;
  }
  const q=mul32(z*577+3);
  function hills(x,col,hMin,hMax,step,r0){
    x.fillStyle=col; x.beginPath(); x.moveTo(0,LH);
    let prev=LH-hMin;
    for(let i=0;i<=TW;i+=step){
      const h=hMin+(0.5+0.5*sin(i*0.013+r0))* (hMax-hMin)*q();
      const y=(i===0||i===TW)?prev:LH-h;
      x.quadraticCurveTo(i-step/2,LH-hMin-(hMax-hMin)*q()*0.8,i,y);
    }
    x.lineTo(TW,LH); x.closePath(); x.fill();
  }
  function tree(x,tx,ty,sc,col,dark){
    x.fillStyle=dark; x.fillRect(tx-3*sc,ty-26*sc,6*sc,26*sc);
    x.fillStyle=col;
    x.beginPath(); x.arc(tx,ty-34*sc,16*sc,0,TAU); x.arc(tx-11*sc,ty-24*sc,11*sc,0,TAU); x.arc(tx+11*sc,ty-24*sc,11*sc,0,TAU); x.fill();
  }
  function shroom(x,tx,ty,sc,cap,stem){
    x.fillStyle=stem; x.fillRect(tx-4*sc,ty-20*sc,8*sc,20*sc);
    x.fillStyle=cap; x.beginPath(); x.ellipse(tx,ty-20*sc,16*sc,10*sc,0,PI,0); x.fill();
  }
  function crystal(x,tx,ty,sc,col){
    x.fillStyle=col; x.globalAlpha=0.9;
    x.beginPath(); x.moveTo(tx,ty-34*sc); x.lineTo(tx+9*sc,ty-8*sc); x.lineTo(tx,ty); x.lineTo(tx-9*sc,ty-8*sc); x.closePath(); x.fill();
    x.globalAlpha=1;
  }
  function cloudPuff(x,tx,ty,sc,col){
    x.fillStyle=col; x.beginPath();
    x.arc(tx,ty,18*sc,0,TAU); x.arc(tx+20*sc,ty+4*sc,13*sc,0,TAU); x.arc(tx-20*sc,ty+4*sc,13*sc,0,TAU); x.fill();
  }
  const far=mk(x=>{
    if(z===5){ for(let i=0;i<7;i++) cloudPuff(x,q()*TW,LH-120-q()*260,0.9+q()*1.6,pal.far); }
    else { hills(x,pal.far,110,300,125,q()*9); if(z===4){ for(let i=0;i<8;i++) crystal(x,q()*TW,LH-90-q()*160,1.4+q()*1.8,pal.far); } }
  });
  const mid=mk(x=>{
    if(z===5){ for(let i=0;i<6;i++) cloudPuff(x,q()*TW,LH-60-q()*180,1.1+q()*1.4,pal.mid); }

  } else if(slot==="hat"){ it.st.def=mx(1,rnd(2.4*b*rm*ro())); it.st.hp=rnd(9*b*rm*ro()); }

function updatePlayer(dt){

  if(P.grounded&&abs(P.vx)>120&&R()<dt*7) dust(P.x-P.face*10,P.y,1);

/* ---------- projectiles ---------- */
function updateProjs(dt){
  for(let i=G.pj.length-1;i>=0;i--){ const p=G.pj[i]; p.t+=dt; p.rot+=dt*22;

        if(d<bd&&d<260*260){bd=d;best=m;} }
      if(best){ const dx=best.x-p.x,dy=(best.y-best.h/2)-p.y,d=sqrt(dx*dx+dy*dy)||1;
        p.vx+=dx/d*1500*dt; p.vy+=dy/d*1500*dt;
        const sp2=sqrt(p.vx*p.vx+p.vy*p.vy)||1, cap=640; if(sp2>cap){p.vx*=cap/sp2;p.vy*=cap/sp2;} } }
    p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    let del=p.t>p.life||p.y>FLOORY+8||p.x<-40||p.x>ZONES[G.zone].w+40;

      if(p.hitSet&&p.hitSet.has(m))continue;

      if(dx*dx+dy*dy<(m.r+9)*(m.r+9)){

      } } }
    if(del){ sparks(p.x,p.y,"#EFFFF6",3,120); G.pj.splice(i,1); }
  }
  for(let i=G.ep.length-1;i>=0;i--){ const p=G.ep[i]; p.t+=dt;
    p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;

  }
}

    else if(m.st==="stomp"){ if(m.stT<=0){ m.st="idle"; m.stT=rr(3.4,4.6); } }
    else { m.vx=toP*28; m.dir=toP;
      if(m.stT<=0&&near<620){ m.st="tel"; m.stT=0.8; m.tel=0.8; }
      if(!m.spawned2&&m.hp<m.hpMax*0.5){ m.spawned2=1;
        spawnMon("mushkin",m.x-80,m.z,null); spawnMon("mushkin",m.x+80,m.z,null); } }
    break;
  case "golem":
    m.stT-=dt;
    if(m.st==="tel"){ m.vx=0; if(m.stT<=0){ m.st="slam"; m.stT=0.4; m.vy=-260; } }
    else if(m.st==="slam"){ if(m.stT<=0){ m.st="idle"; m.stT=rr(3.6,5); } }
    else { m.vx=toP*22; m.dir=toP; if(m.stT<=0&&near<560){ m.st="tel"; m.stT=0.9; m.tel=0.9; } }
    break;
  case "king": {
    const ph=m.hp<m.hpMax*0.33?3:(m.hp<m.hpMax*0.66?2:1);
    if(ph!==m.phase){ m.phase=ph; m.tel=0.5; SFX.horn(); shakeFX(4);
      toast(ph===2?"King Puff is getting angry...":"King Puff is FURIOUS!","#FF8A7A"); }
    m.stT-=dt;
    const spd2=ph===3?0.62:(ph===2?0.8:1);
    if(m.st==="tel"){ m.vx=0; if(m.stT<=0){
        if(m.next==="super"){ m.st="super"; m.stT=0.5; m.vy=-640; m.vx=clamp((px-m.x)*0.8,-260,260); }
        else { m.st="hop"; m.stT=0.6; m.vy=-rr(430,560); m.vx=toP*rr(150,230); } } }
    else if(m.st==="hop"||m.st==="super"){ if(m.grounded&&m.stT<0.4){ m.st="idle"; m.stT=rr(1.6,2.6)*spd2; } m.stT-=dt; }
    else { m.dir=toP;
      if(m.stT<=0){ m.tel=ph>=2&&R()<0.4?1.0:0.6; m.next=(ph>=2&&R()<0.4)?"super":"hop";
        m.st="tel"; m.stT=m.tel; }
      if(ph===3&&R()<dt*0.25&&G.mons.length<12){ spawnMon("puff",m.x+rr(-120,120),m.z,null); } }
    break; }
  }
}
function landBoss(m){

/* ---------- boss & spawn management ---------- */
function bossTick(dt){
  const zz=ZONES[G.zone];
  if(!zz.boss) return;
  if(G.boss&&!G.boss.dead) return;
  if(G.bossAnn){ G.bossAnn.t-=dt;
    if(G.bossAnn.t<=0){ const bx=clamp(P.x+(P.face>0?420:-420),300,zz.w-300);
      G.boss=spawnMon(zz.boss,bx,G.zone,null);
      poof(bx,FLOORY-60,"#FFFFFF",22); shakeFX(5);
      G.bossAnn=null; }
    return; }
  G.bossT[G.zone]-=dt;
  if(G.bossT[G.zone]<=0){
    G.bossT[G.zone]=zz.bossEvery||90;
    G.bossAnn={t:2.2};
    const nm=MON[zz.boss].n.toUpperCase();
    bannerMsg(nm+" EMERGES!",zz.boss==="king"?"the ground trembles...":"steel yourself","#FF8A7A");
    SFX.horn(); haptic("heavy"); shakeFX(3);
  }
}
function spawnTick(dt){
  const zz=ZONES[G.zone];
  let alive=0; for(const m of G.mons) if(!m.dead&&!m.boss) alive++;
  for(let i=G.mons.length-1;i>=0;i--){ if(G.mons[i].dead&&G.mons[i].deadT>0.4) G.mons.splice(i,1); }
  G.spawnT-=dt;
  if(alive<zz.pop&&G.spawnT<=0){
    G.spawnT=rr(0.8,1.9);
    const t=pick(zz.mons);
    let sx=rr(240,zz.w-240);
    if(abs(sx-P.x)<260) sx=clamp(P.x+(R()<0.5?-1:1)*rr(300,700),140,zz.w-140);
    spawnMon(t,sx,G.zone,(R()<0.22&&!MON[t].boss)?pick(PLATS):null);
  }
}
/* ---------- ambient ---------- */
function ambTick(dt){
  if(G.amb.length<24&&R()<dt*8){
    const cs=G.cam.s, vw=W/cs;
    G.amb.push({x:G.cam.x+rr(-vw/2,vw/2),y:rr(-40,FLOORY-60),vx:rr(-14,14),vy:rr(6,26),t:0,life:rr(4,9),s:rr(1.5,4),ph:R()*TAU});
  }

/* ---------- main simulate ---------- */
function simulate(dt){

  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);

function drawLayer(c,par,yoff){
  const L=G.layers, cs=G.cam.s, w=L.TW*cs, hh=L.LH*cs;

function drawScene(){
  const pal=ZONES[G.zone].pal, cs=G.cam.s;

  ctx.fillStyle=SKYC.g; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.5; ctx.drawImage(GLOW,W*0.72-90,H*0.10-90,180,180); ctx.globalAlpha=1;
  if(G.layers){ drawLayer(G.layers.far,0.15,-26); drawLayer(G.layers.mid,0.4,-6); drawLayer(G.layers.near,0.68,8); }

/* ---------- monster drawing ---------- */
function blobPath(r,w){
  ctx.beginPath();
  ctx.moveTo(-r*w,0);
  ctx.bezierCurveTo(-r*w,-r*1.35,r*w,-r*1.35,r*w,0);
  ctx.bezierCurveTo(r*w,r*0.28,-r*w,r*0.28,-r*w,0);
  ctx.closePath();
}
function drawMon(m){
  const t=G.t, blink=sin(t*0.9+m.x)>0.975;
  let sq=m.sq>0?sin(m.sq*PI)*0.24:0;
  if(m.spawnF>0){ ctx.globalAlpha=1-m.spawnF*2; }
  if(m.dead){ ctx.globalAlpha=mx(0,1-m.deadT*2.6); sq=-m.deadT*1.2; }
  ctx.save(); ctx.translate(m.x,m.y);
  if(!m.fly){ ctx.fillStyle="rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.ellipse(0,-1,m.r*0.9,m.r*0.24,0,0,TAU); ctx.fill(); }
  ctx.scale((1+sq)*(m.dir<0?-1:1),1-sq);
  const tel=m.tel>0?sin(t*26)*0.5+0.5:0;
  switch(m.type){
  case "puff": case "bramble": {
    const zc=m.z===1?"#6BC9A8":(m.type==="bramble"?"#5BA84E":"#8FD86B");
    const dk=m.type==="bramble"?"#3E7E33":(m.z===1?"#4A9E80":"#6BB84E");
    if(m.type==="bramble"){ ctx.fillStyle=dk;
      for(let i=0;i<7;i++){ const a=PI+ i/6*PI; const sx2=cos(a)*m.r*1.05, sy=-m.r*0.62+sin(a)*m.r*0.9;
        ctx.beginPath(); ctx.moveTo(sx2*0.8,sy*0.8-m.r*0.1); ctx.lineTo(sx2*1.35,sy*1.35-m.r*0.15); ctx.lineTo(sx2*0.62,sy*0.95); ctx.closePath(); ctx.fill(); } }
    ctx.fillStyle=zc; blobPath(m.r,1.05); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.28)";
    ctx.beginPath(); ctx.ellipse(-m.r*0.32,-m.r*0.95,m.r*0.34,m.r*0.2,-0.5,0,TAU); ctx.fill();
    ctx.fillStyle=dk;

    ctx.rotate(p.rot);

    ctx.fillStyle="#5A6E8A"; ctx.beginPath(); ctx.arc(0,0,2.8,0,TAU); ctx.fill();

/* ---------- particles drawing (world space) ---------- */
function drawParts(){
  for(const p of PP){ if(!p.on)continue;
    const k=p.t/p.life, a=(1-k)*p.a;
    if(p.type==="dot"){ ctx.globalAlpha=a; ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1-k*0.5),0,TAU); ctx.fill(); }
    else if(p.type==="spark"){ ctx.globalAlpha=a; ctx.strokeStyle=p.col; ctx.lineWidth=2; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.03,p.y-p.vy*0.03); ctx.stroke(); }
    else if(p.type==="poof"){ ctx.globalAlpha=a*0.8; ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.6+k*1.1),0,TAU); ctx.fill(); }
    else if(p.type==="ring"){ ctx.globalAlpha=a; ctx.strokeStyle=p.col; ctx.lineWidth=3.4*(1-k);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*easeOut(k),0,TAU); ctx.stroke(); }
    else if(p.type==="glow"){ ctx.globalAlpha=a; ctx.globalCompositeOperation="lighter";
      const s=p.size*(1+k); ctx.drawImage(GLOW,p.x-s,p.y-s,s*2,s*2); ctx.globalCompositeOperation="source-over"; }
    else if(p.type==="slash"){
      ctx.save(); ctx.translate(p.x,p.y); ctx.scale(p.rot,1);
      ctx.rotate((k-0.5)*2.2*p.vr);
      ctx.globalAlpha=a*0.9; ctx.strokeStyle=p.col; ctx.lineCap="round";
      ctx.lineWidth=7*(1-k*0.6);
      ctx.beginPath(); ctx.arc(-p.size*0.5,0,p.size*0.62,-1.1,1.1); ctx.stroke();
      ctx.lineWidth=3*(1-k*0.5); ctx.strokeStyle="#FFFFFF";
      ctx.beginPath(); ctx.arc(-p.size*0.5,0,p.size*0.45,-0.9,0.9); ctx.stroke();
      ctx.restore(); }
    else if(p.type==="whirl"){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(k*9);
      ctx.globalAlpha=a*0.85; ctx.strokeStyle=p.col; ctx.lineCap="round";
      for(let i=0;i<3;i++){ ctx.rotate(TAU/3); ctx.lineWidth=6*(1-k);
        ctx.beginPath(); ctx.arc(0,0,p.size*(0.4+k*0.7),0,1.6); ctx.stroke(); }
      ctx.restore(); }
    else if(p.type==="beam"){
      const bh=340;
      ctx.globalAlpha=a*(k<0.15?k/0.15:1);
      const bg=ctx.createLinearGradient(0,p.y-bh,0,p.y);
      bg.addColorStop(0,"rgba(255,255,255,0)"); bg.addColorStop(0.6,p.col+"66"); bg.addColorStop(1,p.col+"AA");
      ctx.fillStyle=bg; ctx.fillRect(p.x-p.size/2,p.y-bh,p.size,bh);
      ctx.fillStyle="#FFFFFF"; ctx.globalAlpha*=0.7;
      ctx.fillRect(p.x-p.size*0.12,p.y-bh,p.size*0.24,bh); }
    ctx.globalAlpha=1;
  }
}
/* ---------- screen-space overlays for world ---------- */
function drawFloatsScreen(){
  const cs=G.cam.s;
  /* monster hp bars + boss */
  for(const m of G.mons){ if(m.dead||m.boss)continue;
    if(m.hpShow>0){ const sx=w2sx(m.x), sy=w2sy(m.y-m.h)-12;
      const w=40, a=mn(1,m.hpShow);
      ctx.globalAlpha=a; ctx.fillStyle="rgba(10,14,12,0.7)"; rrect(sx-w/2,sy,w,5,2.5); ctx.fill();
      ctx.fillStyle="#FF6A5A"; rrect(sx-w/2+1,sy+1,(w-2)*clamp(m.hp/m.hpMax,0,1),3,1.5); ctx.fill();
      ctx.globalAlpha=1; } }
  /* floating numbers */
  for(const f of FLL){ if(!f.on)continue;
    const sx=w2sx(f.x), sy=w2sy(f.y)-easeOut(f.t/f.life)*34;
    const fade=f.t>f.life-0.25?(f.life-f.t)/0.25:1;
    ctx.globalAlpha=fade;
    let xoff=0; const chars=f.txt;
    ctx.font=F(f.size,900);
    let tot=0; for(let i=0;i<chars.length;i++) tot+=ctx.measureText(chars[i]).width;
    xoff=-tot/2;
    for(let i=0;i<chars.length;i++){
      const chw=ctx.measureText(chars[i]).width;
      const dp=popS((f.t-i*0.045)/0.5);
      if(dp>0){
        ctx.save(); ctx.translate(sx+xoff+chw/2,sy+(f.crit?sin(i*1.3)*2:0)); ctx.scale(dp,dp);
        ctx.font=F(f.size,900); ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.lineWidth=mx(3,f.size*0.18); ctx.lineJoin="round";
        ctx.strokeStyle=f.crit?"rgba(120,50,0,0.9)":"rgba(20,26,20,0.85)";
        ctx.strokeText(chars[i],0,0); ctx.fillStyle=f.col; ctx.fillText(chars[i],0,0);
        ctx.restore();
      }
      xoff+=chw;
    }
    ctx.globalAlpha=1;
  }
}

function startForge(){
  if(G.forge.anim) return;
  const list=forgeList(); if(!list.length) return;
  const sel=list[clamp(G.sheet.fsel,0,list.length-1)], it=sel.it;
  if(it.star>=15){ SFX.err(); return; }
  const cost=forgeCost(it.star);
  if(S.gl<cost){ toast("Not enough glimmer.","#FF8A7A"); SFX.err(); return; }
  S.gl-=cost;
  G.forge.anim={t:0,phase:"shimmer",sel,snap:Object.assign({},it),tick:0};
  haptic("light");
}
function resolveForge(fa){
  const it=fa.sel.it, od=forgeOdds(it.star), roll=R()*100;
  fa.phase="result"; fa.t=0;
  if(roll<od.s){ it.star++; fa.result="win";
    SFX.fwin(it.star); haptic("success"); shakeFX(2);
    if(it.star>=10){ G.burstT=1.3; G.burstTxt="★"+it.star+"  "+it.name; SFX.level(); }
    toast(it.name+" is now ★"+it.star,"#FFD24A");
  }
  else if(od.d>0&&roll<od.s+od.d){ it.star=mx(0,it.star-1); fa.result="fail"; SFX.ffail(); haptic("medium"); }
  else if(od.b<=0||roll<od.s+od.d+od.h){ fa.result="hold"; SFX.gone(); }
  else { fa.result="boom";
    const gain=SHARD_BOOM+it.star*4; fa.shards=gain; S.shards+=gain;
    if(fa.sel.loc==="eq") S.eq[fa.sel.key]=null;
    else { const bi=S.bag.indexOf(it); if(bi>=0) S.bag.splice(bi,1); }
    calcStats();
    SFX.boom(); haptic("error"); shakeFX(9);
    G.sheet.fsel=0;
  }
  calcStats(); saveNow();
}
function claimEpic(slot){
  if(S.shards<SHARD_EPIC) return;
  S.shards-=SHARD_EPIC;
  const band=ZONES[S.zoneMax].band;
  const it=mkGear(slot,rr(band[0],band[1])+2,3);
  bagAdd(it); G.sheet.slotPick=false;
  bannerMsg("EPIC CLAIMED!",it.name,"#C48CFF");
  SFX.claim(); haptic("success"); saveNow();
}

    ctx.strokeStyle="#5BA8FF"; ctx.lineWidth=1.8; rrect(r.x+r.w-96,yy+rh/2-14,82,30,15); ctx.stroke();
    drawGlimIcon(r.x+r.w-82,yy+rh/2+1,0.7);
    txtC(fmt(sh.gearPrice),r.x+r.w-72,yy+rh/2+1,11,"#FFE9A0","left",900);
    ctx.globalAlpha=1;
    if(can) reg("sh:g",r.x+r.w-100,yy+rh/2-18,90,38);
  } else {
    txtC("gear sold! restocking...",r.x+r.w/2,yy+rh/2,11.5,"#7A9284","center",800);
  }
  yy+=rh+12;
  if(yy<y1-8) txtC("sell spare gear from the GEAR tab (30% value)",r.x+r.w/2,yy+4,9.5,"#7A9284","center",800);
}

/* ---------- title / pause / death ---------- */
function drawSpeaker(x,y,on,col){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2.2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x-8,y-4); ctx.lineTo(x-3,y-4); ctx.lineTo(x+3,y-9); ctx.lineTo(x+3,y+9); ctx.lineTo(x-3,y+4); ctx.lineTo(x-8,y+4); ctx.closePath(); ctx.fill();
  if(on){ ctx.beginPath(); ctx.arc(x+6,y,5,-1,1); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+6,y,9,-1,1); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(x+7,y-6); ctx.lineTo(x+15,y+6); ctx.moveTo(x+15,y-6); ctx.lineTo(x+7,y+6); ctx.stroke(); }
}
function drawTitle(){
  G.titleT+=DT;
  const tg=ctx.createLinearGradient(0,0,0,H);
  tg.addColorStop(0,"rgba(6,12,8,0.72)"); tg.addColorStop(0.45,"rgba(6,12,8,0.30)"); tg.addColorStop(1,"rgba(6,12,8,0.62)");
  ctx.fillStyle=tg; ctx.fillRect(0,0,W,H);
  reg("ti:start",0,0,W,H);
  /* rising spores */
  for(let i=0;i<14;i++){
    const ph=i*1.7, yy=H-((G.titleT*22+i*97)%(H+60))-30, xx=(i*79%W)+sin(G.titleT+ph)*18;
    ctx.globalAlpha=0.22+0.12*sin(G.titleT*2+ph);
    ctx.drawImage(GLOW,xx-6,yy-6,12,12);
  }
  ctx.globalAlpha=1;
  /* logo */
  const ly=H*0.22, ls=mn(W*0.135,58);
  ctx.save(); ctx.translate(W/2,ly);
  const word="SPOREFALL";
  ctx.font=F(ls,900);
  let tot=0; const ws=[];
  for(const ch of word){ const w2=ctx.measureText(ch).width; ws.push(w2); tot+=w2; }
  let xx=-tot/2;
  const lgrad=ctx.createLinearGradient(0,-ls*0.7,0,ls*0.55);
  lgrad.addColorStop(0,"#FFF3C4"); lgrad.addColorStop(0.5,"#FFD24A"); lgrad.addColorStop(1,"#8FD86B");
  for(let i=0;i<word.length;i++){
    const dy=sin(G.titleT*1.8+i*0.6)*4;
    ctx.font=F(ls,900); ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.lineWidth=ls*0.16; ctx.lineJoin="round"; ctx.strokeStyle="rgba(16,26,16,0.9)";
    ctx.strokeText(word[i],xx,dy); ctx.fillStyle=lgrad; ctx.fillText(word[i],xx,dy);
    xx+=ws[i];
  }
  /* mushroom perched on the O */
  const ox=-tot/2+ws[0]+ws[1]+ws[2]/2, oy=-ls*0.66+sin(G.titleT*1.8+2*0.6)*4;
  ctx.translate(ox,oy);
  ctx.fillStyle="#F2E3C8"; rrect(-4,-8,8,9,3); ctx.fill();
  ctx.fillStyle="#E86A6A"; ctx.beginPath(); ctx.ellipse(0,-8,10,6.4,0,PI,0); ctx.fill();
  ctx.fillStyle="#FFF"; ctx.beginPath(); ctx.arc(-4,-11,1.8,0,TAU); ctx.arc(3,-10,1.4,0,TAU); ctx.fill();
  ctx.restore();
  txtC("hunt cute critters · hoard glimmer · push your stars",W/2,ly+ls*0.72,mn(12.5,W*0.032),"#DCEFD8","center",800);
  /* tap to start */
  const pu=0.5+0.5*sin(G.titleT*3.4);
  const pw=200,ph2=48, py=H*0.55-ph2/2;
  ctx.globalAlpha=0.75+0.25*pu;
  ctx.fillStyle="rgba(255,210,74,0.16)"; rrect(W/2-pw/2,py,pw,ph2,24); ctx.fill();
  ctx.strokeStyle="#FFD24A"; ctx.lineWidth=2.6; rrect(W/2-pw/2,py,pw,ph2,24); ctx.stroke();
  txtO("TAP TO START",W/2,py+ph2/2,17,"#FFF3C4","center",900,3.4);
  ctx.globalAlpha=1;
  /* how to play */
  const hy=H*0.685, seg=mn(110,W*0.29);
  const items=[["drag","move"],["flick up","jump"],["tap right","attack"]];
  for(let i=0;i<3;i++){
    const cx3=W/2+(i-1)*seg;
    ctx.fillStyle="rgba(10,16,12,0.6)"; rrect(cx3-seg/2+6,hy-26,seg-12,52,14); ctx.fill();
    if(i===0){ ctx.strokeStyle="#9AB0A0"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx3,hy-8,9,0,TAU); ctx.stroke();
      ctx.fillStyle="#E8F4EC"; ctx.beginPath(); ctx.arc(cx3+3,hy-8,4,0,TAU); ctx.fill(); }
    else if(i===1){ ctx.strokeStyle="#7BD96B"; ctx.lineWidth=2.6; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(cx3-6,hy-3); ctx.lineTo(cx3,hy-14); ctx.lineTo(cx3+6,hy-3); ctx.stroke(); }
    else { ctx.strokeStyle="#FFB03A"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx3,hy-8,8,0,TAU); ctx.stroke();
      ctx.fillStyle="#FFB03A"; ctx.beginPath(); ctx.arc(cx3,hy-8,3,0,TAU); ctx.fill(); }
    txtC(items[i][0],cx3,hy+7,9.5,"#C9D6CC","center",800);
    txtC(items[i][1],cx3,hy+18,10.5,"#FFFFFF","center",900);
  }
  /* best stats */
  if(S.bestLv>1||S.glLife>0){
    txtC("Best Lv "+S.bestLv+" · "+ZONES[S.zoneMax].name,W/2,H*0.685+52,11.5,"#C9B88A","center",800);
    drawGlimIcon(W/2-fmt(S.glLife).length*3.5-14,H*0.685+70,0.8);
    txtC(fmt(S.glLife)+" gathered lifetime",W/2+4,H*0.685+70,11,"#C9B88A","center",800);
  }
  /* mute */
  const mcx=W-SAFE.r-32, mcy=SAFE.t+30;
  ctx.fillStyle="rgba(10,16,12,0.72)"; ctx.beginPath(); ctx.arc(mcx,mcy,19,0,TAU); ctx.fill();
  drawSpeaker(mcx-3,mcy,!S.mute,"#DCEFD8");
  regC("ti:mute",mcx,mcy,23);
  /* arcade link */
  if(G.arcadeLink){
    txtC("⌂ arcade",SAFE.l+16,H-SAFE.b-16,11,"rgba(220,239,216,0.6)","left",800);
    reg("ti:home",SAFE.l+4,H-SAFE.b-34,86,34);
  }
  txtC("v1 · made for jlud.dev",W-SAFE.r-12,H-SAFE.b-16,9,"rgba(220,239,216,0.35)","right",800);
}
function drawPause(){
  ctx.fillStyle="rgba(6,10,8,0.66)"; ctx.fillRect(0,0,W,H);
  reg("pz:none",0,0,W,H);
  const pw=250, phh=292, x=(W-pw)/2, y=mx(SAFE.t+20,(H-phh)*0.42);
  ctx.fillStyle="rgba(20,28,23,0.98)"; rrect(x,y,pw,phh,20); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.12)"; ctx.lineWidth=1.6; rrect(x,y,pw,phh,20); ctx.stroke();
  txtO("PAUSED",W/2,y+34,22,"#FFF3C4","center",900,4);
  const btns=[["pz:resume","RESUME","#7BD96B"],["pz:restart","RESTART ZONE","#FFB03A"],
    ["pz:mute",S.mute?"SOUND: OFF":"SOUND: ON","#9AD0FF"],["pz:title","QUIT TO TITLE","#FF8A7A"]];
  let by=y+64;
  for(const b of btns){
    ctx.fillStyle="rgba(10,16,12,0.8)"; rrect(x+24,by,pw-48,42,21); ctx.fill();
    ctx.strokeStyle=b[2]; ctx.lineWidth=2; rrect(x+24,by,pw-48,42,21); ctx.stroke();
    txtC(b[1],W/2,by+21,13,b[2],"center",900);
    reg(b[0],x+18,by-2,pw-36,46);
    by+=54;
  }
}
const QUIPS=["The critters send their regards.","Even King Puff started small.","The moss remembers you fondly.","A very soft way to go.","Your cape looked great though."];
function drawDeath(){
  const rg=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.8);
  rg.addColorStop(0,"rgba(40,8,8,0.55)"); rg.addColorStop(1,"rgba(10,4,6,0.88)");
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  reg("dt:none",0,0,W,H);
  const di=G.deadInfo||{lost:0};
  txtO("FLATTENED.",W/2,H*0.3,mn(38,W*0.09),"#FF8A7A","center",900,6);
  txtC(QUIPS[S.deaths%QUIPS.length],W/2,H*0.3+34,12.5,"#E8C9C0","center",800);
  txtC("dropped "+fmt(di.lost)+" glimmer · kept all gear & XP",W/2,H*0.3+58,11.5,"#C9B88A","center",800);
  const pw=210,ph3=52, py=H*0.52;
  const pu=0.5+0.5*sin(G.t*4);
  ctx.globalAlpha=0.8+0.2*pu;
  ctx.fillStyle="rgba(123,217,107,0.18)"; rrect(W/2-pw/2,py,pw,ph3,26); ctx.fill();
  ctx.strokeStyle="#7BD96B"; ctx.lineWidth=3; rrect(W/2-pw/2,py,pw,ph3,26); ctx.stroke();
  txtO("RETRY",W/2,py+ph3/2,19,"#D6FFC9","center",900,3.4);
  ctx.globalAlpha=1;
  reg("dt:retry",W/2-pw/2-10,py-8,pw+20,ph3+16);
  txtC("back to title",W/2,py+ph3+30,12,"#9AB0A0","center",800);
  reg("dt:title",W/2-70,py+ph3+14,140,32);
}
/* ---------- master draw ---------- */
let DT=1/60;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  REG.length=0;
  drawScene();
  if(G.state==="title"){ drawTitle(); }
  else{
    drawHUD(); drawBossBar(); drawButtons(); drawJoy();
    if(G.sheet.open) drawSheet();
    if(G.cc) drawCC();
    drawToasts(); drawBanner();
    if(G.burstT>0) drawBurst();
    if(G.showDeath) drawDeath();
    if(G.paused) drawPause();
  }
  drawTrans();
}

/* ---------- UI actions ---------- */
function equipFromBag(idx){
  const it=S.bag[idx]; if(!it)return;
  const old=S.eq[it.slot];
  S.bag.splice(idx,1); S.eq[it.slot]=it;
  if(old) S.bag.push(old);
  calcStats(); SFX.buy(); haptic("light");
  toast("Equipped "+it.name,RARC[it.rar]); G.cc=null; saveNow();
}
function sellItem(idx){
  const it=S.bag[idx]; if(!it)return;
  const v=fl(itemVal(it)*0.3);
  S.bag.splice(idx,1); S.gl+=v; S.glLife+=v;
  toast("Sold for "+fmt(v)+" glimmer","#5BA8FF"); SFX.sell(); G.cc=null; saveNow();
}
function toTitle(){
  G.state="title"; G.paused=false; G.showDeath=false; G.sheet.open=false; G.cc=null; G.banner=null; G.forge.anim=null;
  P.ghost=true; P.dead=false; calcStats(); P.hp=ST.hpMax;
  respawnAt(S.curZone,false);
  P.x=ZONES[G.zone].w*0.45; G.cam.x=P.x;
  saveNow();
}
function onUI(id,tid){
  if(id==="hud:atk"){ G.atkT.add(tid); return; }
  if(id==="hud:jmp"){ P.jbuf=JBUF; return; }
  switch(id){
  case "ti:start": if(!G.trans){ P.ghost=false; SFX.ui(); haptic("light"); startGame(); } break;
  case "ti:mute": setMute(!S.mute); SFX.ui(); break;
  case "ti:home": try{ location.href="/arcade"; }catch(e){} break;
  case "hud:menu": if(G.sheet.open) closeSheet(); else openSheet(0,false); break;
  case "hud:pause": G.paused=!G.paused; clearInput(); SFX.ui(); break;
  case "hud:ps": useSkill("ps"); break;
  case "hud:tv": useSkill("tv"); break;
  case "hud:ww": useSkill("ww"); break;
  case "hud:pot": usePotion(); break;
  case "hud:shop": openSheet(3,true); haptic("light"); break;
  case "tab:0": case "tab:1": case "tab:2": case "tab:3":
    if(!G.forge.anim){ G.sheet.tab=+id.slice(4); G.sheet.slotPick=false; SFX.ui(); } break;
  case "sheet:close": case "sheet:back": if(!G.forge.anim) closeSheet(); break;
  case "cc:back": case "cc:close": G.cc=null; SFX.ui(); break;
  case "cc:equip": if(G.cc&&G.cc.from==="bag") equipFromBag(G.cc.idx); break;
  case "cc:sell": if(G.cc&&G.cc.from==="bag") sellItem(G.cc.idx); break;
  case "cc:forge": if(G.cc){ const list=forgeList();
      for(let i=0;i<list.length;i++) if(list[i].it===G.cc.it) G.sheet.fsel=i;
      G.sheet.tab=1; G.cc=null; SFX.ui(); } break;
  case "fg:prev": G.sheet.fsel--; SFX.ui(); break;
  case "fg:next": G.sheet.fsel++; SFX.ui(); break;
  case "fg:go": startForge(); break;
  case "fg:claim": G.sheet.slotPick=true; SFX.ui(); break;
  case "pz:resume": G.paused=false; SFX.ui(); break;
  case "pz:restart": G.paused=false; SFX.ui();
    G.trans={t:0,phase:0,label:ZONES[G.zone].name,cb:()=>{ doRespawn(); }}; break;
  case "pz:mute": setMute(!S.mute); SFX.ui(); break;
  case "pz:title": toTitle(); break;
  case "dt:retry": SFX.ui(); haptic("medium");
    G.trans={t:0,phase:0,label:ZONES[G.zone].name,cb:()=>{ doRespawn(); }}; break;
  case "dt:title": toTitle(); break;
  default:
    if(id.startsWith("fg:slot:")) claimEpic(SLOTS[+id.slice(8)]);
    else if(id.startsWith("eq:")){ const it=S.eq[id.slice(3)]; if(it){ G.cc={it,from:"eq",key:id.slice(3)}; SFX.ui(); } }
    else if(id.startsWith("bag:")){ const i=+id.slice(4); if(S.bag[i]){ G.cc={it:S.bag[i],from:"bag",idx:i}; SFX.ui(); } }
    else if(id==="sh:p0"||id==="sh:p1"){ const sh=shopFor(G.zone), p=sh.pots[+id.slice(4)];
      if(p.stock>0&&S.gl>=p.price){ S.gl-=p.price; p.stock--; S[p.k]++;
        toast("+ "+p.n,p.k==="pM"?"#FF9CC0":"#8FE87B"); SFX.buy(); haptic("light"); saveNow(); } }
    else if(id==="sh:gv"){ const sh=shopFor(G.zone); if(sh.gearStock>0){ G.cc={it:sh.gear,from:"shop"}; SFX.ui(); } }
    else if(id==="sh:g"){ const sh=shopFor(G.zone);
      if(sh.gearStock>0&&S.gl>=sh.gearPrice){ S.gl-=sh.gearPrice; sh.gearStock=0;
        bagAdd(sh.gear); toast("+ "+sh.gear.name,RARC[sh.gear.rar]); SFX.buy(); haptic("light"); saveNow(); } }
    break;
  }
}
/* ---------- input ---------- */
function touchStart(id,x,y){
  initAudio();
  if((G.stick&&G.stick.id===id)||G.atkT.has(id)||G.pressed[id]!=null) return;
  const rid=hitReg(x,y);
  if(rid){ G.pressed[id]=rid; onUI(rid,id); return; }
  if(G.state!=="play"||G.paused||G.sheet.open||G.cc||G.showDeath) return;
  if(x<W*0.48&&y>SAFE.t+96){ G.stick={id,bx:x,by:y,dx:0,dy:0,pdy:0}; }
  else if(x>=W*0.48){ G.atkT.add(id); }
}
function touchMove(id,x,y){
  const s=G.stick;
  if(s&&s.id===id){
    s.dx=x-s.bx; s.dy=y-s.by;
    const d=sqrt(s.dx*s.dx+s.dy*s.dy);
    if(d>52){ const k=(d-52)/d; s.bx+=s.dx*k; s.by+=s.dy*k; s.dx*=52/d; s.dy*=52/d; }
    if(s.dy<-30&&s.pdy>=-30) P.jbuf=JBUF;
    s.pdy=s.dy;
  }
}
function touchEnd(id){
  delete G.pressed[id];
  G.atkT.delete(id);
  if(G.stick&&G.stick.id===id) G.stick=null;
}
cv.addEventListener("touchstart",e=>{ e.preventDefault(); for(const t of e.changedTouches) touchStart(t.identifier,t.clientX,t.clientY); },{passive:false});
cv.addEventListener("touchmove",e=>{ e.preventDefault(); for(const t of e.changedTouches) touchMove(t.identifier,t.clientX,t.clientY); },{passive:false});
cv.addEventListener("touchend",e=>{ e.preventDefault(); for(const t of e.changedTouches) touchEnd(t.identifier); },{passive:false});
cv.addEventListener("touchcancel",e=>{ for(const t of e.changedTouches) touchEnd(t.identifier); },{passive:false});
let mDown=false;
cv.addEventListener("mousedown",e=>{ if(e.button!==0)return; mDown=true; touchStart("m",e.clientX,e.clientY); });
cv.addEventListener("mousemove",e=>{ if(mDown) touchMove("m",e.clientX,e.clientY); });
window.addEventListener("mouseup",()=>{ if(mDown){ mDown=false; touchEnd("m"); } });
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(k)||k==="space") e.preventDefault();
  initAudio();
  if(G.state==="title"){ if(k==="enter"||k===" "||k==="spacebar"){ P.ghost=false; startGame(); } return; }
  if(G.showDeath){ if(k===" "||k==="enter"||k==="w"||k==="arrowup") onUI("dt:retry"); return; }
  if(k==="arrowleft"||k==="a") G.keys.left=true;
  else if(k==="arrowright"||k==="d") G.keys.right=true;
  else if(k==="arrowdown"||k==="s") G.keys.down=true;
  else if(k===" "||k==="w"||k==="arrowup"){ P.jbuf=JBUF; }
  else if(k==="j"||k==="z") G.keys.atk=true;
  else if(k==="k"||k==="x") useSkill("ps");
  else if(k==="l"||k==="c") useSkill("tv");
  else if(k==="v"||k===";") useSkill("ww");
  else if(k==="q") usePotion();
  else if(k==="i"){ if(G.sheet.open) closeSheet(); else openSheet(0,false); }
  else if(k==="p"||k==="escape"){ if(G.sheet.open) closeSheet(); else if(G.cc) G.cc=null; else G.paused=!G.paused; }
  else if(k==="m") setMute(!S.mute);
});
window.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowleft"||k==="a") G.keys.left=false;
  else if(k==="arrowright"||k==="d") G.keys.right=false;
  else if(k==="arrowdown"||k==="s") G.keys.down=false;
  else if(k==="j"||k==="z") G.keys.atk=false;
});
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>{ setTimeout(resize,60); });
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(G.state==="play"&&!G.showDeath) G.paused=true; saveNow(); }
});
/* ---------- main loop ---------- */
let lastT=0;
function update(dt){
  musicTick();
  updateParts(dt); updateFloats(dt);
  if(G.state==="title"){ simulate(dt); return; }
  const blocked=G.paused||G.showDeath||G.sheet.open||G.cc||(G.trans&&G.trans.phase===0);
  if(!blocked) simulate(dt);
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT=ts;
  let dt=mn(0.05,(ts-lastT)/1000); lastT=ts;
  DT=dt; G.t+=dt;
  let simDt=dt;
  if(G.hitstop>0){ G.hitstop-=dt; simDt=0; }
  G.shake=mx(0,G.shake-dt*16);
  G.shx=rr(-G.shake,G.shake); G.shy=rr(-G.shake,G.shake)*0.7;
  update(simDt);
  draw();
}
/* ---------- boot ---------- */
loadSave();
calcStats(); P.hp=ST.hpMax;
try{ G.arcadeLink=location.pathname.includes("/games/"); }catch(e){}
resize();
toTitle();
window.__sf={
  save:saveNow,
  state:()=>({lv:S.lv,gl:S.gl,zone:G.zone,px:rnd(P.x),vx:rnd(P.vx),stick:G.stick?{dx:rnd(G.stick.dx),dy:rnd(G.stick.dy)}:null,atk:G.atkT.size,dead:P.dead,paused:G.paused,sheet:G.sheet.open,tk:S.tk}),
  test(){ try{ saveNow(); const raw=localStorage.getItem(SAVEKEY); if(!raw) return "no-storage";
    const d=JSON.parse(raw); return (d&&d.v===1&&d.lv===S.lv&&d.gl===S.gl)?"ok":"mismatch"; }catch(e){ return "err:"+e; } }
};
draw();
requestAnimationFrame(loop);
})();
</script>
