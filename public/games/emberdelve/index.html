  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ ctx.fillText(line,cx,y); line=w; y+=lh; }
    else line=test;
  }
  if(line) ctx.fillText(line,cx,y);
}
function drawRelicGetOverlay(){
  ctx.fillStyle='rgba(3,4,9,.78)'; ctx.fillRect(0,0,vw,vh);
  const rl=relicById(S.gotRelic); if(!rl) return;
  const pop=Math.min(1,S.ovT*3.4), w=Math.min(320,vw*0.84), h=150;
  ctx.save(); ctx.translate(vw/2,vh*0.44); ctx.scale(0.7+0.3*pop,0.7+0.3*pop); ctx.translate(-vw/2,-vh*0.44);
  setFont(16,900); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=GOLD; ctx.fillText('RELIC FOUND',vw/2,vh*0.44-h/2-26);
  drawRelicCard('nope',rl,vw/2-w/2,vh*0.44-h/2,w,h,true);
  UI.btns.pop(); // card is not a button here
  ctx.restore();
  if(S.ovT>0.5){ setFont(12,650); ctx.fillStyle='rgba(190,198,220,'+(0.5+0.4*Math.sin(S.t*4))+')';
    ctx.fillText('tap anywhere',vw/2,vh*0.44+h/2+30); }
}
function drawDescendOverlay(){
  const t=S.ovT, a=t<0.5?t*2:(t>1.1?(1.6-t)*2:1);
  ctx.fillStyle='rgba(2,3,8,'+clamp(a,0,1)+')'; ctx.fillRect(0,0,vw,vh);
  if(t>0.3&&t<1.45){
    ctx.globalAlpha=clamp((t-0.3)*3,0,1)*clamp((1.45-t)*4,0,1);
    setFont(Math.min(38,vw*0.09),900); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=AMBER; ctx.fillText('FLOOR '+R.floor,vw/2,vh*0.44);
    setFont(14,650); ctx.fillStyle=BONE; ctx.fillText(zoneName(R.floor),vw/2,vh*0.44+34);
    ctx.globalCompositeOperation='lighter';
    for(const m of MOTES){ const s=m.s*5*m.z;
      ctx.drawImage(SPR.mote,m.x*vw-s,((m.y+t*0.3)%1)*vh-s,s*2,s*2); }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
}
function drawResumeOverlay(){
  ctx.fillStyle='rgba(3,4,9,.78)'; ctx.fillRect(0,0,vw,vh);
  setFont(Math.min(26,vw*0.06),900); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffd9a0'; ctx.fillText('THE TORCH WAITS',vw/2,vh*0.42);
  setFont(14,650); ctx.fillStyle='rgba(190,198,220,'+(0.5+0.4*Math.sin(S.t*4))+')';
  ctx.fillText('tap to keep delving',vw/2,vh*0.42+34);
}
/* ------------------------------- button logic ----------------------------- */
function setMode(m){
  S.mode=m; UI.btns.length=0; S.sel=-1;
  try{ arcLink.style.display=(m==='title'&&location.pathname.includes('/games/'))?'block':'none'; }catch(e){}
}
function onBtn(id){
  if(id==='mute'){ setMute(!SAVE.mute); SND.ui(); return; }
  if(id==='tint'){ const i=SAVE.tints.indexOf(SAVE.tint);
    SAVE.tint=SAVE.tints[(i+1)%SAVE.tints.length]; persist(); SND.ui(); return; }
  if(id==='pause'){ if(S.mode==='game'&&!S.overlay){ setMode('pause'); SND.ui(); } return; }
  switch(S.mode){
    case 'title':
      if(id==='run'){ SND.ui(); if(forgeRank('blade')) setMode('weapon'); else startRun('ember'); }
      else if(id==='continue'&&SAVE.midRun){ SND.ui(); resumeRun(SAVE.midRun); }
      else if(id==='forge'){ SND.ui(); S.forgeFrom='title'; setMode('forge'); }
      break;
    case 'weapon':
      if(id==='wp:ember') startRun('ember');
      else if(id==='wp:charred') startRun('charred');
      break;
    case 'forge':
      if(id==='back'){ SND.back(); setMode(S.forgeFrom==='recap'?'recap':'title'); }
      else if(id.startsWith('node:')){ S.sel=+id.slice(5); SND.ui(); }
      else if(id==='buy'&&S.sel>=0){
        if(forgeBuy(FORGE[S.sel])){
          burst(0,0,0); // noop keep pool warm
          S.banner=null;
        }
      }
      break;
    case 'pause':
      if(id==='resume'){ SND.ui(); setMode('game'); }
      else if(id==='restart'){ SND.ui(); const w=R?R.weapon:'ember'; startRun(w); }
      else if(id==='title'){ SND.back(); checkpoint(); setMode('title'); }
      break;
    case 'recap':
      if(id==='retry'){ SND.ui(); startRun(S.recap&&R?R.weapon:'ember'); }
      else if(id==='forge'){ SND.ui(); S.forgeFrom='recap'; setMode('forge'); }
      else if(id==='title'){ SND.back(); setMode('title'); }
      break;
    case 'victory':
      if(id==='vic:go'){ SND.descend(); setMode('game'); S.overlay='descend'; S.ovT=0; S.descended=false; }
      else if(id==='vic:end'){ SND.fanfare(); buildRecap(true); setMode('recap'); }
      break;
    case 'game':
      if(S.overlay==='shrine'&&id.startsWith('card:')){
        const i=+id.slice(5), rl=S.shrineCards&&S.shrineCards[i];
        if(rl){ S.overlay=null; applyRelic(rl.id); S.shrineCards=null; }
      }
      break;
  }
}
/* -------------------------------- main loop ------------------------------- */
function updateFx(dt){
  for(const p of PARTS){ if(!p.on) continue;
    p.t+=dt; if(p.t>=p.dur){ p.on=false; continue; }
    p.vy+=p.g*dt; if(p.drag){ p.vx*=Math.pow(p.drag,dt); p.vy*=Math.pow(p.drag,dt); }
    p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(const f of FLOATS){ if(!f.on) continue; f.t+=dt; if(f.t>=f.dur) f.on=false; }
  for(let i=RINGSFX.length-1;i>=0;i--){ const g=RINGSFX[i];
    g.t+=dt; g.r+=g.vr*dt; if(g.t>g.dur) RINGSFX.splice(i,1); }
  for(const m of MOTES){ m.y-=m.sp*dt*m.z*2; m.x+=Math.sin(S.t*0.6+m.ph)*0.008*dt;
    if(m.y<-0.05){ m.y=1.05; m.x=RND(); } if(m.x>1.05)m.x=-0.05; if(m.x<-0.05)m.x=1.05; }
  if(S.kilnArc){ S.kilnArc.t-=dt; if(S.kilnArc.t<=0) S.kilnArc=null; }
}
function updateCam(dt){
  if(!F) return;
  if(!CAM.init){ CAM.x=P.x; CAM.y=P.y; CAM.init=true; }
  const f=1-Math.pow(0.0015,dt);
  CAM.x=lerp(CAM.x,P.x,f); CAM.y=lerp(CAM.y,P.y,f);
  const hw=vw/2/TILE, hh=vh/2/TILE;
  CAM.x=F.w<hw*2?F.w/2:clamp(CAM.x,hw,F.w-hw);
  CAM.y=F.h<hh*2?F.h/2:clamp(CAM.y,hh,F.h-hh);
}
let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-lastT)/1000)||0.016; lastT=now;
  S.t+=dt; UI.hotT-=dt; S.flash-=dt;
  if(S.bannerT>0) S.bannerT-=dt;
  // shake
  S.shakeP*=Math.pow(0.001,dt);
  if(S.shakeP<0.05)S.shakeP=0;
  S.shakeX=(RND()*2-1)*S.shakeP; S.shakeY=(RND()*2-1)*S.shakeP;
  let gdt=dt;
  if(S.hitstop>0){ S.hitstop-=dt; gdt=0; }
  else if(S.slowmo>0){ S.slowmo-=dt; gdt=dt*0.28; }
  updateFx(dt);
  if(S.mode==='game'){
    if(S.overlay){
      S.ovT+=dt;
      if(S.overlay==='descend'){
        if(S.ovT>=0.55&&!S.descended){ S.descended=true; arrive(R.floor+1); }
        if(S.ovT>=1.6){ S.overlay=null; }
      }
    } else if(gdt>0){
      R.time+=gdt;
      updPlayer(gdt); updEnemies(gdt); updatePicks(gdt); updateProps(gdt); updateRooms(gdt);
      if(P.dead){ S.deathT+=dt;
        if(S.deathT>1.5){ buildRecap(false); setMode('recap'); } }
      if(S.winT>0){ S.winT+=dt; if(S.winT>2){ S.winT=0; setMode('victory'); } }
    }
    updateCam(dt);
  }
  if(S.mode==='recap'&&S.recap){
    const prev=Math.floor(S.recap.earned*clamp(S.tallyT/1.3,0,1));
    S.tallyT+=dt;
    const cur=Math.floor(S.recap.earned*clamp(S.tallyT/1.3,0,1));
    if(cur>prev&&AC) SND.emberTick();
  }
  const bossOn=!!(S.mode==='game'&&F&&F.boss&&!F.boss.dead&&F.boss.room&&F.boss.room.gated);
  musicTick(bossOn);
  draw();
}
function draw(){
  UI.btns.length=0;
  switch(S.mode){
    case 'title': drawTitle(); break;
    case 'forge': drawForge(); break;
    case 'weapon': drawWeapon(); break;
    case 'pause': drawPause(); break;
    case 'recap': drawRecap(); break;
    case 'victory': drawVictory(); break;
    case 'game':
      drawWorld(); drawHUD();
      if(S.overlay==='shrine') drawShrineOverlay();
      else if(S.overlay==='relicGet') drawRelicGetOverlay();
      else if(S.overlay==='descend') drawDescendOverlay();
      else if(S.overlay==='resume') drawResumeOverlay();
      break;
    default:
      ctx.fillStyle=INK; ctx.fillRect(0,0,vw,vh);
  }
}
/* ---------------------------------- boot ---------------------------------- */
loadSave();
resize();
initMotes();
setMode('title');
draw(); // first frame immediately
requestAnimationFrame(frame);
setTimeout(resize,60); // settle safe-area probe
/* test hooks (harness --eval) */
window.__ED={
  testSave(){
    try{
      const before=SAVE.embers;
      SAVE.embers+=3; persist();
      const raw=localStorage.getItem(SAVE_KEY), p=JSON.parse(raw);
      const ok=p&&p.v===1&&p.embers===SAVE.embers;
      SAVE.embers=before; persist();
      return ok?'SAVE-OK':'SAVE-MISMATCH';
    }catch(e){ return 'STORAGE-BLOCKED(ok): '+e; }
  },
  state(){ return {mode:S.mode,floor:R?R.floor:0,embers:SAVE.embers,best:SAVE.bestFloor}; },
  /* QA drivers (harmless in production) */
  warp(fl){ if(!R) startRun('ember'); arrive(fl); S.overlay=null; return R.floor; },
  toRoom(type){ if(!F) return false;
    const r=F.rooms.find(q=>q.type===type&&!q.cleared)||F.rooms.find(q=>q.type===type);
    if(!r) return false;
    P.x=r.rx+r.rw/2; P.y=r.ry+r.rh/2; CAM.init=false; return true; },
  kill(){ if(P){ P.iframe=0; P.roll.t=0; hurtPlayer(99,null,'the abyss (debug)'); } },
  heal(){ if(P){ P.dead=false; P.hearts=P.maxH=12; P.iframe=1; } },
  slayBoss(){ if(F&&F.boss&&!F.boss.dead){ F.boss.hp=0; killEnemy(F.boss,0); return true; } return false; },
  toProp(kind,dx){ if(!F) return false;
    const pr=F.props.find(q=>q.kind===kind);
    if(!pr) return false; P.x=pr.x+(dx===undefined?1.6:dx); P.y=pr.y; CAM.init=false; return true; },
  give(n){ SAVE.embers+=n||100; persist(); },
  relic(id){ if(R) applyRelic(id); },
};
})();
</script>
