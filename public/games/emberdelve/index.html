<script>
/* EMBERDELVE - a torch-lit dungeon roguelite for jlud.dev
   Left thumb: move (floating stick). Right thumb: ATK (3-hit combo) + ROLL (i-frames).
   Die, bank your embers, buy permanent heat at the Forge, delve again.
   One more floor. Always one more floor. */
"use strict";
(()=>{
const TAU = Math.PI*2;
/* ------------------------------- tunables ------------------------------- */
const CFG = {
  DPR_CAP:2.5, TILE_MIN:24, TILE_MAX:46, LIGHT_SCALE:.34,
  ROOM_W:11, ROOM_H:7, STRIDE_X:17, STRIDE_Y:13, GRID:4,
  P_SPD:3.7, P_R:.30, ROLL_T:.35, ROLL_SPD:8.8, ROLL_CD:.6,
  IFRAME:.9, AIM_ASSIST:3.0,
  ATK_RANGE:1.62, ATK_ARC:1.12,
  SWING_T:[.23,.23,.32], SWING_DMG:[1,1,1.7], COMBO_GAP:.42,
  BASE_DMG:11,
  MOTES:40, PARTS:420, FLOATS:64,
  WARDEN_EMBERS:22, KILN_EMBERS:70,
};
const INK='#04060c', AMBER='#ffb35c', GOLD='#ffd24a', CYAN='#8fe8ff',
      RED='#ff6a5a', BONE='#cfd4e0', DIM='#7c8aa6', VIOLET='#c49bff',
      GREEN='#9fe07a', FONT="-apple-system,'Avenir Next','Segoe UI',system-ui,sans-serif";
const ZONES=[
  {name:'THE COLD HALLS',  floor:'#252e44', floorB:'#1d2536', wall:'#12182a', wallHi:'#33405e',
   dark:'5,8,17',  darkA:.855, grime:'#1b2336', torch:'#ffb35c'},
  {name:'ROOTBOUND DEEP',  floor:'#25382b', floorB:'#1c2b21', wall:'#101f17', wallHi:'#33513c',
   dark:'4,12,10', darkA:.875, grime:'#182b1e', torch:'#ffc06a'},
  {name:'THE ASHFALL',     floor:'#3a2a2e', floorB:'#2c1f24', wall:'#1e1216', wallHi:'#553640',
   dark:'12,5,8',  darkA:.895, grime:'#2a1c20', torch:'#ff9a4e'},
];
const TINTS={
  ember:{name:'Emberlight', c:'#ffb35c', c2:'#ff7a3c'},
  sylph:{name:'Sylphlight', c:'#bfeaff', c2:'#6fc0ff'},
  rose: {name:'Rosefire',   c:'#ffa0b4', c2:'#ff5a7a'},
  verdant:{name:'Vernal Flame', c:'#d8f09a', c2:'#7ad06a'},
  royal:{name:'Royal Pyre', c:'#d8b4ff', c2:'#9a6aff'},
};
const TINT_ORDER=['ember','sylph','rose','verdant','royal'];
const WEAPONS={
  ember:  {name:'EMBER SWORD',  sub:'quick and true', dmg:11, rangeM:1,    arcM:1,   timeM:1},
  charred:{name:'CHARRED BLADE',sub:'slow, wide, heavy', dmg:17, rangeM:1.15, arcM:1.32, timeM:1.42},
};
/* --------------------------------- utils -------------------------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t,
      RND=Math.random, hyp=Math.hypot;
const angDiff=(a,b)=>{let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;};
function mulberry(seed){ let a=seed>>>0; return ()=>{ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
let grnd=RND; // gen rng, seeded per floor
const gi=(n)=>(grnd()*n)|0;
function pickW(list,wf){ let s=0; for(const it of list)s+=wf(it);
  let r=RND()*s; for(const it of list){ r-=wf(it); if(r<=0)return it; } return list[list.length-1]; }
/* ---------------------------- native bridge ----------------------------- */
const NATIVE=()=> (window.webkit && webkit.messageHandlers && webkit.messageHandlers.native) || null;
function native(msg){ try{ const n=NATIVE(); if(n) n.postMessage(msg); }catch(e){} }
function haptic(kind){ native({type:'haptic', kind}); }
/* --------------------------------- save --------------------------------- */
const SAVE_KEY='jlud.emberdelve.v1';
let SAVE={ v:1, embers:0, forge:{}, bestFloor:0, kills:0, runs:0, wins:0,
  tints:['ember'], tint:'ember', endless:false, mute:false, midRun:null };
function loadSave(){
  let s=null;
  try{ s=window.__saved||null; }catch(e){}
  if(!s){ try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) s=JSON.parse(raw); }catch(e){} }
  if(s && s.v===1){ for(const k in SAVE) if(s[k]!==undefined) SAVE[k]=s[k]; }
  if(!SAVE.tints || !SAVE.tints.length) SAVE.tints=['ember'];
  if(!TINTS[SAVE.tint]) SAVE.tint='ember';
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){}
  native({type:'save', data:SAVE});
}
const forgeRank=(id)=>SAVE.forge[id]|0;
/* --------------------------------- audio -------------------------------- */
let AC=null, MASTER=null, MGAIN=null, NOISEBUF=null, audioTried=false;
function initAudio(){
  if(AC||audioTried===2) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=SAVE.mute?0:0.42; MASTER.connect(AC.destination);
    MGAIN=AC.createGain(); MGAIN.gain.value=0.16; MGAIN.connect(MASTER);
    const len=AC.sampleRate*1.2, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    NOISEBUF=b;
  }catch(e){ audioTried=2; }
}
function audioOn(){ initAudio(); if(AC && AC.state==='suspended'){ try{AC.resume();}catch(e){} } }
function setMute(m){ SAVE.mute=m; if(MASTER) MASTER.gain.value=m?0:0.42; persist(); }
function tone(f0,f1,dur,type,vol,when,q){
  if(!AC||SAVE.mute) return;
  const t=(when||AC.currentTime);
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let node=o;
    if(q){ const flt=AC.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=q; o.connect(flt); node=flt; }
    node.connect(g); g.connect(MASTER);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,fc,vol,when,type,fslide){
  if(!AC||SAVE.mute||!NOISEBUF) return;
  const t=(when||AC.currentTime);
  try{
    const s=AC.createBufferSource(); s.buffer=NOISEBUF; s.loop=true;
    const f=AC.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.setValueAtTime(fc,t); f.Q.value=1.1;
    if(fslide) f.frequency.exponentialRampToValueAtTime(Math.max(30,fslide),t+dur);
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(MASTER);
    s.start(t); s.stop(t+dur+0.02);
  }catch(e){}
}
const mid2f=m=>440*Math.pow(2,(m-69)/12);
const SND={
  swing(step){ noise(0.11,1400-step*180,0.16,0,'bandpass',420); tone(300+step*60,180,0.08,'triangle',0.05); },
  hit(big){ tone(big?150:190,55,big?0.16:0.1,'square',big?0.2:0.13,0,900); noise(0.06,2600,0.12); if(big)noise(0.16,300,0.2,0,'lowpass'); },
  kill(){ tone(240,50,0.22,'sawtooth',0.14,0,700); noise(0.18,900,0.14,0,'bandpass',200); },
  hurt(){ tone(140,60,0.28,'square',0.22,0,500); noise(0.2,500,0.18,0,'lowpass'); },
  roll(){ noise(0.16,900,0.12,0,'bandpass',2400); },
  coin(){ const t=AC?AC.currentTime:0; tone(1046,1046,0.05,'sine',0.1,t); tone(1568,1568,0.09,'sine',0.09,t+0.05); },
  pip(){ const t=AC?AC.currentTime:0; tone(523,523,0.08,'sine',0.12,t); tone(784,784,0.14,'sine',0.1,t+0.07); },
  key(){ const t=AC?AC.currentTime:0; tone(1318,1318,0.07,'triangle',0.12,t); tone(1975,1975,0.12,'triangle',0.1,t+0.06); },
  ui(){ tone(660,880,0.06,'sine',0.08); },
  back(){ tone(440,330,0.08,'sine',0.08); },
  deny(){ tone(220,180,0.12,'square',0.1,0,600); },
  gate(){ noise(0.3,180,0.28,0,'lowpass'); tone(80,50,0.3,'square',0.14,0,300); },
  gateOpen(){ const t=AC?AC.currentTime:0; noise(0.25,240,0.2,t,'lowpass'); tone(523,523,0.12,'sine',0.08,t+0.15); tone(784,784,0.2,'sine',0.08,t+0.25); },
  chest(){ const t=AC?AC.currentTime:0; noise(0.2,500,0.12,t,'bandpass'); [784,988,1318,1568].forEach((f,i)=>tone(f,f,0.14,'triangle',0.1,t+0.1+i*0.07)); },
  relic(){ const t=AC?AC.currentTime:0; [523,659,784,1046,1318].forEach((f,i)=>tone(f,f,0.5,'sine',0.07,t+i*0.09)); noise(0.7,3000,0.05,t,'highpass'); },
  shrine(){ const t=AC?AC.currentTime:0; tone(392,392,0.7,'sine',0.08,t); tone(587,587,0.7,'sine',0.06,t+0.1); },
  buy(){ const t=AC?AC.currentTime:0; tone(880,880,0.06,'sine',0.1,t); tone(1174,1174,0.1,'sine',0.1,t+0.06); },
  descend(){ const t=AC?AC.currentTime:0; noise(0.9,600,0.16,t,'lowpass',80); tone(180,60,0.9,'sine',0.12,t); },
  bonfire(){ const t=AC?AC.currentTime:0; noise(0.8,900,0.08,t,'bandpass'); [392,494,587,784].forEach((f,i)=>tone(f,f,0.5,'sine',0.07,t+i*0.12)); },
  roar(){ const t=AC?AC.currentTime:0; tone(90,55,0.8,'sawtooth',0.2,t,400); noise(0.8,300,0.2,t,'lowpass'); },
  slam(){ tone(70,40,0.4,'square',0.24,0,240); noise(0.4,200,0.3,0,'lowpass'); },
  arrow(){ noise(0.12,1800,0.1,0,'bandpass',600); },
  wisp(){ noise(0.3,2400,0.14,0,'bandpass',400); tone(700,220,0.25,'sine',0.1); },
  emberTick(){ tone(900+RND()*500,1400,0.05,'sine',0.06); },
  fanfare(){ const t=AC?AC.currentTime:0; [523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,f,0.3,'triangle',0.11,t+i*0.11)); noise(1.4,4000,0.04,t,'highpass'); },
  revive(){ const t=AC?AC.currentTime:0; [262,330,392,523,659].forEach((f,i)=>tone(f,f,0.4,'sine',0.1,t+i*0.08)); },
  bossDie(){ const t=AC?AC.currentTime:0; noise(1.2,500,0.28,t,'lowpass',60); tone(120,30,1.2,'sawtooth',0.18,t,500); [784,1046,1318].forEach((f,i)=>tone(f,f,0.5,'sine',0.09,t+0.5+i*0.14)); },
};
/* generative music: slow embers-and-stone loop */
const MUS={next:0, beat:0, bpm:74, chords:[[45,52,57,60],[41,48,53,57],[43,50,55,59],[40,47,52,55]], ci:0};
function musicTick(boss){
  if(!AC||SAVE.mute) return;
  const bt=60/MUS.bpm;
  if(MUS.next<AC.currentTime-1) MUS.next=AC.currentTime+0.05;
  while(MUS.next<AC.currentTime+0.35){
    const t=MUS.next, b=MUS.beat, ch=MUS.chords[MUS.ci];
    if(b%8===0){ MUS.ci=(MUS.ci+((b%32===0)?1:0))%MUS.chords.length; }
    try{
      if(b%4===0){ // deep root
        const o=AC.createOscillator(),g=AC.createGain(); o.type='sine';
        o.frequency.value=mid2f(ch[0]-12);
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(boss?0.16:0.11,t+0.08);
        g.gain.exponentialRampToValueAtTime(0.0001,t+bt*3.6);
        o.connect(g); g.connect(MGAIN); o.start(t); o.stop(t+bt*3.8);
      }
      if(b%8===2||b%8===5){ // pad tone
        const n=ch[1+(b>>3)%3];
        const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
        o.type='triangle'; o.frequency.value=mid2f(n); f.type='lowpass'; f.frequency.value=700;
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.05,t+0.3);
        g.gain.exponentialRampToValueAtTime(0.0001,t+bt*2.6);
        o.connect(f); f.connect(g); g.connect(MGAIN); o.start(t); o.stop(t+bt*2.8);
      }
      if(RND()<(boss?0.34:0.16) && b%2===1){ // sparse pluck, pentatonic over chord
        const sc=[0,3,5,7,10], n=ch[0]+24+sc[(RND()*sc.length)|0];
        const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
        o.type='triangle'; o.frequency.value=mid2f(n); f.type='lowpass'; f.frequency.value=1600;
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.055,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
        o.connect(f); f.connect(g); g.connect(MGAIN); o.start(t); o.stop(t+1.2);
      }
      if(boss && b%2===0){ // boss pulse
        const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
        o.type='square'; o.frequency.value=mid2f(ch[0]); f.type='lowpass'; f.frequency.value=300;
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.07,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+bt*0.8);
        o.connect(f); f.connect(g); g.connect(MGAIN); o.start(t); o.stop(t+bt);
      }
    }catch(e){}
    MUS.next+=bt; MUS.beat++;
  }
}
/* ------------------------------ canvas/view ------------------------------ */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const saDiv=document.getElementById('sa'), arcLink=document.getElementById('arc');
let vw=390, vh=844, dpr=2, TILE=30;
const SAFE={l:0,t:0,r:0,b:0};
let LC=null, lctx=null; // lighting layer
function resize(){
  vw=Math.max(200,window.innerWidth); vh=Math.max(200,window.innerHeight);
  dpr=clamp(window.devicePixelRatio||1,1,CFG.DPR_CAP);
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  cv.style.width=vw+'px'; cv.style.height=vh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  try{
    const r=saDiv.getBoundingClientRect();
    SAFE.l=Math.max(0,r.left); SAFE.t=Math.max(0,r.top);
    SAFE.r=Math.max(0,vw-r.right); SAFE.b=Math.max(0,vh-r.bottom);
  }catch(e){}
  TILE=clamp(Math.floor(Math.min(vw,vh)/13),CFG.TILE_MIN,CFG.TILE_MAX);
  LC=document.createElement('canvas');
  LC.width=Math.max(8,Math.round(vw*CFG.LIGHT_SCALE));
  LC.height=Math.max(8,Math.round(vh*CFG.LIGHT_SCALE));
  lctx=LC.getContext('2d');
  buildSprites();
  if(F) buildTileSheet();
}
/* --------------------------- prerendered sprites ------------------------- */
const SPR={};
function radial(size,stops){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const x=c.getContext('2d'), g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const s of stops) g.addColorStop(s[0],s[1]);
  x.fillStyle=g; x.fillRect(0,0,size,size); return c;
}
function buildSprites(){
  SPR.hole=radial(256,[[0,'rgba(255,255,255,1)'],[0.42,'rgba(255,255,255,.92)'],[0.72,'rgba(255,255,255,.42)'],[1,'rgba(255,255,255,0)']]);
  SPR.warm={};
  for(const k in TINTS){
    const c=TINTS[k];
    SPR.warm[k]=radial(128,[[0,c.c+'cc'],[0.5,c.c2+'55'],[1,'rgba(0,0,0,0)']]);
  }
  SPR.warm.cyan=radial(128,[[0,'rgba(143,232,255,.8)'],[0.5,'rgba(80,140,255,.28)'],[1,'rgba(0,0,0,0)']]);
  SPR.warm.gold=radial(128,[[0,'rgba(255,220,110,.85)'],[0.5,'rgba(255,170,60,.3)'],[1,'rgba(0,0,0,0)']]);
  SPR.warm.red=radial(128,[[0,'rgba(255,110,80,.85)'],[0.5,'rgba(255,60,40,.3)'],[1,'rgba(0,0,0,0)']]);
  SPR.mote=radial(24,[[0,'rgba(255,200,120,.9)'],[0.4,'rgba(255,150,70,.45)'],[1,'rgba(0,0,0,0)']]);
  SPR.eye=radial(20,[[0,'rgba(255,190,90,1)'],[0.4,'rgba(255,120,40,.7)'],[1,'rgba(0,0,0,0)']]);
  SPR.eyeC=radial(20,[[0,'rgba(160,240,255,1)'],[0.4,'rgba(60,160,255,.7)'],[1,'rgba(0,0,0,0)']]);
  // vignette
  const c=document.createElement('canvas'); c.width=320; c.height=320;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(160,160,80,160,160,225);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(2,3,8,.62)');
  x.fillStyle=g; x.fillRect(0,0,320,320); SPR.vig=c;
}
/* tile sheet: rebuilt per floor + resize */
let TSHEET=null, TS=0;
function hashXY(x,y){ let h=(x*374761393+y*668265263)|0; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0); }
function buildTileSheet(){
  const z=ZONES[F.zone];
  TS=Math.max(8,Math.round(TILE*dpr));
  const n=10; // 6 floor variants, wall, wall-lit, hatch-void, lava
  TSHEET=document.createElement('canvas'); TSHEET.width=TS*n; TSHEET.height=TS;
  const x=TSHEET.getContext('2d'), rr=mulberry(F.seed^0xBEEF);
  for(let v=0;v<6;v++){
    const ox=v*TS;
    x.fillStyle=(v%3===2)?z.floorB:z.floor; x.fillRect(ox,0,TS,TS);
    x.strokeStyle='rgba(0,0,0,.38)'; x.lineWidth=Math.max(1,TS*0.05);
    x.strokeRect(ox+0.5,0.5,TS-1,TS-1);
    x.fillStyle='rgba(255,255,255,.045)'; x.fillRect(ox+TS*0.06,TS*0.06,TS*0.88,TS*0.1);
    const nCr=1+(v%3);
    x.strokeStyle='rgba(0,0,0,.3)'; x.lineWidth=Math.max(1,TS*0.03);
    for(let i=0;i<nCr;i++){
      let cx0=ox+rr()*TS*0.8+TS*0.1, cy0=rr()*TS*0.8+TS*0.1;
      x.beginPath(); x.moveTo(cx0,cy0);
      for(let k=0;k<3;k++){ cx0+=(rr()-0.5)*TS*0.36; cy0+=(rr()-0.5)*TS*0.36; x.lineTo(cx0,cy0); }
      x.stroke();
    }
    if(v===4){ x.fillStyle=z.grime; x.beginPath(); x.arc(ox+TS*0.6,TS*0.6,TS*0.3,0,TAU); x.fill(); }
    if(v===5){ x.fillStyle='rgba(0,0,0,.22)'; x.beginPath(); x.arc(ox+TS*0.35,TS*0.4,TS*0.26,0,TAU); x.fill(); }
  }
  // 6: wall  7: wall with lit south face
  for(let w=0;w<2;w++){
    const ox=(6+w)*TS;
    x.fillStyle=z.wall; x.fillRect(ox,0,TS,TS);
    x.fillStyle='rgba(255,255,255,.05)'; x.fillRect(ox,0,TS,TS*0.14);
    x.strokeStyle='rgba(0,0,0,.5)'; x.lineWidth=Math.max(1,TS*0.045);
    x.beginPath();
    x.moveTo(ox,TS*0.5); x.lineTo(ox+TS,TS*0.5);
    x.moveTo(ox+TS*0.5,0); x.lineTo(ox+TS*0.5,TS*0.5);
    x.moveTo(ox+TS*0.25,TS*0.5); x.lineTo(ox+TS*0.25,TS);
    x.moveTo(ox+TS*0.75,TS*0.5); x.lineTo(ox+TS*0.75,TS);
    x.stroke();

/* ------------------------------ dungeon gen ------------------------------ */
const T_VOID=0,T_FLOOR=1,T_WALL=2,T_LAVA=3;
function zoneFor(fl){ if(fl<=4)return 0; if(fl<=8)return 1; if(fl<=12)return 2; return ((fl-13)/4|0)%3; }
function zoneName(fl){
  if(fl>12) return 'THE ENDLESS EMBER';
  if(fl===12) return 'THE KILNHEART';
  if(fl%4===0) return fl===4?"THE WARDEN'S GATE":'THE SECOND GATE';
  return ZONES[zoneFor(fl)].name;
}
const isWardenFloor=fl=>fl%4===0&&fl!==12, isKilnFloor=fl=>fl===12;
function newFloor(fl){
  const seed=(Date.now()^(fl*2654435761))>>>0;
  grnd=mulberry(seed);
  F={seed, floor:fl, zone:zoneFor(fl), rooms:[], links:[], tiles:null, w:0, h:0,
    torches:[], decals:[], props:[], enemies:[], projs:[], picks:[], rings:[], pools:[],
    block:{}, boss:null, bossName:'', arenaRoom:null, darkA:Math.min(0.93,ZONES[zoneFor(fl)].darkA+0.006*Math.min(fl,14))};
  if(isWardenFloor(fl)||isKilnFloor(fl)) genBossFloor(fl);
  else genNormalFloor(fl);
  buildTileSheet();
  return F;
}
function tileAt(tx,ty){ if(tx<0||ty<0||tx>=F.w||ty>=F.h) return T_VOID; return F.tiles[ty*F.w+tx]; }
function setTile(tx,ty,v){ if(tx>=0&&ty>=0&&tx<F.w&&ty<F.h) F.tiles[ty*F.w+tx]=v; }
function solidAt(tx,ty){
  const t=tileAt(tx,ty);
  if(t===T_WALL||t===T_VOID) return true;
  return !!F.block[tx+','+ty];
}
function genNormalFloor(fl){
  const G=CFG.GRID, SX=CFG.STRIDE_X, SY=CFG.STRIDE_Y;
  let ok=false, tries=0;
  while(!ok&&tries<40){
    tries++;
    F.rooms.length=0; F.links.length=0;
    const n=6+gi(4); // 6-9
    const cellMap={};
    const start={gx:1+gi(2),gy:1+gi(2)};
    const rooms=[{gx:start.gx,gy:start.gy}];
    cellMap[start.gx+','+start.gy]=0;
    let guard=0;
    while(rooms.length<n&&guard++<400){
      const base=rooms[gi(rooms.length)];
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]], d=dirs[gi(4)];
      const gx=base.gx+d[0], gy=base.gy+d[1];
      if(gx<0||gy<0||gx>=G||gy>=G) continue;
      if(cellMap[gx+','+gy]!==undefined) continue;
      cellMap[gx+','+gy]=rooms.length;
      F.links.push([cellMap[base.gx+','+base.gy],rooms.length]);
      rooms.push({gx,gy});
    }
    if(rooms.length<6) continue;
    // occasional loop links
    for(let i=0;i<rooms.length;i++) for(let j=i+1;j<rooms.length;j++){
      const a=rooms[i],b=rooms[j];
      if(Math.abs(a.gx-b.gx)+Math.abs(a.gy-b.gy)===1 && grnd()<0.22
        && !F.links.some(l=>(l[0]===i&&l[1]===j)||(l[0]===j&&l[1]===i)))
        F.links.push([i,j]);
    }
    for(const rm of rooms){
      F.rooms.push({gx:rm.gx,gy:rm.gy, rx:rm.gx*SX+1, ry:rm.gy*SY+1, rw:CFG.ROOM_W, rh:CFG.ROOM_H,
        type:'combat', cleared:false, explored:false, gated:false, doors:[], spawnT:0});
    }
    carveTiles();
    if(verifyReach(0)) ok=true;
  }
  if(!ok){ // bulletproof fallback: straight line of 6 rooms
    F.rooms.length=0; F.links.length=0;
    for(let i=0;i<6;i++){
      F.rooms.push({gx:i%4,gy:(i/4)|0, rx:(i%4)*SX+1, ry:((i/4)|0)*SY+1, rw:CFG.ROOM_W, rh:CFG.ROOM_H,
        type:'combat', cleared:false, explored:false, gated:false, doors:[], spawnT:0});
      if(i>0) F.links.push([i-1,i]);
    }
    carveTiles();
  }
  // assign types by BFS distance from room 0
  const dist=roomDists(0);
  let far=0; for(let i=1;i<F.rooms.length;i++) if(dist[i]>dist[far]) far=i;
  F.rooms[0].type='start'; F.rooms[0].cleared=true;
  F.rooms[far].type='exit'; F.rooms[far].cleared=true;
  const mids=[]; for(let i=0;i<F.rooms.length;i++) if(i!==0&&i!==far) mids.push(i);
  // shuffle
  for(let i=mids.length-1;i>0;i--){ const j=gi(i+1); const t=mids[i]; mids[i]=mids[j]; mids[j]=t; }
  if(mids.length){ F.rooms[mids.pop()].type='shrine'; }
  if(mids.length){ F.rooms[mids.pop()].type='treasure'; }
  if(mids.length&&grnd()<0.4){ const i=mids.pop(); F.rooms[i].type='shop'; F.rooms[i].cleared=true; }
  furnish(fl);
}
function carveTiles(){
  const SX=CFG.STRIDE_X, SY=CFG.STRIDE_Y;
  F.w=CFG.GRID*SX+2; F.h=CFG.GRID*SY+2;
  F.tiles=new Uint8Array(F.w*F.h);
  for(const r of F.rooms)
    for(let y=r.ry;y<r.ry+r.rh;y++) for(let x=r.rx;x<r.rx+r.rw;x++) setTile(x,y,T_FLOOR);
  for(const l of F.links){
    const a=F.rooms[l[0]], b=F.rooms[l[1]];
    if(a.gy===b.gy){
      const L=a.gx<b.gx?a:b, Rm=a.gx<b.gx?b:a;
      const cy=L.ry+((L.rh/2)|0);
      for(let x=L.rx+L.rw;x<Rm.rx;x++) for(let y=cy-1;y<=cy+1;y++) setTile(x,y,T_FLOOR);
      addDoor(L,L.rx+L.rw,cy,1,0); addDoor(Rm,Rm.rx-1,cy,-1,0);
    } else {
      const Tp=a.gy<b.gy?a:b, Bt=a.gy<b.gy?b:a;
      const cx=Tp.rx+((Tp.rw/2)|0);
      for(let y=Tp.ry+Tp.rh;y<Bt.ry;y++) for(let x=cx-1;x<=cx+1;x++) setTile(x,y,T_FLOOR);
      addDoor(Tp,cx,Tp.ry+Tp.rh,0,1); addDoor(Bt,cx,Bt.ry-1,0,-1);
    }
  }
  wallify();
}
function addDoor(room,x,y,dx,dy){
  room.doors.push({x,y,dx,dy,tiles:dx!==0?[[x,y-1],[x,y],[x,y+1]]:[[x-1,y],[x,y],[x+1,y]],open:1});
}
function wallify(){
  for(let y=0;y<F.h;y++) for(let x=0;x<F.w;x++){
    if(tileAt(x,y)!==T_VOID) continue;
    let adj=false;
    for(let dy=-1;dy<=1&&!adj;dy++) for(let dx=-1;dx<=1;dx++){
      const t=tileAt(x+dx,y+dy);
      if(t===T_FLOOR||t===T_LAVA){ adj=true; break; }
    }
    if(adj) setTile(x,y,T_WALL);
  }
}
function roomDists(src){
  const dist=F.rooms.map(()=>999); dist[src]=0;
  const q=[src];
  while(q.length){ const i=q.shift();
    for(const l of F.links){ const o=l[0]===i?l[1]:(l[1]===i?l[0]:-1);
      if(o>=0&&dist[o]>dist[i]+1){ dist[o]=dist[i]+1; q.push(o); } } }
  return dist;
}
function verifyReach(src){
  // flood fill floor tiles from room[src] center; every room center must be visited
  const r0=F.rooms[src], sx=r0.rx+((r0.rw/2)|0), sy=r0.ry+((r0.rh/2)|0);
  if(tileAt(sx,sy)!==T_FLOOR) return false;
  const seen=new Uint8Array(F.w*F.h), q=[sy*F.w+sx]; seen[q[0]]=1;
  while(q.length){
    const i=q.pop(), x=i%F.w, y=(i/F.w)|0;
    const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(const [nx,ny] of nb){
      if(nx<0||ny<0||nx>=F.w||ny>=F.h) continue;
      const j=ny*F.w+nx;
      if(!seen[j]&&F.tiles[j]===T_FLOOR){ seen[j]=1; q.push(j); }
    }
  }
  for(const r of F.rooms){
    const cx=r.rx+((r.rw/2)|0), cy=r.ry+((r.rh/2)|0);
    if(!seen[cy*F.w+cx]) return false;
  }
  return true;
}
function genBossFloor(fl){
  // vertical chain: entry (11x7) -> arena (17x11) -> bonfire (9x5, hatch)
  const kiln=isKilnFloor(fl);
  const aw=kiln?19:17, ah=kiln?13:11;
  F.w=aw+6; F.h=7+ah+5+14;
  F.tiles=new Uint8Array(F.w*F.h);
  const cx=(F.w/2)|0;
  const bon={rx:cx-4, ry:2, rw:9, rh:5, type:'bonfire', cleared:true, explored:false, gated:false, doors:[], spawnT:0};
  const are={rx:cx-((aw/2)|0), ry:bon.ry+bon.rh+3, rw:aw, rh:ah, type:'arena', cleared:false, explored:false, gated:false, doors:[], spawnT:0};
  const ent={rx:cx-5, ry:are.ry+are.rh+3, rw:11, rh:7, type:'start', cleared:true, explored:false, gated:false, doors:[], spawnT:0};
  F.rooms.push(ent,are,bon); F.links.push([0,1],[1,2]);
  for(const r of F.rooms)
    for(let y=r.ry;y<r.ry+r.rh;y++) for(let x=r.rx;x<r.rx+r.rw;x++) setTile(x,y,T_FLOOR);
  // corridors
  for(let y=are.ry+are.rh;y<ent.ry;y++) for(let x=cx-1;x<=cx+1;x++) setTile(x,y,T_FLOOR);
  for(let y=bon.ry+bon.rh;y<are.ry;y++) for(let x=cx-1;x<=cx+1;x++) setTile(x,y,T_FLOOR);
  addDoor(are,cx,are.ry+are.rh,0,1); addDoor(are,cx,are.ry-1,0,-1);
  wallify();
  F.arenaRoom=are;
  // props
  const bx=bon.rx+((bon.rw/2)|0), by=bon.ry+2;
  if(!kiln) F.props.push({kind:'bonfire', x:bx+0.5, y:by+0.5, used:false});
  F.props.push({kind:'hatch', x:bx+0.5, y:(kiln?by:by)+0.5+(kiln?0:1.4), hidden:kiln});
  torchesForRoom(ent,fl); torchesForRoom(are,fl); torchesForRoom(bon,fl);
  decalsForRoom(ent); decalsForRoom(are);
  F.bossName=kiln?'THE KILNHEART':(fl===4?'WARDEN OF THE FIRST GATE':(fl===8?'WARDEN OF CINDERS':'WARDEN OF THE DEEP'));
}
function furnish(fl){
  for(const r of F.rooms){ torchesForRoom(r,fl); decalsForRoom(r); }
  let goldChestDone=false;
  for(let i=0;i<F.rooms.length;i++){
    const r=F.rooms[i], cx=r.rx+r.rw/2, cy=r.ry+r.rh/2;
    if(r.type==='exit') F.props.push({kind:'hatch', x:cx, y:cy, hidden:false});
    if(r.type==='shrine') F.props.push({kind:'shrine', x:cx, y:cy, used:false});
    if(r.type==='treasure') F.props.push({kind:'chest', x:cx, y:cy, open:false});
    if(r.type==='shop'){
      F.props.push({kind:'peddler', x:cx, y:r.ry+1.2});
      const items=[
        {it:'heal', name:'WARM LOAF', desc:'restore 2 hearts', cost:14+5*fl},
        {it:'relic', name:'CURIO', desc:'a random relic', cost:38+10*fl},
        {it:'key', name:'IRON KEY', desc:'opens gold chests', cost:16+6*fl},
      ];
      for(let k=0;k<3;k++) F.props.push({kind:'ware', x:r.rx+2.2+k*((r.rw-4.4)/2), y:cy+0.6, item:items[k], sold:false});
    }
    if(r.type==='combat'&&!goldChestDone&&grnd()<0.55){
      goldChestDone=true;
      F.props.push({kind:'goldchest', x:r.rx+1.6, y:r.ry+1.4, open:false});
    }
  }
}
function torchesForRoom(r,fl){
  const n=2+gi(2);
  for(let i=0;i<n;i++){
    const x=r.rx+1+((r.rw-2)*(i+0.5)/n)|0;
    F.torches.push({x:x+0.5, y:r.ry-0.18, ph:grnd()*TAU});

  if(r.rh>8){ F.torches.push({x:r.rx+0.2,y:r.ry+r.rh/2,ph:grnd()*TAU},{x:r.rx+r.rw-0.2,y:r.ry+r.rh/2,ph:grnd()*TAU}); }
}
function decalsForRoom(r){

    F.decals.push({x:r.rx+0.5+grnd()*(r.rw-1), y:r.ry+0.5+grnd()*(r.rh-1), t:gi(4), a:grnd()*TAU});

function roomAt(x,y){

  {id:'_heal', name:'Warm Meal',     desc:'restore 2 hearts',               r:0},
  {id:'_ember',name:'Loose Embers',  desc:'+10 embers for the Forge',       r:1},
];
const RAR_W=[5,2.6,1.2], RAR_COL=[AMBER,CYAN,VIOLET], RAR_NAME=['COMMON','RARE','EPIC'];
const relicById=id=>RELICS.find(r=>r.id===id)||FALLBACK_RELICS.find(r=>r.id===id);
function pickRelicChoices(){
  const pool=RELICS.filter(r=>!R.relics.includes(r.id));
  const out=[];
  while(out.length<3&&pool.length){
    const c=pickW(pool,r=>RAR_W[r.r]);
    pool.splice(pool.indexOf(c),1); out.push(c);
  }
  let fi=0;
  while(out.length<3) out.push(FALLBACK_RELICS[fi++%3]);
  return out;
}
function applyRelic(id){
  const rl=relicById(id); if(!rl) return;
  if(id==='_gold'){ R.gold+=45; }
  else if(id==='_heal'){ P.hearts=Math.min(P.maxH,P.hearts+4); }
  else if(id==='_ember'){ R.emberKills+=10; }
  else{
    R.relics.push(id);
    if(id==='stone'){ P.maxH+=2; P.hearts+=2; }
    if(id==='eye') revealAll();
  }
  recomputeStats();
  SND.relic(); haptic('success');
  burst(P.x,P.y,26,RAR_COL[rl.r],3,{add:true,size:0.11,durM:1.6});
  ringFx(P.x,P.y,5,0.5,RAR_COL[rl.r]);
  S.banner={t1:rl.name.toUpperCase(), t2:rl.desc, col:RAR_COL[rl.r]}; S.bannerT=1.7;
}
function revealAll(){ if(F) for(const r of F.rooms) r.explored=true; }
function recomputeStats(){
  const W=WEAPONS[R.weapon], has=id=>R.relics.includes(id), st=R.stats;
  st.dmg=W.dmg*(1+0.05*forgeRank('dmg'))*(has('fang')?1.2:1);
  st.spdM=(1+0.05*forgeRank('spd'))*(has('boots')?1.15:1);
  st.reach=CFG.ATK_RANGE*W.rangeM*(has('arm')?1.3:1);
  st.arc=CFG.ATK_ARC*W.arcM;
  st.timeM=W.timeM;
  st.rollCd=Math.max(0.28,CFG.ROLL_CD-0.1*forgeRank('roll'));
  st.goldM=1+0.1*forgeRank('gold');
  st.magnet=has('magnet')?2.9:0.85;
}

function forgeBuy(node){
  const rk=forgeRank(node.id);
  if(rk>=node.ranks) return false;
  const c=node.cost[rk];
  if(SAVE.embers<c){ SND.deny(); return false; }
  SAVE.embers-=c; SAVE.forge[node.id]=rk+1; persist();
  SND.buy(); haptic('success');
  return true;
}

  rat:   {hp:14, spd:3.0, r:.27, gold:2,  name:'a gutter rat'},
  skel:  {hp:30, spd:1.55,r:.33, gold:4,  name:'a rattlebones'},

  kiln:  {hp:650,spd:1.05,r:.70, gold:80, name:'the Kilnheart'},

const hpScale=fl=>Math.pow(1.35,Math.min(fl-1,4))*Math.pow(1.12,Math.max(0,fl-5));
const dmgHalvesFor=(kind)=>{
  let d=1+(F.floor>=6?1:0)+(F.floor>=10?1:0);
  if(kind==='warden'||kind==='kiln') d+=1;
  return Math.min(4,d);
};
function spawnEnemy(kind,x,y,room,instant){
  const k=EK[kind], sc=hpScale(F.floor);
  const e={kind,x,y,vx:0,vy:0,r:k.r,hp:Math.round(k.hp*sc),maxhp:Math.round(k.hp*sc),
    spd:k.spd*(1+0.018*F.floor), st:instant?'chase':'spawn', t:instant?0:0.55,
    flash:0,squash:0,room,cd:0.6+RND()*1.2,hitCd:0,dead:false,ph:RND()*TAU,
    strafe:RND()<0.5?1:-1,dmg:dmgHalvesFor(kind),lx:0,ly:0,phase:1,isAdd:false,
    bashCd:2,slamCd:3.5,addCd:6,windT:0};
  F.enemies.push(e); return e;
}
function spawnRoomEnemies(r){
  const fl=F.floor, mix=[{k:'rat',w:3},{k:'skel',w:2}];
  if(fl>=2) mix.push({k:'slime',w:1.4});
  if(fl>=3) mix.push({k:'arch',w:1.7});
  if(fl>=5) mix.push({k:'wisp',w:1.5});
  const n=Math.min(8,3+((fl/2)|0)+gi(2));
  r.alive=0; r.spawned=true; r.spawnT=0.55;
  for(let i=0;i<n;i++){
    let x,y,tr=0;
    do{ x=r.rx+0.8+RND()*(r.rw-1.6); y=r.ry+0.8+RND()*(r.rh-1.6); tr++; }
    while(hyp(x-P.x,y-P.y)<2.2&&tr<20);
    const kind=pickW(mix,m=>m.w).k;
    spawnEnemy(kind,x,y,r); r.alive++;
  }
}
function spawnBoss(r){
  const kiln=isKilnFloor(F.floor);
  const e=spawnEnemy(kiln?'kiln':'warden', r.rx+r.rw/2, r.ry+2.6, r, true);
  e.st='intro'; e.t=1.5; e.variant=F.floor===8?1:(F.floor>12?((F.floor/4)|0)%2:0);
  F.boss=e; r.alive=1;
  S.banner={t1:F.bossName, t2:kiln?'quench it, or feed it':'it remembers every trespasser', col:RED};
  S.bannerT=2.2; SND.roar(); haptic('heavy'); addShake(6);
}
/* ------------------------------- movement -------------------------------- */
function circleHitsWall(x,y,r){
  const x0=Math.floor(x-r),x1=Math.floor(x+r),y0=Math.floor(y-r),y1=Math.floor(y+r);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(!solidAt(tx,ty)) continue;
    const cx=clamp(x,tx,tx+1), cy=clamp(y,ty,ty+1);
    if((x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r) return true;
  }
  return false;
}
function tryMove(o,dt,noWall){
  const nx=o.x+o.vx*dt, ny=o.y+o.vy*dt;
  if(noWall){ o.x=nx; o.y=ny; return; }
  if(!circleHitsWall(nx,o.y,o.r||CFG.P_R)) o.x=nx; else o.vx*=-0.1;
  if(!circleHitsWall(o.x,ny,o.r||CFG.P_R)) o.y=ny; else o.vy*=-0.1;
}

    if(R.relics.includes('thorn')&&!e.dead&&e.hitCd!==undefined)
      dmgEnemy(e,R.stats.dmg*0.8,Math.atan2(e.y-P.y,e.x-P.x),2,false); }

/* --------------------------------- combat -------------------------------- */
function aimDir(mouse){
  if(mouse&&!IN.hasTouch){
    const wx=(IN.mx-vw/2)/TILE+CAM.x, wy=(IN.my-vh/2)/TILE+CAM.y;
    return Math.atan2(wy-P.y,wx-P.x);
  }
  let best=null,bd=CFG.AIM_ASSIST;
  for(const e of F.enemies){ if(e.dead||e.st==='spawn') continue;
    const d=hyp(e.x-P.x,e.y-P.y); if(d<bd){bd=d;best=e;} }
  if(best) return Math.atan2(best.y-P.y,best.x-P.x);
  return P.face;
}
function pressAttack(mouse){
  if(S.mode!=='game'||S.overlay||!P||P.dead||!R) return;
  if(tryBuy()) return;
  if(P.roll.t>0) return;
  const a=P.atk;
  if(a.t>0){ a.buf=true; return; }
  startSwing(a.step,mouse);
}
function startSwing(step,mouse){
  const a=P.atk;
  a.step=step; a.dur=CFG.SWING_T[step]*R.stats.timeM; a.t=a.dur;
  a.dir=aimDir(mouse); a.hit.length=0; a.buf=false; a.wave=false;
  P.face=a.dir;
  P.vx+=Math.cos(a.dir)*2.6; P.vy+=Math.sin(a.dir)*2.6;
  SND.swing(step);
}
function pressRoll(){
  if(S.mode!=='game'||S.overlay||!P||P.dead||!R) return;
  if(P.roll.cd>0||P.roll.t>0) return;
  let dx=Math.cos(P.face),dy=Math.sin(P.face);
  if(IN.stick.mag>0.15){ const d=hyp(IN.stick.dx,IN.stick.dy)||1; dx=IN.stick.dx/d; dy=IN.stick.dy/d; }
  else{ const k=IN.keys; let kx=0,ky=0;
    if(k.KeyW||k.ArrowUp)ky-=1; if(k.KeyS||k.ArrowDown)ky+=1;
    if(k.KeyA||k.ArrowLeft)kx-=1; if(k.KeyD||k.ArrowRight)kx+=1;
    if(kx||ky){ const l=hyp(kx,ky); dx=kx/l; dy=ky/l; } }
  P.roll.t=CFG.ROLL_T; P.roll.cd=R.stats.rollCd+CFG.ROLL_T;
  P.roll.dx=dx; P.roll.dy=dy; P.atk.t=0; P.face=Math.atan2(dy,dx);
  SND.roll(); haptic('light');
  burst(P.x,P.y,8,'#8a93ab',1.6,{size:0.08,durM:0.8});
}
function dmgEnemy(e,dmg,ang,kb,big){
  if(e.dead) return;
  dmg=Math.max(1,Math.round(dmg*(0.92+RND()*0.16)));
  e.hp-=dmg; e.flash=0.1; e.squash=0.3;
  const boss=e.kind==='warden'||e.kind==='kiln', kbm=boss?0.12:1;
  e.vx+=Math.cos(ang)*kb*kbm; e.vy+=Math.sin(ang)*kb*kbm;
  floatTxt(e.x+(RND()-0.5)*0.3,e.y-0.55,''+dmg,big?'#ffd9a0':'#ffeeda',big?17:13);
  burst(e.x,e.y,big?10:5,AMBER,big?3.4:2.2,{add:true,size:0.08});
  SND.hit(big); haptic('light');
  if(big){ hitstop(0.045); addShake(3.2); }
  if(e.hp<=0) killEnemy(e,ang);
}
function killEnemy(e,ang){
  if(e.dead) return;
  e.dead=true; R.kills++;
  burst(e.x,e.y,16,'#2b3348',3,{size:0.12,durM:1.2});
  burst(e.x,e.y,10,AMBER,3.4,{add:true});
  SND.kill(); hitstop(0.03);
  const k=EK[e.kind];
  dropGold(e.x,e.y,Math.max(1,Math.round(k.gold*(0.7+RND()*0.6)*R.stats.goldM)));
  if(RND()<(P.hearts<P.maxH*0.5?0.13:0.06)) F.picks.push(mkPick('pip',e.x,e.y));
  if(!F.keyDropped&&RND()<0.05&&e.kind!=='slimelet'){ F.keyDropped=true; F.picks.push(mkPick('key',e.x,e.y)); }
  if(R.relics.includes('emberheart')){ R.emberKills++; floatTxt(e.x,e.y-0.9,'+1 ember',AMBER,11); }
  R.sinceVamp++;
  if(R.relics.includes('bead')&&R.sinceVamp>=8){ R.sinceVamp=0;
    P.hearts=Math.min(P.maxH,P.hearts+1); floatTxt(P.x,P.y-0.8,'+',GREEN,16); SND.pip(); }
  if(e.kind==='slime'&&e.room){
    e.room.alive+=2;
    for(let i=0;i<2;i++) spawnEnemy('slimelet',e.x+(RND()-0.5)*0.6,e.y+(RND()-0.5)*0.6,e.room,true);
  }
  if(e.room) e.room.alive--;
  if(e.kind==='warden') wardenDown(e);
  else if(e.kind==='kiln') kilnDown(e);
}
function wardenDown(e){

/* ------------------------------ room control ----------------------------- */
function gateRoom(r){
  r.gated=true; SND.gate(); haptic('soft'); addShake(3);
  for(const d of r.doors){ d.open=1; d.target=0;
    for(const t of d.tiles){ F.block[t[0]+','+t[1]]=true;
      burst(t[0]+0.5,t[1]+0.5,4,'#6a7590',1.4,{size:0.07}); } }
  if(r.type==='arena') spawnBoss(r); else spawnRoomEnemies(r);
}
function clearRoom(r){
  if(r.cleared) return;
  r.cleared=true; r.gated=false;
  SND.gateOpen(); haptic('success');
  for(const d of r.doors){ d.target=1;
    for(const t of d.tiles) delete F.block[t[0]+','+t[1]]; }
  if(r.type==='combat'){
    const cx=r.rx+r.rw/2, cy=r.ry+r.rh/2;
    dropGold(cx,cy,4+F.floor);
    if(RND()<(F.floor<=3?0.6:0.35)) F.picks.push(mkPick('pip',cx+0.6,cy));
    S.banner={t1:'ROOM CLEAR',t2:'',col:BONE}; S.bannerT=0.9;
  }
}
function updateRooms(dt){
  const r=roomAt(P.x,P.y);
  if(r&&!r.explored){ r.explored=true; SND.ui(); }
  if(r&&(r.type==='combat'||r.type==='arena')&&!r.cleared&&!r.gated){
    if(P.x>r.rx+0.7&&P.x<r.rx+r.rw-0.7&&P.y>r.ry+0.7&&P.y<r.ry+r.rh-0.7) gateRoom(r);
  }
  for(const rm of F.rooms){
    for(const d of rm.doors){
      const tg=d.target===undefined?1:d.target;
      d.open=lerp(d.open,tg,1-Math.pow(0.001,dt));
    }
    if(rm.gated&&rm.spawned&&rm.type!=='arena'&&rm.alive<=0) clearRoom(rm);
  }
}
/* -------------------------------- pickups -------------------------------- */
function mkPick(kind,x,y,id){
  const a=RND()*TAU,v=1.5+RND()*2;
  return {kind,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,v:1,id:id||null,ph:RND()*TAU};
}
function dropGold(x,y,total){
  const n=Math.min(9,Math.max(1,Math.round(total/2))), per=Math.max(1,Math.round(total/n));
  for(let i=0;i<n;i++){ const p=mkPick('gold',x,y); p.v=per; F.picks.push(p); }
}
let coinSndCd=0;
function updatePicks(dt){
  coinSndCd-=dt;
  for(let i=F.picks.length-1;i>=0;i--){
    const p=F.picks[i]; p.t+=dt;
    p.vx*=Math.pow(0.02,dt); p.vy*=Math.pow(0.02,dt);
    const d=hyp(P.x-p.x,P.y-p.y);
    const mr=p.kind==='gold'?R.stats.magnet:1.1;
    if(d<mr&&p.t>0.25&&!P.dead){ const pull=(1-d/mr)*26;
      p.vx+=(P.x-p.x)/d*pull*dt*10; p.vy+=(P.y-p.y)/d*pull*dt*10; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(circleHitsWall(p.x,p.y,0.12)){ p.x-=p.vx*dt; p.y-=p.vy*dt; p.vx*=-0.4; p.vy*=-0.4; }
    if(d<0.5&&p.t>0.18&&!P.dead){
      if(p.kind==='gold'){ R.gold+=p.v;
        if(coinSndCd<=0){ SND.coin(); coinSndCd=0.07; floatTxt(P.x,P.y-0.7,'+'+p.v,GOLD,12); }
        burst(p.x,p.y,3,GOLD,1.6,{add:true,size:0.06,durM:0.6}); }
      else if(p.kind==='pip'){
        if(P.hearts<P.maxH){ P.hearts=Math.min(P.maxH,P.hearts+1); floatTxt(P.x,P.y-0.8,'+ half heart','#ff8a9a',12); }
        else floatTxt(P.x,P.y-0.8,'already whole','#8a93ab',11);
        SND.pip(); haptic('light'); }
      else if(p.kind==='key'){ R.keys++; SND.key(); haptic('light'); floatTxt(P.x,P.y-0.8,'+ key',GOLD,13); }
      else if(p.kind==='tint'){
        if(!SAVE.tints.includes(p.id)) SAVE.tints.push(p.id);
        SAVE.tint=p.id; persist(); SND.relic(); haptic('success');
        S.banner={t1:'TORCH TINT: '+TINTS[p.id].name.toUpperCase(),t2:'your flame, your color - forever',col:TINTS[p.id].c};
        S.bannerT=2.4; burst(P.x,P.y,30,TINTS[p.id].c,4,{add:true,durM:2}); }
      F.picks.splice(i,1);
    } else if(p.t>30) F.picks.splice(i,1);
  }
}
/* --------------------------------- props --------------------------------- */
const BONFIRE_LINES=['The fire remembers you.','Warmth, briefly. Take it.','Sit. The dark can wait.',
  'You smell of victory and soot.'];
function tryBuy(){
  if(!F) return false;
  for(const pr of F.props){
    if(pr.kind!=='ware'||pr.sold) continue;
    if(hyp(P.x-pr.x,P.y-pr.y)>1.05) continue;
    if(R.gold<pr.item.cost){ SND.deny();
      if(P.msgCd<=0){ floatTxt(pr.x,pr.y-1,'need '+pr.item.cost+' gold','#ff9a8a',12); P.msgCd=0.8; }
      return true; }
    R.gold-=pr.item.cost; pr.sold=true; SND.buy(); haptic('light');
    burst(pr.x,pr.y,14,GOLD,2.6,{add:true});
    if(pr.item.it==='heal'){ P.hearts=Math.min(P.maxH,P.hearts+4); floatTxt(pr.x,pr.y-1,'warm to the bone',GREEN,13); }
    if(pr.item.it==='key'){ R.keys++; floatTxt(pr.x,pr.y-1,'+ key',GOLD,13); }
    if(pr.item.it==='relic') giveRandomRelic();
    return true;
  }
  return false;
}
function giveRandomRelic(){
  const c=pickRelicChoices()[0];
  S.gotRelic=c.id; S.overlay='relicGet'; S.ovT=0;
  SND.relic(); haptic('success');
}
function closeRelicGet(){
  if(S.gotRelic){ applyRelic(S.gotRelic); S.gotRelic=null; }
  S.overlay=null;
}
function openChest(pr){
  pr.open=true; SND.chest(); haptic('success');
  const fl=F.floor; let mult=1;
  if(R.relics.includes('die')){ const r=RND(); mult=r<0.42?2:(r<0.78?1:0); }
  burst(pr.x,pr.y,20,GOLD,3.4,{add:true,durM:1.4});
  if(mult===0){ floatTxt(pr.x,pr.y-1,'dust. classic.','#8a93ab',13);
    burst(pr.x,pr.y,16,'#6a7590',2,{durM:1.4}); return; }
  dropGold(pr.x,pr.y,Math.round((12+4*fl)*mult*R.stats.goldM));
  F.picks.push(mkPick('pip',pr.x+0.4,pr.y));
  if(mult===2){ floatTxt(pr.x,pr.y-1,'DOUBLE!',GOLD,16); F.picks.push(mkPick('pip',pr.x-0.4,pr.y)); }
  if(RND()<0.3) F.picks.push(mkPick('key',pr.x,pr.y+0.4));
}
function openGoldChest(pr){
  if(R.keys<1){
    if(P.msgCd<=0){ floatTxt(pr.x,pr.y-1,'locked - needs a key',GOLD,12); P.msgCd=1; SND.deny(); }
    return;
  }
  R.keys--; pr.open=true; SND.chest(); haptic('success');
  burst(pr.x,pr.y,30,GOLD,4,{add:true,durM:1.8}); ringFx(pr.x,pr.y,4,0.6,GOLD);
  dropGold(pr.x,pr.y,Math.round(10*R.stats.goldM));
  const unowned=TINT_ORDER.filter(t=>!SAVE.tints.includes(t));
  if(unowned.length&&RND()<0.3) F.picks.push(mkPick('tint',pr.x,pr.y+0.5,unowned[(RND()*unowned.length)|0]));
  giveRandomRelic();
}
function updateProps(dt){
  P.msgCd-=dt;
  for(const pr of F.props){
    const d=hyp(P.x-pr.x,P.y-pr.y);
    if(pr.kind==='chest'&&!pr.open&&d<0.85) openChest(pr);
    if(pr.kind==='goldchest'&&!pr.open&&d<0.9) openGoldChest(pr);
    if(pr.kind==='shrine'&&!pr.used&&d<0.9){
      pr.used=true; S.overlay='shrine'; S.ovT=0; S.shrineCards=pickRelicChoices(); SND.shrine(); haptic('soft');
    }
    if(pr.kind==='bonfire'&&!pr.used&&d<1.0){
      pr.used=true; P.hearts=P.maxH; SND.bonfire(); haptic('success');
      S.banner={t1:BONFIRE_LINES[(RND()*BONFIRE_LINES.length)|0],t2:'fully healed',col:AMBER}; S.bannerT=2.6;
      burst(pr.x,pr.y,30,AMBER,3.6,{add:true,durM:2}); checkpoint();
    }
    if(pr.kind==='hatch'&&!pr.hidden&&d<0.6&&!S.overlay&&!P.dead){
      S.overlay='descend'; S.ovT=0; S.descended=false; SND.descend(); haptic('medium');
    }
  }
}
/* ------------------------------ enemy update ----------------------------- */
function clampToRoom(e){
  if(!e.room||e.kind==='wisp') return;
  e.x=clamp(e.x,e.room.rx+e.r,e.room.rx+e.room.rw-e.r);
  e.y=clamp(e.y,e.room.ry+e.r,e.room.ry+e.room.rh-e.r);
}
function updEnemies(dt){
  const px=P.x,py=P.y;
  for(let i=F.enemies.length-1;i>=0;i--){
    const e=F.enemies[i];
    if(e.dead){ F.enemies.splice(i,1); continue; }
    e.flash-=dt; e.squash*=Math.pow(0.001,dt); e.hitCd-=dt; e.cd-=dt; e.ph+=dt;
    if(e.st==='spawn'){ e.t-=dt;
      if(e.t<=0){ e.st='chase'; burst(e.x,e.y,8,AMBER,2,{add:true,size:0.07}); }
      continue; }
    const dx=px-e.x, dy=py-e.y, d=hyp(dx,dy)||0.001, ux=dx/d, uy=dy/d;
    const canHurt=!P.dead;
    switch(e.kind){
      case 'rat':{
        if(e.st==='chase'){
          const w=Math.sin(e.ph*7)*0.7;
          e.vx=lerp(e.vx,(ux-uy*w)*e.spd,dt*8); e.vy=lerp(e.vy,(uy+ux*w)*e.spd,dt*8);
          if(d<1.25&&e.cd<=0){ e.st='windup'; e.t=0.3; e.lx=ux; e.ly=uy; e.vx=e.vy=0; }
        } else if(e.st==='windup'){ e.t-=dt; e.vx*=0.8; e.vy*=0.8;
          if(e.t<=0){ e.st='attack'; e.t=0.16; e.vx=e.lx*7.2; e.vy=e.ly*7.2; }
        } else if(e.st==='attack'){ e.t-=dt;
          if(canHurt&&hyp(px-e.x,py-e.y)<e.r+CFG.P_R+0.06) hurtPlayer(e.dmg,e,EK.rat.name);
          if(e.t<=0){ e.st='recover'; e.t=0.55; e.cd=0.9; }
        } else { e.t-=dt; e.vx*=0.9; e.vy*=0.9; if(e.t<=0)e.st='chase'; }
        break; }
      case 'skel':{
        if(e.st==='chase'){
          e.vx=lerp(e.vx,ux*e.spd,dt*5); e.vy=lerp(e.vy,uy*e.spd,dt*5);
          if(d<2.3&&e.cd<=0){ e.st='windup'; e.t=0.5; e.vx=e.vy=0; }
        } else if(e.st==='windup'){ e.t-=dt;
          if(e.t>0.18){ e.lx=ux; e.ly=uy; } // locks late but before strike
          e.vx=-e.lx*0.5; e.vy=-e.ly*0.5;
          if(e.t<=0){ e.st='attack'; e.t=0.3; e.vx=e.lx*6.4; e.vy=e.ly*6.4; SND.swing(1); }
        } else if(e.st==='attack'){ e.t-=dt;
          if(canHurt&&hyp(px-e.x,py-e.y)<e.r+CFG.P_R+0.1) hurtPlayer(e.dmg,e,EK.skel.name);
          if(e.t<=0){ e.st='recover'; e.t=0.7; e.cd=1.4; }
        } else { e.t-=dt; e.vx*=0.9; e.vy*=0.9; if(e.t<=0)e.st='chase'; }
        break; }
      case 'arch':{
        if(e.st==='chase'){
          let m=0;
          if(d<3)m=-1; else if(d>5.2)m=1;
          e.vx=lerp(e.vx,(ux*m- uy*e.strafe*0.7)*e.spd,dt*5);
          e.vy=lerp(e.vy,(uy*m+ ux*e.strafe*0.7)*e.spd,dt*5);
          if(RND()<dt*0.4) e.strafe*=-1;
          if(e.cd<=0&&d<7){ e.st='windup'; e.t=0.62; e.vx=e.vy=0; }
        } else if(e.st==='windup'){ e.t-=dt;
          if(e.t>0.2){ e.lx=ux; e.ly=uy; }
          if(e.t<=0){ e.st='recover'; e.t=0.5; e.cd=2.2+RND()*0.6;
            F.projs.push({x:e.x,y:e.y,vx:e.lx*4.2,vy:e.ly*4.2,t:0,dur:2.6,friendly:false,dmg:e.dmg,r:0.14});
            SND.arrow(); }
        } else { e.t-=dt; e.vx*=0.9; e.vy*=0.9; if(e.t<=0)e.st='chase'; }
        break; }
      case 'slime': case 'slimelet':{
        const hop=0.5+0.5*Math.sin(e.ph*4.4);
        e.vx=lerp(e.vx,ux*e.spd*(0.3+hop),dt*4); e.vy=lerp(e.vy,uy*e.spd*(0.3+hop),dt*4);
        if(canHurt&&e.hitCd<=0&&d<e.r+CFG.P_R+0.04){ hurtPlayer(e.dmg,e,EK[e.kind].name); e.hitCd=1; }
        break; }
      case 'wisp':{
        const w=Math.sin(e.ph*3)*1.1;
        e.vx=lerp(e.vx,(ux-uy*w)*e.spd,dt*3); e.vy=lerp(e.vy,(uy+ux*w)*e.spd,dt*3);
        if(RND()<dt*8) spawnP(e.x,e.y,(RND()-0.5),(RND()-0.5)-0.8,0.5,0.09,'#ffb35c',{add:true});
        if(d<e.r+CFG.P_R+0.05){
          if(canHurt) hurtPlayer(e.dmg,e,EK.wisp.name);
          e.hp=0; killEnemy(e,0); SND.wisp();
          burst(e.x,e.y,20,'#ffb35c',3.6,{add:true}); ringFx(e.x,e.y,3,0.4,'#ffb35c');
          continue; }
        break; }
      case 'warden': updWarden(e,dt,d,ux,uy); break;
      case 'kiln': updKiln(e,dt,d,ux,uy); break;
    }
    tryMove(e,dt,e.kind==='wisp');
    clampToRoom(e);
    // gentle separation
    for(const o of F.enemies){ if(o===e||o.dead||o.st==='spawn') continue;
      const sx=e.x-o.x, sy=e.y-o.y, sd=hyp(sx,sy), min=e.r+o.r;
      if(sd>0.001&&sd<min){ const push=(min-sd)*0.5/sd; e.x+=sx*push; e.y+=sy*push; } }
  }
  // projectiles
  for(let i=F.projs.length-1;i>=0;i--){
    const p=F.projs[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    let kill=p.t>p.dur;
    if(circleHitsWall(p.x,p.y,0.1)){ kill=true;
      burst(p.x,p.y,5,p.friendly?AMBER:'#aab3c8',2,{size:0.06,durM:0.6}); }
    if(!kill&&p.friendly){
      for(const e of F.enemies){ if(e.dead||e.st==='spawn') continue;
        if(hyp(e.x-p.x,e.y-p.y)<e.r+p.r+0.15){ dmgEnemy(e,p.dmg,Math.atan2(p.vy,p.vx),3,true); kill=true; break; } }
    } else if(!kill&&!P.dead&&hyp(P.x-p.x,P.y-p.y)<CFG.P_R+p.r){
      if(P.iframe<=0&&P.roll.t<=0){ hurtPlayer(p.dmg,null,'a stray arrow'); kill=true; }
      else if(P.roll.t>0){} // sails past mid-roll
    }
    if(p.friendly&&RND()<dt*30) spawnP(p.x,p.y,0,0,0.3,0.1,AMBER,{add:true});
    if(kill) F.projs.splice(i,1);
  }
  // harmful boss rings
  for(let i=F.rings.length-1;i>=0;i--){
    const g=F.rings[i]; g.t+=dt; g.r+=g.vr*dt;
    if(!P.dead&&P.iframe<=0&&P.roll.t<=0){
      const d=hyp(P.x-g.x,P.y-g.y);
      if(Math.abs(d-g.r)<0.34+CFG.P_R) hurtPlayer(g.dmg,null,'the shockwave');
    }
    if(g.t>g.dur) F.rings.splice(i,1);
  }
  // lava pools
  P.burnCd-=dt;
  for(let i=F.pools.length-1;i>=0;i--){
    const lp=F.pools[i]; lp.t+=dt;
    if(lp.t>lp.dur){ F.pools.splice(i,1); continue; }
    if(!P.dead&&P.roll.t<=0&&P.iframe<=0&&P.burnCd<=0&&hyp(P.x-lp.x,P.y-lp.y)<lp.r){
      hurtPlayer(1,null,'a lava pool'); P.burnCd=0.8; }
    if(RND()<dt*6) spawnP(lp.x+(RND()-0.5)*lp.r*1.4,lp.y+(RND()-0.5)*lp.r*1.4,0,-0.7,0.6,0.1,'#ff8a3c',{add:true});
  }
}
function updWarden(e,dt,d,ux,uy){
  const p2=e.hp<e.maxhp*0.5;
  if(p2&&e.phase===1){ e.phase=2; e.spd*=1.3;
    S.banner={t1:'THE WARDEN RAGES',t2:'',col:RED}; S.bannerT=1.4; SND.roar(); addShake(5); }
  const cdm=p2?0.7:1;
  e.bashCd-=dt; e.slamCd-=dt; e.addCd-=dt;
  if(e.st==='intro'){ e.t-=dt; if(e.t<=0)e.st='idle'; return; }
  if(e.st==='idle'){
    e.vx=lerp(e.vx,ux*e.spd,dt*3); e.vy=lerp(e.vy,uy*e.spd,dt*3);
    if(!P.dead&&e.hitCd<=0&&d<e.r+CFG.P_R+0.05){ hurtPlayer(e.dmg,e,'the Warden'); e.hitCd=1; }
    let adds=0; for(const o of F.enemies) if(o.isAdd&&!o.dead) adds++;
    if(e.addCd<=0&&adds<3){ e.st='summon'; e.t=0.95; e.vx=e.vy=0; e.addCd=8.5*cdm; }
    else if(e.slamCd<=0&&d<3.6){ e.st='slamwind'; e.t=0.85; e.vx=e.vy=0; e.slamCd=4.4*cdm; }
    else if(e.bashCd<=0&&d>2.2){ e.st='bashwind'; e.t=0.78; e.vx=e.vy=0; e.bashCd=3.6*cdm; }
  } else if(e.st==='bashwind'){ e.t-=dt; e.lx=ux; e.ly=uy; e.vx=-ux*0.4; e.vy=-uy*0.4;
    if(e.t<=0){ e.st='bash'; e.t=0.42; e.vx=e.lx*9.5; e.vy=e.ly*9.5; SND.roar(); addShake(2); }
  } else if(e.st==='bash'){ e.t-=dt;
    if(!P.dead&&hyp(P.x-e.x,P.y-e.y)<e.r+CFG.P_R+0.12) { hurtPlayer(e.dmg,e,'the shield bash'); e.t=0; }
    if(RND()<dt*20) spawnP(e.x,e.y+0.3,(RND()-0.5)*2,(RND()-0.5)*0.5,0.4,0.1,'#6a7590');
    if(e.t<=0){ e.st='recover'; e.t=0.7; addShake(4); SND.slam(); }
  } else if(e.st==='slamwind'){ e.t-=dt;
    if(e.t<=0){ e.st='recover'; e.t=0.9;
      SND.slam(); addShake(9); hitstop(0.05); haptic('heavy');
      const n=p2?3:2;
      for(let k=0;k<n;k++) F.rings.push({x:e.x,y:e.y,r:0.3+k*0.55,vr:3.6,t:0,dur:1.7,dmg:e.dmg-1||1});
      ringFx(e.x,e.y,3.6,1.7,'#ffb35c',0.12);
      burst(e.x,e.y,24,'#8a93ab',4,{durM:1.2}); }
  } else if(e.st==='summon'){ e.t-=dt;
    if(RND()<dt*12) spawnP(e.x+(RND()-0.5)*1.4,e.y+(RND()-0.5)*1.4,0,-1.4,0.5,0.1,e.variant?'#ffb35c':'#8fe8ff',{add:true});
    if(e.t<=0){ e.st='recover'; e.t=0.6;
      const kinds=e.variant?['wisp','wisp','rat']:['rat','skel','rat'];
      const n=2+(e.phase===2?1:0);
      for(let k=0;k<n;k++){
        const a=RND()*TAU, ad=spawnEnemy(kinds[k%kinds.length],
          clamp(e.x+Math.cos(a)*2,e.room.rx+1,e.room.rx+e.room.rw-1),
          clamp(e.y+Math.sin(a)*2,e.room.ry+1,e.room.ry+e.room.rh-1),e.room);
        ad.isAdd=true; e.room.alive++;
      } }
  } else { e.t-=dt; e.vx*=0.92; e.vy*=0.92; if(e.t<=0)e.st='idle'; }
}
function updKiln(e,dt,d,ux,uy){
  const p2=e.hp<e.maxhp*0.5;
  if(p2&&e.phase===1){ e.phase=2; e.spd*=1.45;
    S.banner={t1:'THE CORE IS BARE',t2:'the edges of the world catch fire',col:'#ff8a3c'};
    S.bannerT=2.2; SND.roar(); addShake(8); }
  const cdm=p2?0.68:1;
  e.bashCd-=dt; e.slamCd-=dt; // bashCd=arc, slamCd=lava
  if(e.st==='intro'){ e.t-=dt; if(e.t<=0)e.st='idle'; return; }
  if(e.st==='idle'){
    e.vx=lerp(e.vx,ux*e.spd,dt*2.5); e.vy=lerp(e.vy,uy*e.spd,dt*2.5);
    if(!P.dead&&e.hitCd<=0&&d<e.r+CFG.P_R+0.05){ hurtPlayer(e.dmg,e,'the Kilnheart'); e.hitCd=1; }
    if(e.bashCd<=0&&d<3.6){ e.st='arcwind'; e.t=p2?0.55:0.72; e.arcA=Math.atan2(P.y-e.y,P.x-e.x);
      e.vx=e.vy=0; e.bashCd=2.6*cdm; }
    else if(e.slamCd<=0){ e.st='lavawind'; e.t=0.8; e.lavaX=P.x; e.lavaY=P.y; e.vx=e.vy=0; e.slamCd=5*cdm; }
  } else if(e.st==='arcwind'){ e.t-=dt;
    if(e.t<=0){ e.st='recover'; e.t=0.5;
      SND.slam(); addShake(6); hitstop(0.04);
      const half=p2?1.35:1.15, rr2=3.3;
      const pa=Math.atan2(P.y-e.y,P.x-e.x);
      if(!P.dead&&P.iframe<=0&&P.roll.t<=0&&d<rr2&&Math.abs(angDiff(e.arcA,pa))<half)
        hurtPlayer(e.dmg,e,'the molten arc');
      S.kilnArc={x:e.x,y:e.y,a:e.arcA,half,r:rr2,t:0.28};

  } else if(e.st==='lavawind'){ e.t-=dt;

    if(e.t<=0){ e.st='recover'; e.t=0.4;

      if(p2) F.pools.push({x:e.lavaX+(RND()-0.5)*3,y:e.lavaY+(RND()-0.5)*3,r:1.1,t:0,dur:8});
      SND.slam(); addShake(4); }
  } else { e.t-=dt; e.vx*=0.92; e.vy*=0.92; if(e.t<=0)e.st='idle'; }
  // phase2 perimeter burn
  if(p2&&e.room&&!P.dead&&P.iframe<=0&&P.burnCd<=0){
    const r=e.room, m=1.15;
    if(P.x<r.rx+m||P.x>r.rx+r.rw-m||P.y<r.ry+m||P.y>r.ry+r.rh-m){

/* ------------------------------ player update ---------------------------- */
function updPlayer(dt){
  if(P.dead) return;
  const st=R.stats;
  let mx=0,my=0;
  if(IN.stick.id>=0&&IN.stick.mag>0.1){
    const d=hyp(IN.stick.dx,IN.stick.dy)||1, m=Math.min(1,IN.stick.mag);
    mx=IN.stick.dx/d*m; my=IN.stick.dy/d*m;
  }
  const k=IN.keys;
  if(k.KeyW||k.ArrowUp)my-=1; if(k.KeyS||k.ArrowDown)my+=1;
  if(k.KeyA||k.ArrowLeft)mx-=1; if(k.KeyD||k.ArrowRight)mx+=1;
  const ml=hyp(mx,my); if(ml>1){mx/=ml;my/=ml;}
  const a=P.atk;
  if(P.roll.t>0){
    P.roll.t-=dt;
    P.vx=P.roll.dx*CFG.ROLL_SPD; P.vy=P.roll.dy*CFG.ROLL_SPD;
    if(RND()<dt*40) spawnP(P.x-P.roll.dx*0.3,P.y-P.roll.dy*0.3,(RND()-0.5),(RND()-0.5),0.3,0.09,'#8a93ab');
  } else {
    const slow=a.t>0?0.5:1, spd=CFG.P_SPD*st.spdM*slow;
    const f=1-Math.pow(0.00008,dt);
    P.vx=lerp(P.vx,mx*spd,f); P.vy=lerp(P.vy,my*spd,f);
    if(ml>0.1&&a.t<=0) P.face=Math.atan2(my,mx);
    P.walk+=hyp(P.vx,P.vy)*dt;
    if(ml>0.3&&RND()<dt*6) spawnP(P.x,P.y+0.28,(RND()-0.5)*0.4,-0.1,0.35,0.06,'#3a4258');
  }
  tryMove(P,dt);
  P.roll.cd-=dt; P.iframe-=dt; P.flash-=dt;
  // attack cycle
  if(a.t>0){
    a.t-=dt;
    const ft=1-a.t/a.dur;
    if(ft>0.12&&ft<0.6){
      const wide=a.step===2?1.28:1, reach=st.reach*(a.step===2?1.12:1);
      for(const e of F.enemies){
        if(e.dead||e.st==='spawn'||a.hit.includes(e)) continue;
        const d=hyp(e.x-P.x,e.y-P.y);
        if(d<reach+e.r&&Math.abs(angDiff(a.dir,Math.atan2(e.y-P.y,e.x-P.x)))<st.arc*wide){
          a.hit.push(e);
          const big=a.step===2;
          dmgEnemy(e,st.dmg*CFG.SWING_DMG[a.step],a.dir,big?5:2.2,big);
        }
      }
      if(a.step===2&&!a.wave&&ft>0.3&&R.relics.includes('edge')){
        a.wave=true;
        F.projs.push({x:P.x+Math.cos(a.dir)*0.5,y:P.y+Math.sin(a.dir)*0.5,
          vx:Math.cos(a.dir)*7,vy:Math.sin(a.dir)*7,t:0,dur:0.55,friendly:true,dmg:st.dmg*0.9,r:0.3});
        SND.swing(0);
      }
    }
    if(a.t<=0){
      const nxt=(a.step+1)%3;
      if(a.buf){ a.buf=false; startSwing(nxt); }
      else { a.step=nxt; a.gap=nxt===0?0.55:CFG.COMBO_GAP; }
    }
  } else if(a.gap>0){ a.gap-=dt; if(a.gap<=0) a.step=0; }
  // held attack buttons retrigger
  if(IN.atkIds.size>0&&a.t<=0&&P.roll.t<=0&&!S.overlay) pressAttack();
  if(IN.mouseDown&&!IN.hasTouch&&a.t<=0&&P.roll.t<=0&&!S.overlay) pressAttack(true);
}

  if(B&&!B.dead&&B.st==='arcwind'){
    const half=B.phase===2?1.35:1.15, blink=0.5+0.5*Math.sin(S.t*18);
    ctx.fillStyle='rgba(255,90,40,'+(0.14+0.12*blink)+')';
    ctx.beginPath(); ctx.moveTo(B.x*TILE,B.y*TILE);
    ctx.arc(B.x*TILE,B.y*TILE,3.3*TILE,B.arcA-half,B.arcA+half); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,150,80,'+(0.4+0.3*blink)+')'; ctx.lineWidth=2; ctx.stroke();
  }
  if(S.kilnArc){ const ka=S.kilnArc;
    ctx.fillStyle='rgba(255,170,80,'+(ka.t*2.4)+')';
    ctx.beginPath(); ctx.moveTo(ka.x*TILE,ka.y*TILE);
    ctx.arc(ka.x*TILE,ka.y*TILE,ka.r*TILE,ka.a-ka.half,ka.a+ka.half); ctx.closePath(); ctx.fill();
  }
  // kiln phase2 burning border
  if(B&&!B.dead&&B.kind==='kiln'&&B.phase===2&&B.room){
    const r=B.room, blink=0.25+0.2*Math.sin(S.t*7);
    ctx.strokeStyle='rgba(255,90,30,'+blink+')'; ctx.lineWidth=TILE*1.05;
    ctx.strokeRect((r.rx+0.55)*TILE,(r.ry+0.55)*TILE,(r.rw-1.1)*TILE,(r.rh-1.1)*TILE);
  }
  // archer aim lines
  for(const e of F.enemies){
    if(e.kind==='arch'&&e.st==='windup'&&!e.dead){
      ctx.strokeStyle='rgba(255,110,90,'+(0.25+0.25*Math.sin(S.t*16))+')';
      ctx.lineWidth=1.5; ctx.setLineDash([TILE*0.14,TILE*0.14]);
      ctx.beginPath(); ctx.moveTo(e.x*TILE,e.y*TILE);
      ctx.lineTo((e.x+e.lx*7)*TILE,(e.y+e.ly*7)*TILE); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  // non-additive particles
  for(const p of PARTS){ if(!p.on||p.add) continue;
    const a=1-p.t/p.dur;
    ctx.globalAlpha=a; ctx.fillStyle=p.col;
    const s=p.size*(p.shrink?a:1)*TILE;
    ctx.fillRect(p.x*TILE-s,p.y*TILE-s,s*2,s*2);
  }
  ctx.globalAlpha=1;
  // visual rings
  for(const g of RINGSFX){
    ctx.strokeStyle=g.col; ctx.globalAlpha=Math.max(0,1-g.t/g.dur)*0.8;
    ctx.lineWidth=g.w*TILE;
    ctx.beginPath(); ctx.arc(g.x*TILE,g.y*TILE,g.r*TILE,0,TAU); ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // player torch light
  if(!P.dead){
    const fl=1+0.05*Math.sin(S.t*9)+0.03*Math.sin(S.t*17);
    addLight(P.x,P.y,4.4*fl,SAVE.tint,0.13);
  } else addLight(P.x,P.y,2.2,'ember',0.08);
  compositeLighting();
  drawPostGlow();
}
function compositeLighting(){
  const LS=CFG.LIGHT_SCALE, z=ZONES[F.zone];
  lctx.globalCompositeOperation='source-over';
  lctx.clearRect(0,0,LC.width,LC.height);
  lctx.fillStyle='rgba('+z.dark+','+F.darkA+')';
  lctx.fillRect(0,0,LC.width,LC.height);
  lctx.globalCompositeOperation='destination-out';
  for(const l of LIGHTS){
    const sx=w2sx(l.x), sy=w2sy(l.y), rr2=l.r*TILE;
    if(sx<-rr2||sx>vw+rr2||sy<-rr2||sy>vh+rr2){ l.off=true; continue; }
    l.off=false;
    lctx.drawImage(SPR.hole,(sx-rr2)*LS,(sy-rr2)*LS,rr2*2*LS,rr2*2*LS);
  }
  ctx.drawImage(LC,0,0,vw,vh);
  // warm halos
  ctx.globalCompositeOperation='lighter';
  for(const l of LIGHTS){
    if(!l.warm||l.off) continue;
    const spr=SPR.warm[l.tint]||SPR.warm.ember;
    const sx=w2sx(l.x), sy=w2sy(l.y), r=l.r*TILE*0.9;
    ctx.globalAlpha=l.warm;
    ctx.drawImage(spr,sx-r,sy-r,r*2,r*2);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
function drawPostGlow(){
  ctx.globalCompositeOperation='lighter';
  // glowing eyes pierce the dark
  for(const e of F.enemies){
    if(e.dead||e.st==='spawn') continue;
    const dx=P.x-e.x, dy=P.y-e.y, d=hyp(dx,dy)||1;
    const hx=w2sx(e.x+dx/d*e.r*0.4), hy=w2sy(e.y+dy/d*e.r*0.4-e.r*0.5);
    const spr=(e.kind==='skel'||e.kind==='arch')?SPR.eyeC:SPR.eye;
    const s=TILE*(e.kind==='warden'||e.kind==='kiln'?0.24:0.14);
    const px=-dy/d, py=dx/d, off=TILE*e.r*0.34;
    ctx.globalAlpha=0.9;
    ctx.drawImage(spr,hx-px*off-s/2,hy-py*off-s/2,s,s);
    ctx.drawImage(spr,hx+px*off-s/2,hy+py*off-s/2,s,s);
  }
  // additive particles above darkness
  for(const p of PARTS){ if(!p.on||!p.add) continue;
    const a=1-p.t/p.dur, s=Math.max(0.5,p.size*(p.shrink?a:1)*TILE*3);
    ctx.globalAlpha=a*0.9;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(w2sx(p.x),w2sy(p.y),s*0.4,0,TAU); ctx.fill();
  }
  // ember motes (parallax layers)
  for(const m of MOTES){
    const par=0.1+0.25*m.z;
    let mx=(m.x*vw*1.4-CAM.x*TILE*par)%(vw+80); if(mx<-40)mx+=vw+80;
    let my=(m.y*vh*1.4-CAM.y*TILE*par)%(vh+80); if(my<-40)my+=vh+80;
    const s=m.s*5*m.z;
    ctx.globalAlpha=0.25+0.3*m.z*(0.6+0.4*Math.sin(S.t*2+m.ph));
    ctx.drawImage(SPR.mote,mx-40-s,my-40-s,s*2,s*2);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  // floaters
  for(const f of FLOATS){ if(!f.on) continue;
    const a=1-f.t/f.dur, pop=f.t<0.12?f.t/0.12*1.3:(f.t<0.25?1.3-(f.t-0.12)/0.13*0.3:1);
    ctx.globalAlpha=Math.min(1,a*2);
    setFont(f.size*pop,800); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.lineWidth=3;
    const fx=w2sx(f.x), fy=w2sy(f.y-f.t*0.9);
    ctx.strokeText(f.txt,fx,fy);
    ctx.fillStyle=f.col; ctx.fillText(f.txt,fx,fy);
  }
  ctx.globalAlpha=1;
  // vignette
  ctx.drawImage(SPR.vig,0,0,vw,vh);
  if(P&&P.hearts<=2&&!P.dead){
    ctx.globalAlpha=0.2+0.15*Math.sin(S.t*5);
    ctx.fillStyle='rgba(255,40,30,.4)';
    ctx.fillRect(0,0,vw,8); ctx.fillRect(0,vh-8,vw,8);
    ctx.fillRect(0,0,8,vh); ctx.fillRect(vw-8,0,8,vh);
    ctx.globalAlpha=1;
  }
  if(S.flash>0){ ctx.globalAlpha=S.flash*4; ctx.fillStyle=S.flashCol; ctx.fillRect(0,0,vw,vh); ctx.globalAlpha=1; }
}

function drawPlayer(){
  const a=P.atk, px=P.x*TILE, py=P.y*TILE;
  const blink=P.iframe>0&&Math.sin(S.t*30)>0;
  ctx.save(); ctx.translate(px,py);
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(0,TILE*0.3,TILE*0.28,TILE*0.1,0,0,TAU); ctx.fill();
  if(blink) ctx.globalAlpha=0.45;
  const rolling=P.roll.t>0;
  if(rolling){ const rp=1-P.roll.t/CFG.ROLL_T;
    ctx.rotate(Math.atan2(P.roll.dy,P.roll.dx));
    ctx.scale(1+0.2*Math.sin(rp*Math.PI),1-0.3*Math.sin(rp*Math.PI));
    ctx.rotate(rp*TAU);
  }
  const bob=rolling?0:Math.sin(P.walk*3)*TILE*0.03;
  // cloak
  ctx.fillStyle='#232b42';
  ctx.beginPath(); ctx.moveTo(-TILE*0.24,TILE*0.26);
  ctx.quadraticCurveTo(0,-TILE*0.4+bob,TILE*0.24,TILE*0.26); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle='#39435e'; ctx.beginPath(); ctx.arc(0,bob-TILE*0.04,TILE*0.22,0,TAU); ctx.fill();
  // helm
  ctx.fillStyle='#8a93ab'; ctx.beginPath(); ctx.arc(0,bob-TILE*0.26,TILE*0.16,0,TAU); ctx.fill();
  ctx.fillStyle='#b8c0d4'; ctx.beginPath(); ctx.arc(-TILE*0.04,bob-TILE*0.3,TILE*0.06,0,TAU); ctx.fill();
  // visor slit glow
  const tc=TINTS[SAVE.tint];
  ctx.fillStyle=tc.c;
  const fx=Math.cos(P.face), fy=Math.sin(P.face);
  ctx.fillRect(fx*TILE*0.08-TILE*0.07,bob-TILE*0.27+fy*TILE*0.05,TILE*0.14,TILE*0.045);
  if(!rolling){
    // torch (off-hand)
    const ta=P.face+Math.PI*0.6;
    const tx=Math.cos(ta)*TILE*0.28, ty=Math.sin(ta)*TILE*0.28+bob;
    ctx.strokeStyle='#4a3a28'; ctx.lineWidth=TILE*0.07; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(tx*0.5,ty*0.5); ctx.lineTo(tx,ty-TILE*0.16); ctx.stroke();
    ctx.fillStyle=tc.c;
    ctx.beginPath(); ctx.arc(tx,ty-TILE*0.24,TILE*(0.08+0.02*Math.sin(S.t*13)),0,TAU); ctx.fill();
    if(RND()<0.25) spawnP(P.x+tx/TILE,P.y+(ty-TILE*0.24)/TILE,(RND()-0.5)*0.3,-0.6,0.5,0.06,tc.c,{add:true});
    // sword
    if(a.t>0){
      const ft=1-a.t/a.dur, dirSign=a.step===1?-1:1;
      const sweep=R.stats.arc*(a.step===2?1.28:1)*2;
      const ang=a.dir+dirSign*(-sweep/2+sweep*Math.min(1,ft*1.7));
      const reach=R.stats.reach*(a.step===2?1.12:1);
      // arc trail
      const trail=Math.min(1,ft*1.7);
      ctx.fillStyle='rgba(255,'+(a.step===2?'170,90':'205,140')+','+(0.34*(1-ft*0.7))+')';
      ctx.beginPath(); ctx.moveTo(0,bob);
      ctx.arc(0,bob,reach*TILE,a.dir+dirSign*(-sweep/2),a.dir+dirSign*(-sweep/2+sweep*trail),dirSign<0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#f4e9d0'; ctx.lineWidth=TILE*0.09; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(Math.cos(ang)*TILE*0.16,bob+Math.sin(ang)*TILE*0.16);
      ctx.lineTo(Math.cos(ang)*reach*TILE*0.94,bob+Math.sin(ang)*reach*TILE*0.94); ctx.stroke();
      ctx.strokeStyle=R.weapon==='charred'?'#ff8a3c':'#ffd9a0'; ctx.lineWidth=TILE*0.035;
      ctx.beginPath(); ctx.moveTo(Math.cos(ang)*TILE*0.2,bob+Math.sin(ang)*TILE*0.2);
      ctx.lineTo(Math.cos(ang)*reach*TILE*0.9,bob+Math.sin(ang)*reach*TILE*0.9); ctx.stroke();
    } else {
      const sa=P.face+Math.PI*0.82;
      ctx.strokeStyle='#c9ceda'; ctx.lineWidth=TILE*0.06; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(Math.cos(sa)*TILE*0.2,bob+Math.sin(sa)*TILE*0.2);
      ctx.lineTo(Math.cos(sa)*TILE*0.52,bob+Math.sin(sa)*TILE*0.52-TILE*0.14); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawEnemy(e){
  const px=e.x*TILE, py=e.y*TILE;

  if(e.st==='spawn'){
    const pr=1-e.t/0.55;
    ctx.globalAlpha=0.5;
    ctx.strokeStyle=AMBER; ctx.lineWidth=2;

    ctx.restore(); return;

  const wind=e.st==='windup'||e.st==='bashwind'||e.st==='slamwind'||e.st==='arcwind'||e.st==='lavawind'||e.st==='summon';

      ctx.fillStyle=bodyC||'#2a2431';
      ctx.beginPath(); ctx.arc(ux*TILE*0.26-uy*TILE*0.1,uy*TILE*0.26+ux*TILE*0.1,TILE*0.06,0,TAU);
      ctx.arc(ux*TILE*0.26+uy*TILE*0.1,uy*TILE*0.26-ux*TILE*0.1,TILE*0.06,0,TAU); ctx.fill();
      break; }
    case 'skel': case 'arch':{
      ctx.fillStyle=bodyC||'#1e2434';
      ctx.beginPath(); ctx.ellipse(0,0,TILE*0.24,TILE*0.3,0,0,TAU); ctx.fill();
      ctx.fillStyle=bodyC||'#aab3c8';
      ctx.beginPath(); ctx.arc(0,-TILE*0.32+Math.sin(e.ph*6)*TILE*0.02,TILE*0.15,0,TAU); ctx.fill();
      ctx.fillStyle='#0b0e18';
      ctx.fillRect(-TILE*0.09,-TILE*0.36,TILE*0.07,TILE*0.06);
      ctx.fillRect(TILE*0.03,-TILE*0.36,TILE*0.07,TILE*0.06);
      ctx.strokeStyle='#8a93ab'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-TILE*0.14,-TILE*0.02); ctx.lineTo(TILE*0.14,-TILE*0.02);
      ctx.moveTo(-TILE*0.1,TILE*0.08); ctx.lineTo(TILE*0.1,TILE*0.08); ctx.stroke();
      if(e.kind==='arch'){
        ctx.strokeStyle='#8a6a3e'; ctx.lineWidth=2.4;
        ctx.beginPath(); ctx.arc(ux*TILE*0.3,uy*TILE*0.3,TILE*0.26,Math.atan2(uy,ux)-1.2,Math.atan2(uy,ux)+1.2); ctx.stroke();
        ctx.strokeStyle='#d9d2c0'; ctx.lineWidth=1;
        const bend=e.st==='windup'?0.1:0.26;
        ctx.beginPath(); ctx.moveTo((ux*0.3+Math.cos(Math.atan2(uy,ux)-1.2)*0.26)*TILE,(uy*0.3+Math.sin(Math.atan2(uy,ux)-1.2)*0.26)*TILE);
        ctx.lineTo(ux*TILE*bend,uy*TILE*bend);
        ctx.lineTo((ux*0.3+Math.cos(Math.atan2(uy,ux)+1.2)*0.26)*TILE,(uy*0.3+Math.sin(Math.atan2(uy,ux)+1.2)*0.26)*TILE);
        ctx.stroke();
      }
      break; }
    case 'slime': case 'slimelet':{
      const wob=1+0.12*Math.sin(e.ph*4.4);
      ctx.fillStyle=bodyC||(F.zone===1?'rgba(110,190,120,.8)':'rgba(90,160,190,.8)');
      ctx.beginPath(); ctx.ellipse(0,TILE*e.r*0.2,TILE*e.r*wob,TILE*e.r*(2-wob)*0.8,0,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(-TILE*e.r*0.3,-TILE*e.r*0.2,TILE*e.r*0.24,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(20,30,26,.8)';
      ctx.beginPath(); ctx.arc(0,0,TILE*e.r*0.3,0,TAU); ctx.fill();
      break; }
    case 'wisp':{
      ctx.globalCompositeOperation='lighter';
      const fl2=1+0.15*Math.sin(e.ph*9);
      ctx.fillStyle='rgba(255,150,60,.7)';
      ctx.beginPath(); ctx.moveTo(-TILE*0.2,TILE*0.14);
      ctx.quadraticCurveTo(0,-TILE*0.6*fl2,TILE*0.2,TILE*0.14);
      ctx.quadraticCurveTo(0,TILE*0.3,-TILE*0.2,TILE*0.14); ctx.fill();
      ctx.fillStyle='rgba(255,230,170,.9)';
      ctx.beginPath(); ctx.arc(0,0,TILE*0.1,0,TAU); ctx.fill();
      ctx.globalCompositeOperation='source-over';
      addLight(e.x,e.y,1.5,'ember',0.12);
      break; }
    case 'warden':{
      const big=TILE*e.r, varC=e.variant?'#5a2c3c':'#3c4a78';
      const raise=e.st==='slamwind'?Math.sin((0.85-e.t)/0.85*Math.PI)*0.3:0;
      ctx.scale(1+raise*0.2,1+raise*0.4);
      ctx.fillStyle=bodyC||varC;
      ctx.beginPath(); ctx.arc(0,-raise*TILE*0.5,big,0,TAU); ctx.fill();
      ctx.strokeStyle=e.variant?'#8a4a5c':'#6a7ab0'; ctx.lineWidth=2.4; ctx.stroke();
      // pauldrons
      ctx.fillStyle=bodyC||(e.variant?'#7a3c50':'#556398');
      ctx.beginPath(); ctx.arc(-big*0.72,-big*0.3-raise*TILE*0.5,big*0.34,0,TAU);
      ctx.arc(big*0.72,-big*0.3-raise*TILE*0.5,big*0.34,0,TAU); ctx.fill();
      ctx.fillStyle=bodyC||(e.variant?'#8a4a5c':'#6a7ab0');
      ctx.beginPath(); ctx.arc(0,-big*0.7-raise*TILE*0.5,big*0.5,0,TAU); ctx.fill();
      // helm slit
      ctx.fillStyle=e.variant?'#ff5a5a':AMBER;
      ctx.fillRect(-big*0.3,-big*0.75-raise*TILE*0.5,big*0.6,big*0.1);
      // shield toward player
      const sa2=Math.atan2(uy,ux);
      ctx.save(); ctx.rotate(sa2);
      const shieldGlow=e.st==='bashwind'?(0.5+0.5*Math.sin(S.t*20)):0;
      ctx.fillStyle=shieldGlow?('rgba(255,'+(120+80*shieldGlow)+',80,.9)'):'#5a6580';
      rrect(big*0.6,-big*0.75,big*0.35,big*1.5,big*0.14); ctx.fill();
      ctx.strokeStyle='#8a93ab'; ctx.lineWidth=2; rrect(big*0.6,-big*0.75,big*0.35,big*1.5,big*0.14); ctx.stroke();
      ctx.restore();
      if(e.st==='summon'){
        ctx.strokeStyle=e.variant?'#ffb35c':'#8fe8ff'; ctx.lineWidth=2; ctx.globalAlpha=0.6;
        ctx.beginPath(); ctx.arc(0,0,big*1.6+Math.sin(S.t*8)*3,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
      }
      addLight(e.x,e.y,2.4,e.variant?'red':'ember',0.07);
      break; }
    case 'kiln':{
      const big=TILE*e.r;
      ctx.fillStyle=bodyC||'#241318';
      ctx.beginPath(); ctx.arc(0,0,big,0,TAU); ctx.fill();
      // molten cracks
      const glow=0.5+0.5*Math.sin(S.t*(e.phase===2?9:4));
      ctx.strokeStyle='rgba(255,'+(110+60*glow|0)+',40,'+(0.5+0.4*glow)+')';
      ctx.lineWidth=2.4;
      for(let i=0;i<5;i++){ const a2=i*1.26+0.4;
        ctx.beginPath(); ctx.moveTo(Math.cos(a2)*big*0.24,Math.sin(a2)*big*0.24);
        ctx.lineTo(Math.cos(a2+0.5)*big*0.86,Math.sin(a2+0.5)*big*0.86); ctx.stroke(); }
      ctx.fillStyle=bodyC||'#38202a';
      ctx.beginPath(); ctx.arc(0,-big*0.72,big*0.48,0,TAU); ctx.fill();
      ctx.fillStyle='#ff8a3c'; ctx.fillRect(-big*0.28,-big*0.78,big*0.56,big*0.1);
      if(e.phase===2){
        ctx.fillStyle='rgba(255,'+(150+80*glow|0)+',60,.95)';
        ctx.beginPath(); ctx.arc(0,0,big*0.34*(1+0.1*glow),0,TAU); ctx.fill();
        ctx.fillStyle='#fff0d0'; ctx.beginPath(); ctx.arc(0,0,big*0.14,0,TAU); ctx.fill();
      }
      // sword
      const ka2=e.st==='arcwind'?e.arcA:Math.atan2(uy,ux);
      ctx.save(); ctx.rotate(ka2);
      ctx.strokeStyle='#ff8a3c'; ctx.lineWidth=big*0.16; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(big*0.6,0); ctx.lineTo(big*2.1,0); ctx.stroke();
      ctx.strokeStyle='#ffd9a0'; ctx.lineWidth=big*0.05;
      ctx.beginPath(); ctx.moveTo(big*0.7,0); ctx.lineTo(big*2,0); ctx.stroke();
      ctx.restore();
      addLight(e.x,e.y,e.phase===2?3.4:2.4,'red',0.14);
      break; }
  }
  if(e.flash>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=e.flash*8;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,TILE*e.r*1.2,0,TAU); ctx.fill();
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
  ctx.restore();
  // boss hp handled in HUD
}

function drawHUD(){
  const padL=SAFE.l+12, padT=SAFE.t+10;
  // hearts
  const hs=20, pulse=P.flash>0?1.25:1;
  for(let i=0;i<P.maxH/2;i++){
    const full=P.hearts-i*2;
    drawHeart(padL+10+i*(hs+3),padT+12,hs*(full>0&&full<3?pulse:1),full>=2?2:(full===1?1:0));
  }
  // gold + keys
  drawCoin(padL+10,padT+38,7);
  setFont(15,800); ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle=GOLD; ctx.fillText(''+R.gold,padL+22,padT+39);
  const gw=ctx.measureText(''+R.gold).width;
  drawKeyIcon(padL+38+gw,padT+38,11,R.keys>0?GOLD:'#4a5268');
  ctx.fillStyle=R.keys>0?GOLD:'#4a5268'; ctx.fillText(''+R.keys,padL+52+gw,padT+39);
  // floor label
  setFont(13,800); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,211,150,.85)';
  ctx.fillText('FLOOR '+R.floor,vw/2,padT+12);
  const B=F.boss;
  if(!(B&&!B.dead)){ setFont(9,600); ctx.fillStyle='rgba(160,150,140,.6)';
    ctx.fillText(zoneName(R.floor),vw/2,padT+26); }
  // boss bar
  if(B&&!B.dead&&B.st!=='spawn'){
    const bw=Math.min(320,vw-140), bx=vw/2-bw/2, by=padT+36;
    setFont(11,800); ctx.fillStyle='#ffb0a0'; ctx.fillText(F.bossName,vw/2,by+1);
    rrect(bx,by+8,bw,9,4.5); ctx.fillStyle='rgba(10,6,10,.8)'; ctx.fill();
    ctx.strokeStyle='#5a2a30'; ctx.lineWidth=1; ctx.stroke();
    const frac=clamp(B.hp/B.maxhp,0,1);
    if(frac>0){ rrect(bx+1.5,by+9.5,(bw-3)*frac,6,3);
      const g=ctx.createLinearGradient(bx,0,bx+bw,0);
      g.addColorStop(0,'#ff5a3c'); g.addColorStop(1,'#ffb35c');
      ctx.fillStyle=g; ctx.fill(); }
  }
  // pause button
  const pbx=vw-SAFE.r-48, pby=SAFE.t+8;
  UI.btns.push({id:'pause',x:pbx,y:pby,w:40,h:40,pad:10});
  rrect(pbx,pby,40,40,12); ctx.fillStyle='rgba(9,13,24,.7)'; ctx.fill();
  ctx.strokeStyle='#39435c'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle=BONE; ctx.fillRect(pbx+13,pby+12,5,16); ctx.fillRect(pbx+22,pby+12,5,16);
  drawMinimap(vw-SAFE.r-12,pby+50);
  // combo pips + buttons
  drawTouchControls();
  // shop hint
  let hint=null;
  for(const pr of F.props){
    if(pr.kind==='ware'&&!pr.sold&&hyp(P.x-pr.x,P.y-pr.y)<1.05) hint=pr.item.name+' - '+pr.item.desc+' - '+pr.item.cost+'g - strike to buy';
    if(pr.kind==='goldchest'&&!pr.open&&hyp(P.x-pr.x,P.y-pr.y)<1.6&&R.keys<1) hint='a golden chest - it wants a key';
  }
  if(hint){ setFont(12,700); ctx.textAlign='center';
    const hw2=ctx.measureText(hint).width+24, hy2=vh>vw?vh-SAFE.b-176:SAFE.t+64;
    rrect(vw/2-hw2/2,hy2,hw2,26,13); ctx.fillStyle='rgba(9,13,24,.85)'; ctx.fill();
    ctx.strokeStyle='#4a3a28'; ctx.stroke();
    ctx.fillStyle=GOLD; ctx.fillText(hint,vw/2,hy2+13); }
  // banner
  if(S.bannerT>0&&S.banner){
    const a=clamp(S.bannerT<0.4?S.bannerT/0.4:(S.bannerT>2?1:(S.bannerT-0.4)/0.4+0.6),0,1);
    ctx.globalAlpha=Math.min(1,a);
    setFont(Math.min(30,vw*0.065),900); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.lineWidth=5;
    ctx.strokeText(S.banner.t1,vw/2,vh*0.24);
    ctx.fillStyle=S.banner.col||AMBER; ctx.fillText(S.banner.t1,vw/2,vh*0.24);
    if(S.banner.t2){ setFont(13,600);
      ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.lineWidth=3;
      ctx.strokeText(S.banner.t2,vw/2,vh*0.24+26);
      ctx.fillStyle=BONE; ctx.fillText(S.banner.t2,vw/2,vh*0.24+26); }
    ctx.globalAlpha=1;
  }
}
function drawTouchControls(){
  // stick
  const active=IN.stick.id>=0;
  const ax=active?IN.stick.ox:SAFE.l+82, ay=active?IN.stick.oy:vh-SAFE.b-104;
  ctx.globalAlpha=active?0.45:0.2;
  ctx.strokeStyle=BONE; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ax,ay,46,0,TAU); ctx.stroke();
  ctx.fillStyle='rgba(200,210,230,.5)';
  ctx.beginPath(); ctx.arc(ax+IN.stick.dx,ay+IN.stick.dy,20,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
  // ATK
  const bx=vw-SAFE.r-64, by=vh-SAFE.b-118;
  ctx.globalAlpha=0.85;
  ctx.beginPath(); ctx.arc(bx,by,44,0,TAU);
  ctx.fillStyle='rgba(255,132,44,.14)'; ctx.fill();
  ctx.strokeStyle=AMBER; ctx.lineWidth=2; ctx.stroke();
  ctx.save(); ctx.translate(bx,by); ctx.rotate(-0.7);
  ctx.strokeStyle='#ffd9a0'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(0,-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8,6); ctx.lineTo(8,6); ctx.stroke();
  ctx.restore();
  setFont(10,800); ctx.textAlign='center'; ctx.fillStyle='rgba(255,217,160,.8)';
  ctx.fillText('ATK',bx,by+30);
  // combo pips
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.arc(bx-14+i*14,by-56,4,0,TAU);
    ctx.fillStyle=(P.atk.t>0||P.atk.gap>0)&&i<P.atk.step+(P.atk.t>0?1:0)?AMBER:'rgba(120,130,160,.3)';
    ctx.fill();
  }
  // ROLL
  const rx=vw-SAFE.r-150, ry=vh-SAFE.b-52;
  ctx.beginPath(); ctx.arc(rx,ry,34,0,TAU);
  ctx.fillStyle='rgba(140,160,220,.1)'; ctx.fill();
  ctx.strokeStyle='#7c8aa6'; ctx.lineWidth=2; ctx.stroke();
  const cdFrac=P?clamp(P.roll.cd/(R.stats.rollCd+CFG.ROLL_T),0,1):0;
  if(cdFrac>0){ ctx.fillStyle='rgba(124,138,166,.3)';
    ctx.beginPath(); ctx.moveTo(rx,ry);
    ctx.arc(rx,ry,34,-Math.PI/2,-Math.PI/2+TAU*cdFrac); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle='#c9d2e8'; ctx.lineWidth=3.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(rx,ry,13,0.6,4.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx+16,ry-7); ctx.lineTo(rx+7,ry-14); ctx.lineTo(rx+17,ry-16); ctx.closePath();
  ctx.fillStyle='#c9d2e8'; ctx.fill();
  setFont(10,800); ctx.fillStyle='rgba(201,210,232,.8)'; ctx.fillText('ROLL',rx,ry+48);
  ctx.globalAlpha=1;
}
function drawMinimap(right,top){
  let minx=99,miny=99,maxx=-99,maxy=-99;
  const cells=F.arenaRoom?null:1;
  for(const r of F.rooms){ minx=Math.min(minx,r.gx||0); miny=Math.min(miny,r.gy||0);
    maxx=Math.max(maxx,r.gx||0); maxy=Math.max(maxy,r.gy||0); }
  const cs=13, gap=4;
  if(F.arenaRoom){ // boss floor: simple 3-room stack
    const w=cs+10, h=3*(cs+gap)+6, x=right-w, y=top;
    rrect(x,y,w,h,6); ctx.fillStyle='rgba(9,13,24,.62)'; ctx.fill();
    const cur=roomAt(P.x,P.y);
    for(let i=0;i<3;i++){
      const r=F.rooms[2-i]; // bonfire top
      rrect(x+5,y+4+i*(cs+gap),cs,cs,3);
      ctx.fillStyle=r.explored?(r===cur?'rgba(255,179,92,.85)':'rgba(140,150,180,.5)'):'rgba(80,90,120,.2)';
      ctx.fill();
      if(r.type==='arena'&&r.explored){ setFont(9,800); ctx.fillStyle=RED; ctx.textAlign='center';
        ctx.fillText('!',x+5+cs/2,y+4+i*(cs+gap)+cs/2+1); }
    }
    return;
  }
  const w=(maxx-minx+1)*(cs+gap)+8, h=(maxy-miny+1)*(cs+gap)+8;
  const x=right-w, y=top;
  rrect(x,y,w,h,6); ctx.fillStyle='rgba(9,13,24,.62)'; ctx.fill();
  ctx.strokeStyle='rgba(70,80,110,.5)'; ctx.lineWidth=1; ctx.stroke();
  const cur=roomAt(P.x,P.y);
  // link stubs
  ctx.strokeStyle='rgba(140,150,180,.4)'; ctx.lineWidth=2;
  for(const l of F.links){
    const a=F.rooms[l[0]], b=F.rooms[l[1]];
    if(!a.explored&&!b.explored) continue;
    const ax=x+4+(a.gx-minx)*(cs+gap)+cs/2, ay=y+4+(a.gy-miny)*(cs+gap)+cs/2;
    const bx=x+4+(b.gx-minx)*(cs+gap)+cs/2, by=y+4+(b.gy-miny)*(cs+gap)+cs/2;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  for(const r of F.rooms){
    const rx=x+4+(r.gx-minx)*(cs+gap), ry=y+4+(r.gy-miny)*(cs+gap);
    if(!r.explored){
      let adjExp=false;
      for(const l of F.links){ const o=F.rooms[l[0]]===r?F.rooms[l[1]]:(F.rooms[l[1]]===r?F.rooms[l[0]]:null);
        if(o&&o.explored){ adjExp=true; break; } }
      if(!adjExp) continue;
      rrect(rx,ry,cs,cs,3); ctx.fillStyle='rgba(80,90,120,.18)'; ctx.fill();
      continue;
    }
    rrect(rx,ry,cs,cs,3);
    ctx.fillStyle=r===cur?'rgba(255,179,92,.85)':'rgba(140,150,180,.45)'; ctx.fill();
    const cx2=rx+cs/2, cy2=ry+cs/2;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(r.type==='shrine'){ ctx.save(); ctx.translate(cx2,cy2); ctx.rotate(Math.PI/4);
      ctx.fillStyle=CYAN; ctx.fillRect(-2.6,-2.6,5.2,5.2); ctx.restore(); }
    else if(r.type==='shop') drawCoin(cx2,cy2,3.4);
    else if(r.type==='exit'){ ctx.fillStyle=AMBER;
      ctx.beginPath(); ctx.moveTo(cx2-3.4,cy2-2.6); ctx.lineTo(cx2+3.4,cy2-2.6); ctx.lineTo(cx2,cy2+3.4);
      ctx.closePath(); ctx.fill(); }
    else if(r.type==='treasure'){ ctx.fillStyle=GOLD; ctx.fillRect(cx2-3,cy2-2.2,6,4.4); }
  }
  if(cur){ const t2=S.t*4;
    ctx.fillStyle='rgba(255,255,255,'+(0.6+0.4*Math.sin(t2))+')';
    ctx.beginPath();
    ctx.arc(x+4+(cur.gx-minx)*(cs+gap)+cs/2+((P.x-cur.rx)/cur.rw-0.5)*cs*0.7,
            y+4+(cur.gy-miny)*(cs+gap)+cs/2+((P.y-cur.ry)/cur.rh-0.5)*cs*0.7,1.8,0,TAU); ctx.fill(); }
}
/* --------------------------------- screens -------------------------------- */
function drawTitleBg(){
  ctx.fillStyle=INK; ctx.fillRect(0,0,vw,vh);
  // distant hall floor
  const gy=vh*0.46;
  const g=ctx.createLinearGradient(0,gy-vh*0.2,0,vh);
  g.addColorStop(0,'#070a14'); g.addColorStop(0.5,'#0d1322'); g.addColorStop(1,'#05070d');
  ctx.fillStyle=g; ctx.fillRect(0,gy-vh*0.2,vw,vh);
  // gate: sits between the subtitle and the DELVE button
  const port2=vh>vw;
  const gx=vw/2, gBot=vh*0.525;
  const gTop=vh*(port2?0.285:0.30);
  const gh2=Math.max(50,gBot-gTop);
  const gw2=Math.min(vw*0.24,gh2*0.62);
  ctx.save(); ctx.translate(gx,gBot);
  const warmA=0.55+0.14*Math.sin(S.t*2.2);
  const gg=ctx.createRadialGradient(0,-gh2*0.35,10,0,-gh2*0.35,gw2*2.2);
  gg.addColorStop(0,'rgba(255,150,60,'+warmA*0.4+')');
  gg.addColorStop(1,'rgba(255,120,40,0)');
  ctx.fillStyle=gg; ctx.fillRect(-gw2*2.4,-gh2*1.5,gw2*4.8,gh2*2.2);
  // doorway: warm light inside
  const arcY=-gh2+gw2;
  ctx.beginPath();
  ctx.moveTo(-gw2,0); ctx.lineTo(-gw2,arcY);
  ctx.arc(0,arcY,gw2,Math.PI,0);
  ctx.lineTo(gw2,0); ctx.closePath();
  const ig=ctx.createLinearGradient(0,-gh2,0,0);
  ig.addColorStop(0,'#12101c');
  ig.addColorStop(0.55,'rgba(120,52,20,'+(0.4+0.2*warmA)+')');
  ig.addColorStop(1,'rgba(255,150,60,'+(0.55*warmA+0.25)+')');
  ctx.fillStyle=ig; ctx.fill();
  // bars over the light
  ctx.strokeStyle='#141a2c'; ctx.lineWidth=Math.max(5,gw2*0.1); ctx.lineCap='round';
  const slats=5;
  for(let i=0;i<slats;i++){
    const sx=-gw2*0.66+i*(gw2*1.32/(slats-1));
    const topY=arcY-Math.sqrt(Math.max(0,gw2*gw2-sx*sx))+4;
    ctx.beginPath(); ctx.moveTo(sx,topY); ctx.lineTo(sx,-2); ctx.stroke();
  }
  ctx.strokeStyle='#141a2c'; ctx.lineWidth=Math.max(4,gw2*0.08);
  ctx.beginPath(); ctx.moveTo(-gw2,-gh2*0.42); ctx.lineTo(gw2,-gh2*0.42); ctx.stroke();
  // frame
  ctx.beginPath();
  ctx.moveTo(-gw2,0); ctx.lineTo(-gw2,arcY);
  ctx.arc(0,arcY,gw2,Math.PI,0);
  ctx.lineTo(gw2,0);
  ctx.strokeStyle='#33405e'; ctx.lineWidth=6; ctx.stroke();
  ctx.strokeStyle='#1c2438'; ctx.lineWidth=2; ctx.stroke();
  // floor light spill
  const sg=ctx.createRadialGradient(0,8,4,0,8,gw2*1.5);
  sg.addColorStop(0,'rgba(255,150,60,'+warmA*0.4+')'); sg.addColorStop(1,'rgba(255,120,40,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.ellipse(0,12,gw2*1.7,gw2*0.4,0,0,TAU); ctx.fill();
  ctx.restore();
  // motes
  ctx.globalCompositeOperation='lighter';
  for(const m of MOTES){
    const s=m.s*5*m.z;
    ctx.globalAlpha=0.3+0.3*m.z*(0.6+0.4*Math.sin(S.t*2+m.ph));
